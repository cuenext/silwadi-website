name: Abu Dhabi non-breaking regression

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'tests/test_abu_dhabi_nonbreaking.py'
      - '.github/workflows/abu-dhabi-nonbreaking-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Abu Dhabi stays on one line in visible text
        run: python -m unittest tests.test_abu_dhabi_nonbreaking
