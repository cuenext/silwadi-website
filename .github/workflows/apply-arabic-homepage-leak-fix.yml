name: Apply Arabic homepage translation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-arabic-homepage-leak-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace leaked English UI copy with Arabic
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('ar/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Dental implant care': 'رعاية زراعة الأسنان',
              'Hollywood Smile &amp; professional whitening': 'هوليوود سمايل والتبييض الاحترافي',
              'Learn about Silwadi Dental Centre since 1980': 'تعرّف على مركز سلوادي لطب الأسنان منذ عام 1980',
              'View Bani Yas Tower and Al Raha Mall locations': 'عرض فرعي برج بني ياس والراحة مول',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected source string not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify replacements locally
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('ar/index.html').read_text(encoding='utf-8')
          forbidden=['Dental implant care','Hollywood Smile &amp; professional whitening','Learn about Silwadi Dental Centre since 1980','View Bani Yas Tower and Al Raha Mall locations']
          assert not [x for x in forbidden if x in s]
          required=['رعاية زراعة الأسنان','هوليوود سمايل والتبييض الاحترافي','تعرّف على مركز سلوادي لطب الأسنان منذ عام 1980','عرض فرعي برج بني ياس والراحة مول']
          assert not [x for x in required if x not in s]
          PY
      - name: Commit fix
        run: |
          git config user.name 'Silwadi QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ar/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove English leaks from Arabic homepage'
            git push origin HEAD:main
          fi
