name: Apply Arabic homepage quality fix v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved Arabic homepage fixes
        run: python3 scripts/apply_arabic_homepage_quality_fix.py
      - name: Commit if needed
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ar/index.html language.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: improve Arabic homepage wording and service translations [skip arabic build]"
          git push origin HEAD:main
