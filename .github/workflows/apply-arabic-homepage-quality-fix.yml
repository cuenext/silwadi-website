name: Apply Arabic homepage quality fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved Arabic copy fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          # --- Static Arabic homepage ---
          p = Path('ar/index.html')
          ar = p.read_text(encoding='utf-8')
          replacements = {
            '<strong>استكشف الخدمات</strong><em>اعثر على الرعاية المناسبة</em>': '<strong>استكشف الخدمات</strong><em>استعرض خدماتنا العلاجية</em>',
            '<strong>التأمين</strong><em>نقبل التأمين</em>': '<strong>التأمين</strong><em>استفسر عن التغطية التأمينية</em>',
            '<strong>الفروع</strong><em>زر المركز</em>': '<strong>الفروع</strong><em>ابحث عن أقرب فرع</em>',
            'نخدم <span class="nowrap-place">أبوظبي</span> منذ عام 1980': 'نخدم <span class="nowrap-place">مرضى أبوظبي</span> منذ عام 1980',
            'على مدى أكثر من أربعة عقود، ركّز مركز سلوادي لطب الأسنان على رعاية تضع احتياجات المريض أولاً، مع علاج مخصص واهتمام بالراحة والتوعية والتواصل الواضح.': 'منذ أكثر من أربعة عقود، يحرص مركز سلوادي لطب الأسنان على تقديم رعاية تضع المريض واحتياجاته في المقام الأول، مع خطط علاج مخصّصة واهتمام بالراحة والتوعية والتواصل الواضح.',
          }
          for old, new in replacements.items():
            if old not in ar:
              raise SystemExit(f'Missing expected Arabic homepage source: {old}')
            ar = ar.replace(old, new, 1)
          p.write_text(ar, encoding='utf-8')

          # --- Dynamic English->Arabic language switching ---
          p = Path('language.js')
          lang = p.read_text(encoding='utf-8')
          replacements = {
            "'Find the right care': 'اعثر على الرعاية المناسبة',": "'Find the right care': 'استعرض خدماتنا العلاجية',",
            "'Insurance accepted': 'نقبل التأمين',": "'Insurance accepted': 'استفسر عن التغطية التأمينية',",
            "'Visit the centre': 'زر المركز',": "'Visit the centre': 'ابحث عن أقرب فرع',",
            "'Serving Abu Dhabi since 1980.': 'نخدم أبوظبي منذ عام 1980.',": "'Serving Abu Dhabi since 1980.': 'نخدم مرضى أبوظبي منذ عام 1980.',",
            "'For more than four decades, Silwadi Dental Center has focused on patient-centred care, personalized treatment, comfort, patient education and open communication.': 'على مدى أكثر من أربعة عقود، ركّز مركز سلوادي لطب الأسنان على رعاية تتمحور حول المريض، وعلاج مخصص، وراحة المراجع، والتوعية الصحية، والتواصل الواضح.',": "'For more than four decades, Silwadi Dental Center has focused on patient-centred care, personalized treatment, comfort, patient education and open communication.': 'منذ أكثر من أربعة عقود، يحرص مركز سلوادي لطب الأسنان على تقديم رعاية تضع المريض واحتياجاته في المقام الأول، مع خطط علاج مخصّصة واهتمام بالراحة والتوعية والتواصل الواضح.',",
          }
          for old, new in replacements.items():
            if old not in lang:
              raise SystemExit(f'Missing expected language.js source: {old}')
            lang = lang.replace(old, new, 1)

          marker = '  Object.assign(arabic, {\n    "Open navigation": "فتح القائمة",'
          additions = '''  Object.assign(arabic, {
    'Cosmetic Dentistry & Teeth Whitening': 'تجميل الأسنان وتبييض الأسنان',
    'Specialist restorative care for repairing or replacing teeth with crowns, bridges, veneers, dentures and other prosthetic solutions.': 'رعاية تخصصية لترميم الأسنان أو تعويضها بالتيجان والجسور والقشور والأطقم وغيرها من الحلول التعويضية.',
    'Dental implants replace missing tooth roots and can support crowns, bridges or dentures after clinical assessment and treatment planning.': 'تعوّض زراعة الأسنان جذور الأسنان المفقودة ويمكن أن تدعم التيجان أو الجسور أو الأطقم بعد التقييم والتخطيط العلاجي.',
    'Aesthetic dental care including Hollywood Smile planning, veneers, smile design and professional teeth whitening after assessment.': 'رعاية تجميلية تشمل هوليوود سمايل والقشور وتصميم الابتسامة وتبييض الأسنان الاحترافي بعد التقييم.'
  });

'''
          if "'Specialist restorative care for repairing or replacing teeth with crowns, bridges, veneers, dentures and other prosthetic solutions.'" not in lang:
            if marker not in lang:
              raise SystemExit('Could not find language.js insertion marker')
            lang = lang.replace(marker, additions + marker, 1)

          p.write_text(lang, encoding='utf-8')
          PY
      - name: Verify approved Arabic copy before commit
        run: |
          python3 <<'PY'
          from pathlib import Path
          ar = Path('ar/index.html').read_text(encoding='utf-8')
          lang = Path('language.js').read_text(encoding='utf-8')
          checks = [
            '<strong>استكشف الخدمات</strong><em>استعرض خدماتنا العلاجية</em>',
            '<strong>التأمين</strong><em>استفسر عن التغطية التأمينية</em>',
            '<strong>الفروع</strong><em>ابحث عن أقرب فرع</em>',
            'نخدم <span class="nowrap-place">مرضى أبوظبي</span> منذ عام 1980',
            'منذ أكثر من أربعة عقود، يحرص مركز سلوادي لطب الأسنان على تقديم رعاية تضع المريض واحتياجاته في المقام الأول، مع خطط علاج مخصّصة واهتمام بالراحة والتوعية والتواصل الواضح.',
          ]
          assert all(x in ar for x in checks)
          dynamic = [
            "'Find the right care': 'استعرض خدماتنا العلاجية'",
            "'Insurance accepted': 'استفسر عن التغطية التأمينية'",
            "'Visit the centre': 'ابحث عن أقرب فرع'",
            "'Cosmetic Dentistry & Teeth Whitening': 'تجميل الأسنان وتبييض الأسنان'",
            "'Specialist restorative care for repairing or replacing teeth with crowns, bridges, veneers, dentures and other prosthetic solutions.'",
            "'Dental implants replace missing tooth roots and can support crowns, bridges or dentures after clinical assessment and treatment planning.'",
            "'Aesthetic dental care including Hollywood Smile planning, veneers, smile design and professional teeth whitening after assessment.'",
          ]
          assert all(x in lang for x in dynamic)
          PY
      - name: Commit changes
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ar/index.html language.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve Arabic homepage wording and service translations [skip arabic build]"
          git push origin HEAD:main
