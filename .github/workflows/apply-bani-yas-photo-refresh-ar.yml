name: Align Arabic Bani Yas photography

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Arabic pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('ar/locations.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/location-pages.css?v=20260904-3', '/location-pages.css?v=20260906-bani-yas-photos-1', 1)
          s = re.sub(r'<meta property="og:image" content="[^"]+">', '<meta property="og:image" content="https://silwadi.ae/assets/locations/bani-yas-reception.webp">', s, count=1)

          old = '<img src="/assets/locations/bani-yas-treatment-room.webp?v=20260904-4" alt="غرفة علاج أسنان في مركز د. منير سلوادي، برج بني ياس على شارع الكورنيش الغربي في أبوظبي" width="1000" height="557" decoding="async">'
          new = '<img src="/assets/locations/bani-yas-reception.webp" alt="منطقة الاستقبال في مركز د. منير سلوادي لطب الأسنان، برج بني ياس في أبوظبي" width="800" height="533" decoding="async">'
          if new not in s:
              if old not in s:
                  raise SystemExit('Arabic Bani Yas lead image markup not found')
              s = s.replace(old, new, 1)

          gallery = '''<section class="branch-gallery branch-gallery--bani" aria-labelledby="bani-gallery-title"><div class="container"><div class="branch-gallery__intro"><div><p class="eyebrow">برج بني ياس</p><h2 id="bani-gallery-title">داخل المركز</h2></div></div><div class="branch-gallery__grid"><figure class="branch-gallery__item"><img src="/assets/locations/bani-yas-treatment-room-main.webp" alt="غرفة علاج أسنان في مركز سلوادي لطب الأسنان، برج بني ياس في أبوظبي" width="600" height="400" loading="lazy" decoding="async"></figure><figure class="branch-gallery__item"><img src="/assets/locations/bani-yas-treatment-room-chair.webp" alt="كرسي أسنان وغرفة علاج في مركز سلوادي لطب الأسنان، برج بني ياس" width="700" height="468" loading="lazy" decoding="async"></figure><figure class="branch-gallery__item"><img src="/assets/locations/bani-yas-treatment-room-wide.webp" alt="غرفة علاج في فرع برج بني ياس بمركز سلوادي لطب الأسنان" width="700" height="467" loading="lazy" decoding="async"></figure><figure class="branch-gallery__item"><img src="/assets/locations/bani-yas-waiting-area.webp" alt="منطقة انتظار المرضى في مركز سلوادي لطب الأسنان، برج بني ياس" width="700" height="467" loading="lazy" decoding="async"></figure></div></div></section>'''
          marker = '</section><section class="location-branch location-branch--raha" id="al-raha">'
          if 'id="bani-gallery-title"' not in s:
              if marker not in s:
                  raise SystemExit('Arabic Bani/Al Raha boundary not found')
              s = s.replace(marker, '</section>' + gallery + '<section class="location-branch location-branch--raha" id="al-raha">', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('ar/index.html')
          s = p.read_text(encoding='utf-8')
          if 'alt="منطقة الاستقبال في مركز سلوادي لطب الأسنان، برج بني ياس"' not in s:
              pattern = r'(<article class="location-card location-card--current(?: reveal)?">)(<span class="location-status">[^<]+</span><h3>برج بني ياس</h3>)'
              replacement = (r'\1<img class="location-card__photo" src="/assets/locations/bani-yas-reception.webp" '
                             r'alt="منطقة الاستقبال في مركز سلوادي لطب الأسنان، برج بني ياس" width="800" height="533" loading="lazy" decoding="async">\2')
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('Arabic Bani Yas homepage card not found')

          if 'alt="مركز سلوادي لطب الأسنان في الراحة مول"' not in s:
              pattern = r'(<article class="location-card location-card--current(?: reveal)?">)(<span class="location-status">[^<]+</span><h3>الراحة مول</h3>)'
              replacement = (r'\1<img class="location-card__photo" src="/assets/locations/al-raha-exterior.webp?v=20260904-4" '
                             r'alt="مركز سلوادي لطب الأسنان في الراحة مول" width="600" height="444" loading="lazy" decoding="async">\2')
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('Arabic Al Raha homepage card not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify Arabic alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          loc = Path('ar/locations.html').read_text(encoding='utf-8')
          home = Path('ar/index.html').read_text(encoding='utf-8')
          assert '/location-pages.css?v=20260906-bani-yas-photos-1' in loc
          assert 'https://silwadi.ae/assets/locations/bani-yas-reception.webp' in loc
          assert 'id="bani-gallery-title">داخل المركز</h2>' in loc
          for asset in [
              '/assets/locations/bani-yas-reception.webp',
              '/assets/locations/bani-yas-treatment-room-main.webp',
              '/assets/locations/bani-yas-treatment-room-chair.webp',
              '/assets/locations/bani-yas-treatment-room-wide.webp',
              '/assets/locations/bani-yas-waiting-area.webp',
          ]:
              assert asset in loc, asset
          assert 'bani-yas-treatment-room.webp?v=20260904-4' not in loc
          assert home.count('location-card__photo') == 2
          assert 'alt="منطقة الاستقبال في مركز سلوادي لطب الأسنان، برج بني ياس"' in home
          assert 'alt="مركز سلوادي لطب الأسنان في الراحة مول"' in home
          PY
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-bani-yas-photo-refresh-ar.yml
          git add ar/index.html ar/locations.html
          git commit -m "feat: align Arabic Bani Yas photography [skip arabic build]"
          git push
