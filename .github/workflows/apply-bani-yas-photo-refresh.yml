name: Apply Bani Yas photo refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: RED - prove the new presentation is not present yet
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          loc = Path('locations.html').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          assert 'bani-gallery-title' in loc
          assert 'bani-yas-reception.webp' in home
          PY

      - name: Patch Bani Yas presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Locations page: use the new reception photograph as the Bani Yas lead image,
          # add a compact curated gallery, and refresh cache/OG metadata.
          p = Path('locations.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('location-pages.css?v=20260904-3', 'location-pages.css?v=20260906-bani-yas-photos-1', 1)
          s = re.sub(
              r'<meta property="og:image" content="[^"]+">',
              '<meta property="og:image" content="https://silwadi.ae/assets/locations/bani-yas-reception.webp">',
              s,
              count=1,
          )
          old_hero = ('<img src="assets/locations/bani-yas-treatment-room.webp?v=20260904-4" '
                      'alt="Dental treatment room at Dr. Munir Silwadi Dental Centre, Bani Yas Tower on W Corniche Road in Abu Dhabi" '
                      'width="1000" height="557" decoding="async">')
          new_hero = ('<img src="assets/locations/bani-yas-reception.webp" '
                      'alt="Reception at Dr. Munir Silwadi Dental Centre, Bani Yas Tower in Abu Dhabi" '
                      'width="800" height="533" decoding="async">')
          if 'assets/locations/bani-yas-reception.webp" alt="Reception at Dr. Munir Silwadi Dental Centre' not in s:
              if old_hero not in s:
                  raise SystemExit('Expected Bani Yas hero markup was not found')
              s = s.replace(old_hero, new_hero, 1)

          gallery = '''<section class="branch-gallery branch-gallery--bani" aria-labelledby="bani-gallery-title"><div class="container"><div class="branch-gallery__intro"><div><p class="eyebrow">Bani Yas Tower</p><h2 id="bani-gallery-title">Inside the centre</h2></div></div><div class="branch-gallery__grid"><figure class="branch-gallery__item"><img src="assets/locations/bani-yas-treatment-room-main.webp" alt="Dental treatment room at Silwadi Dental Centre, Bani Yas Tower in Abu Dhabi" width="600" height="400" loading="lazy" decoding="async"></figure><figure class="branch-gallery__item"><img src="assets/locations/bani-yas-treatment-room-chair.webp" alt="Dental chair and clinical room at Silwadi Dental Centre, Bani Yas Tower" width="700" height="468" loading="lazy" decoding="async"></figure><figure class="branch-gallery__item"><img src="assets/locations/bani-yas-treatment-room-wide.webp" alt="Clinical treatment room at the Bani Yas Tower branch of Silwadi Dental Centre" width="700" height="467" loading="lazy" decoding="async"></figure><figure class="branch-gallery__item"><img src="assets/locations/bani-yas-waiting-area.webp" alt="Patient waiting area at Silwadi Dental Centre, Bani Yas Tower" width="700" height="467" loading="lazy" decoding="async"></figure></div></div></section>'''
          marker = '</section><section class="location-branch location-branch--raha" id="al-raha">'
          if 'bani-gallery-title' not in s:
              if marker not in s:
                  raise SystemExit('Expected Bani Yas/Al Raha boundary was not found')
              s = s.replace(marker, '</section>' + gallery + '<section class="location-branch location-branch--raha" id="al-raha">', 1)
          p.write_text(s, encoding='utf-8')

          # Homepage: give both location cards real photography while retaining the
          # existing content, actions, and information architecture.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'alt="Reception at Silwadi Dental Centre, Bani Yas Tower"' not in s:
              pattern = r'(<article class="location-card location-card--current(?: reveal)?">)(<span class="location-status">Current location</span><h3>Bani Yas Tower</h3>)'
              replacement = (r'\1<img class="location-card__photo" src="assets/locations/bani-yas-reception.webp" '
                             r'alt="Reception at Silwadi Dental Centre, Bani Yas Tower" width="800" height="533" loading="lazy" decoding="async">\2')
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Expected Bani Yas homepage card was not found')
          if 'alt="Silwadi Dental Centre at Al Raha Mall"' not in s:
              pattern = r'(<article class="location-card location-card--current(?: reveal)?">)(<span class="location-status">Now open</span><h3>Al Raha Mall</h3>)'
              replacement = (r'\1<img class="location-card__photo" src="assets/locations/al-raha-exterior.webp?v=20260904-4" '
                             r'alt="Silwadi Dental Centre at Al Raha Mall" width="600" height="444" loading="lazy" decoding="async">\2')
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Expected Al Raha homepage card was not found')
          p.write_text(s, encoding='utf-8')

          # Keep the homepage cards balanced and restrained: one consistent image crop,
          # no extra decorative boxes or layout changes.
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* Location card photography — Bani Yas refresh 2026-09-06 */\n.location-card__photo{display:block;width:calc(100% + 60px);height:180px;margin:-30px -30px 24px;object-fit:cover;object-position:center;border-bottom:1px solid var(--line);background:#dfe9e9}\n.location-card:first-child .location-card__photo{object-position:center 48%}\n@media(max-width:620px){.location-card__photo{height:168px}}\n'''
          if '.location-card__photo{' not in s:
              s += css
          p.write_text(s, encoding='utf-8')
          PY

      - name: GREEN - verify Bani Yas photo refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          loc = Path('locations.html').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')

          expected_location_assets = [
              'assets/locations/bani-yas-reception.webp',
              'assets/locations/bani-yas-treatment-room-main.webp',
              'assets/locations/bani-yas-treatment-room-chair.webp',
              'assets/locations/bani-yas-treatment-room-wide.webp',
              'assets/locations/bani-yas-waiting-area.webp',
          ]
          for asset in expected_location_assets:
              assert asset in loc, asset
          assert '<h2 id="bani-gallery-title">Inside the centre</h2>' in loc
          assert 'location-pages.css?v=20260906-bani-yas-photos-1' in loc
          assert 'https://silwadi.ae/assets/locations/bani-yas-reception.webp' in loc
          assert 'alt="Reception at Silwadi Dental Centre, Bani Yas Tower"' in home
          assert 'alt="Silwadi Dental Centre at Al Raha Mall"' in home
          assert home.count('location-card__photo') == 2
          assert '.location-card__photo{' in css
          assert 'bani-yas-treatment-room.webp?v=20260904-4' not in loc
          PY

      - name: Validate changed files
        run: |
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-bani-yas-photo-refresh.yml
          git add locations.html index.html styles.css
          git commit -m "feat: refresh Bani Yas location photography"
          git push
