name: Apply booking instant submit

on:
  push:
    branches:
      - fix/booking-instant-submit-20260914
    paths:
      - '.github/workflows/apply-booking-instant-submit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct booking submission
        run: |
          git fetch origin fix/booking-direct-email:refs/remotes/origin/fix/booking-direct-email
          python3 tools/apply_booking_instant_submit.py
          mkdir -p backend
          git show origin/fix/booking-direct-email:backend/booking-submit.php > backend/booking-submit.php
          git show origin/fix/booking-direct-email:backend/README.md > backend/README.md
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add booking-modal.js app.js contact.html ar/contact.html bilingual-routing.js backend
          git commit -m "fix: submit booking requests directly to appointments"
          git push
