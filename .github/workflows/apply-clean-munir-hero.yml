name: Apply clean Dr Munir homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-clean-munir-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify uploaded source image
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct
          p = Path('assets/munir-home-hero-clean')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Uploaded hero is not a valid PNG signature'
          width, height = struct.unpack('>II', data[16:24])
          assert width >= 1200 and height >= 600, f'Unexpected dimensions: {width}x{height}'
          print(f'Clean uploaded hero verified: {width}x{height}, {len(data)} bytes')
          PY
          cp assets/munir-home-hero-clean assets/munir-home-hero-clean.png
          cmp assets/munir-home-hero-clean assets/munir-home-hero-clean.png
          file assets/munir-home-hero-clean.png | grep -q 'PNG image data'

      - name: Update English and Arabic homepage hero
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, struct

          src = Path('assets/munir-home-hero-clean.png').read_bytes()
          width, height = struct.unpack('>II', src[16:24])
          version = '20260906-hero-clean-final'

          pages = {
              'index.html': {
                  'src': f'assets/munir-home-hero-clean.png?v={version}',
                  'alt': 'Dr. Munir Silwadi at Dr. Munir Silwadi Dental Centre',
              },
              'ar/index.html': {
                  'src': f'/assets/munir-home-hero-clean.png?v={version}',
                  'alt': 'الدكتور منير سلوادي في مركز الدكتور منير سلوادي لطب الأسنان',
              },
          }

          for filename, cfg in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              text, og_n = re.subn(
                  r'<meta property="og:image" content="https://silwadi\.ae/assets/[^"]*munir-home-hero[^"]*">',
                  '<meta property="og:image" content="https://silwadi.ae/assets/munir-home-hero-clean.png">',
                  text,
                  count=1,
              )
              assert og_n == 1, f'{filename}: OG image replacement count {og_n}'

              picture = (
                  f'<picture class="premium-home-hero__media">'
                  f'<img src="{cfg["src"]}" alt="{cfg["alt"]}" '
                  f'width="{width}" height="{height}" decoding="async" fetchpriority="high">'
                  f'</picture>'
              )
              text, pic_n = re.subn(
                  r'<picture class="premium-home-hero__media">.*?</picture>',
                  picture,
                  text,
                  count=1,
                  flags=re.S,
              )
              assert pic_n == 1, f'{filename}: hero picture replacement count {pic_n}'

              # Keep desktop composition centered; on phones focus the right-side portrait.
              text = text.replace(
                  '.premium-home-hero__media img{object-position:center top;filter:',
                  '.premium-home-hero__media img{object-position:76% top;filter:'
              )
              text = text.replace(
                  '@media(max-width:430px){.premium-home-hero__media img{object-position:center top}',
                  '@media(max-width:430px){.premium-home-hero__media img{object-position:76% top}'
              )

              assert cfg['src'] in text, f'{filename}: new hero src missing'
              assert 'munir-home-hero-20260906.webp?v=20260906-hero-2' not in text, f'{filename}: corrupt desktop WebP still referenced'
              assert 'munir-home-hero-mobile-20260906.webp?v=20260906-hero-2' not in text, f'{filename}: corrupt mobile WebP still referenced'
              assert 'https://silwadi.ae/assets/munir-home-hero-clean.png' in text, f'{filename}: OG image missing'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify final state and commit
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct
          data = Path('assets/munir-home-hero-clean.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', data[16:24])
          assert width >= 1200 and height >= 600
          for f in ('index.html','ar/index.html'):
              t = Path(f).read_text(encoding='utf-8')
              assert 'munir-home-hero-clean.png?v=20260906-hero-clean-final' in t
              assert 'munir-home-hero-20260906.webp?v=20260906-hero-2' not in t
          print('Final hero verification passed')
          PY
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html ar/index.html assets/munir-home-hero-clean.png
          git rm -f .github/workflows/hero-asset-integrity.yml || true
          git rm -f .github/workflows/apply-clean-munir-hero.yml
          git diff --cached --check
          git commit -m 'fix: use verified clean Dr Munir homepage hero [skip arabic build]'
          git push
