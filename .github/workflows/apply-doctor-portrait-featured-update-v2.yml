name: Apply doctor portrait and featured update v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-doctor-portrait-featured-update-v2.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply and verify requested doctor updates
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          repo = Path('.')
          img = {
              'nasr': 'ChatGPT Image Sep 7, 2026, 12_00_09 PM.png',
              'moheb': 'ChatGPT Image Sep 7, 2026, 12_06_32 PM.png',
              'ahmed': 'ChatGPT Image Sep 7, 2026, 12_28_03 PM.png',
              'moammar': 'ChatGPT Image Sep 7, 2026, 12_28_24 PM.png',
          }
          for filename in img.values():
              path = repo / 'assets' / filename
              assert path.exists(), f'Missing uploaded image: {path}'
              assert path.stat().st_size > 1000, f'Uploaded image looks empty: {path}'

          changed = set()
          def write_if_changed(path, text):
              old = path.read_text(encoding='utf-8')
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.add(path.as_posix())

          # 1) Replace the four doctor portrait references everywhere in text files.
          image_map = {
              'dr-nasr-keshkiea.webp': img['nasr'],
              'dr-moheb-silwadi.webp': img['moheb'],
              'dr-ahmed-el-shehri.webp': img['ahmed'],
              'dr-moammer-rifai.webp': img['moammar'],
              'dr-moammar-rifai.webp': img['moammar'],
          }
          text_exts = {'.html', '.js', '.json', '.css', '.xml'}
          for path in repo.rglob('*'):
              if path.is_dir() or '.git' in path.parts or path.suffix not in text_exts:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old_name, new_name in image_map.items():
                  pattern = re.compile(r'((?:\.\./)*|/)assets/doctors/optimized/' + re.escape(old_name) + r'(?:\?[^"\'\s<>)]*)?')
                  new = pattern.sub(lambda m, n=new_name: f'{m.group(1)}assets/{n}', new)
              write_if_changed(path, new)

          english_featured = '''<div class="featured-doctors"><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="assets/doctors/optimized/dr-munir-silwadi.webp" alt="Dr. Munir Silwadi" width="720" height="720" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>Dr. Munir Silwadi</h3><p>Specialist Prosthodontist &amp; Implantologist</p><a href="doctors/dr-munir-silwadi.html">View profile <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="assets/doctors/optimized/dr-hani-hasbini.webp" alt="Dr. Hani Hasbini" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>Dr. Hani Hasbini</h3><p>Consultant Orthodontist</p><a href="doctors/dr-hani-hasbini.html">View profile <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="assets/doctors/optimized/dr-kashmira-pawar-jayprakash.webp" alt="Dr. Kashmira Pawar Jayprakash" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>Dr. Kashmira Pawar Jayprakash</h3><p>Specialist Pediatric Dentist</p><a href="doctors/dr-kashmira-pawar-jayprakash.html">View profile <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="assets/doctors/optimized/dr-dana-awad.webp" alt="Dr. Dana Awad" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>Dr. Dana Awad</h3><p>General Dentist</p><a href="doctors/dr-dana-awad.html">View profile <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="assets/ChatGPT Image Sep 7, 2026, 12_28_03 PM.png" alt="Dr. Ahmed El Shehri" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>Dr. Ahmed El Shehri</h3><p>Specialist Endodontist</p><a href="doctors/dr-ahmed-el-shehri.html">View profile <span>→</span></a></div></article></div>'''
          arabic_featured = '''<div class="featured-doctors"><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="/assets/doctors/optimized/dr-munir-silwadi.webp" alt="د. منير سلوادي" width="720" height="720" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>د. منير سلوادي</h3><p>اختصاصي تركيبات وزراعة الأسنان</p><a href="/ar/doctors/dr-munir-silwadi.html">عرض الملف <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="/assets/doctors/optimized/dr-hani-hasbini.webp" alt="د. هاني حسبيني" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>د. هاني حسبيني</h3><p>استشاري تقويم أسنان</p><a href="/ar/doctors/dr-hani-hasbini.html">عرض الملف <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="/assets/doctors/optimized/dr-kashmira-pawar-jayprakash.webp" alt="د. كاشميرا باوار جايبراكاش" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>د. كاشميرا باوار جايبراكاش</h3><p>اختصاصي طب أسنان الأطفال</p><a href="/ar/doctors/dr-kashmira-pawar-jayprakash.html">عرض الملف <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="/assets/doctors/optimized/dr-dana-awad.webp" alt="د. دانا عوض" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>د. دانا عوض</h3><p>طبيب أسنان عام</p><a href="/ar/doctors/dr-dana-awad.html">عرض الملف <span>→</span></a></div></article><article class="doctor-card reveal"><div class="doctor-card__photo"><img src="/assets/ChatGPT Image Sep 7, 2026, 12_28_03 PM.png" alt="د. أحمد الشهري" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>د. أحمد الشهري</h3><p>اختصاصي علاج جذور الأسنان</p><a href="/ar/doctors/dr-ahmed-el-shehri.html">عرض الملف <span>→</span></a></div></article></div>'''
          english_avatars = '''<div class="team-proof__avatars" aria-label="Selected members of the Silwadi dental team"><span class="team-proof__avatar"><img src="assets/doctors/optimized/dr-munir-silwadi.webp" alt="Dr. Munir Silwadi" width="720" height="720" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="assets/doctors/optimized/dr-hani-hasbini.webp" alt="Dr. Hani Hasbini" width="600" height="600" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="assets/doctors/optimized/dr-kashmira-pawar-jayprakash.webp" alt="Dr. Kashmira Pawar Jayprakash" width="600" height="600" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="assets/doctors/optimized/dr-dana-awad.webp" alt="Dr. Dana Awad" width="600" height="600" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="assets/ChatGPT Image Sep 7, 2026, 12_28_03 PM.png" alt="Dr. Ahmed El Shehri" width="600" height="600" loading="lazy" decoding="async"></span></div></div></section><nav class="care-shortcuts"'''
          arabic_avatars = '''<div class="team-proof__avatars" aria-label="أعضاء مختارون من فريق مركز سلوادي"><span class="team-proof__avatar"><img src="/assets/doctors/optimized/dr-munir-silwadi.webp" alt="د. منير سلوادي" width="720" height="720" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="/assets/doctors/optimized/dr-hani-hasbini.webp" alt="د. هاني حسبيني" width="600" height="600" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="/assets/doctors/optimized/dr-kashmira-pawar-jayprakash.webp" alt="د. كاشميرا باوار جايبراكاش" width="600" height="600" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="/assets/doctors/optimized/dr-dana-awad.webp" alt="د. دانا عوض" width="600" height="600" loading="lazy" decoding="async"></span><span class="team-proof__avatar"><img src="/assets/ChatGPT Image Sep 7, 2026, 12_28_03 PM.png" alt="د. أحمد الشهري" width="600" height="600" loading="lazy" decoding="async"></span></div></div></section><nav class="care-shortcuts"'''

          for page, featured, avatars, link in [
              (Path('index.html'), english_featured, english_avatars, 'doctors.html'),
              (Path('ar/index.html'), arabic_featured, arabic_avatars, '/ar/doctors.html'),
          ]:
              text = page.read_text(encoding='utf-8')
              text2 = re.sub(r'<div class="team-proof__avatars"[^>]*>.*?</div></div></section><nav class="care-shortcuts"', avatars, text, count=1, flags=re.S)
              assert text2 != text or 'dr-kashmira-pawar-jayprakash.webp' in text2, f'Team avatars section not found/updated in {page}'
              text3 = re.sub(r'<div class="featured-doctors">.*?</div><div class="section-link reveal"><a href="' + re.escape(link) + r'">', featured + f'<div class="section-link reveal"><a href="{link}">', text2, count=1, flags=re.S)
              assert text3 != text2 or 'Dr. Kashmira Pawar Jayprakash' in text3 or 'د. كاشميرا باوار جايبراكاش' in text3, f'Featured doctors section not found/updated in {page}'
              write_if_changed(page, text3)

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          css2 = re.sub(r'(\.featured-doctors\{[^}]*grid-template-columns:)repeat\(4,1fr\)', r'\1repeat(5,minmax(0,1fr))', css, count=1)
          write_if_changed(css_path, css2)

          # Verify.
          def read(path): return Path(path).read_text(encoding='utf-8')
          old_names = list(image_map.keys())
          for path in repo.rglob('*'):
              if path.is_dir() or '.git' in path.parts or path.suffix not in {'.html', '.js', '.json'}:
                  continue
              text = path.read_text(encoding='utf-8')
              for old in old_names:
                  assert old not in text, f'Old portrait remains in {path}: {old}'

          for page in ['doctors.html', 'ar/doctors.html']:
              text = read(page)
              for filename in img.values():
                  assert filename in text, f'{filename} missing from {page}'

          profile_expectations = {
              'nasr': img['nasr'],
              'moheb': img['moheb'],
              'ahmed': img['ahmed'],
              'moammar': img['moammar'],
          }
          for page in Path('doctors').glob('*.html'):
              key = None
              for candidate in profile_expectations:
                  if candidate in page.name:
                      key = candidate
              if key:
                  assert profile_expectations[key] in read(page), f'{key} new image missing from {page}'
          for page in Path('ar/doctors').glob('*.html'):
              key = None
              for candidate in profile_expectations:
                  if candidate in page.name:
                      key = candidate
              if key:
                  assert profile_expectations[key] in read(page), f'{key} new image missing from {page}'

          for page, names in {
              'index.html': ['Dr. Munir Silwadi', 'Dr. Hani Hasbini', 'Dr. Kashmira Pawar Jayprakash', 'Dr. Dana Awad', 'Dr. Ahmed El Shehri'],
              'ar/index.html': ['د. منير سلوادي', 'د. هاني حسبيني', 'د. كاشميرا باوار جايبراكاش', 'د. دانا عوض', 'د. أحمد الشهري'],
          }.items():
              block = re.search(r'<div class="featured-doctors">(.*?)</div><div class="section-link reveal">', read(page), flags=re.S)
              assert block, f'Featured doctors block missing in {page}'
              actual = re.findall(r'<h3>(.*?)</h3>', block.group(1))
              assert actual == names, f'{page} featured order wrong: {actual}'
          assert 'repeat(5,minmax(0,1fr))' in read('styles.css'), 'Featured CSS is not set for five doctors'

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'ADVA Site Automation'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'actions@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', *sorted(changed)], check=True)
              subprocess.run(['git', 'commit', '-m', 'Update doctor portraits and homepage featured doctors [skip arabic build]'], check=True)
              subprocess.run(['git', 'push'], check=True)
              print('Committed update. Files changed:')
              for f in sorted(changed): print('-', f)
          else:
              print('No changes needed.')
          PY
