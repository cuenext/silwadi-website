name: Apply Fahed and Moheb final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch site
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, os, re
          VERSION='20260907-fahed-moheb-final'
          src_file=Path('.github/workflows/apply-fahed-moheb-home-20260907.yml')
          src_text=src_file.read_text(encoding='utf-8',errors='ignore')
          marker='WEBP_B64 = """'
          start=src_text.find(marker)
          if start<0: raise SystemExit('missing image data marker')
          start+=len(marker)
          end=src_text.find('"""',start)
          if end<0: raise SystemExit('missing image data end')
          b64=''.join(src_text[start:end].split())
          out=Path('assets/dr-fahed-new.webp')
          out.write_bytes(base64.b64decode(b64))
          data=out.read_bytes()
          if not (data.startswith(b'RIFF') and data[8:12]==b'WEBP'): raise SystemExit('bad fahed webp')
          print('Wrote', out, len(data))
          changed=set()
          def save(p,t,n):
              if n!=t:
                  p.write_text(n,encoding='utf-8'); changed.add(p.as_posix())
          pats=[
              re.compile(r"(?P<prefix>(?:https://silwadi\.ae/|/|\.\./)?assets/)doctors/optimized/dr-fahed-khalil\.webp(?:\?v=[^\"'\s<]*)?"),
              re.compile(r"(?P<prefix>(?:https://silwadi\.ae/|/|\.\./)?assets/)doctors/dr-fahed-khalil\.png(?:\?v=[^\"'\s<]*)?"),
          ]
          for p in Path('.').rglob('*'):
              if p.is_dir() or '.git' in p.parts or p.suffix.lower() not in {'.html','.js','.json','.xml','.css'}: continue
              t=p.read_text(encoding='utf-8',errors='ignore'); n=t
              for pat in pats:
                  n=pat.sub(lambda m:m.group('prefix')+'dr-fahed-new.webp?v='+VERSION,n)
              n=n.replace('dr-fahed-new.webp.webp','dr-fahed-new.webp')
              save(p,t,n)
          portrait_re=re.compile(r'(<div class="consultant-portrait__frame"><img src=")[^"]+(")')
          og_re=re.compile(r'(<meta property="og:image" content=")[^"]+(")')
          schema_re=re.compile(r'("image":")[^"]+(")')
          for rel,src in {'doctors/dr-fahed-khalil.html':'../assets/dr-fahed-new.webp?v='+VERSION,'ar/doctors/dr-fahed-khalil.html':'/assets/dr-fahed-new.webp?v='+VERSION}.items():
              p=Path(rel); t=p.read_text(encoding='utf-8'); n,c=portrait_re.subn(r'\1'+src+r'\2',t,count=1)
              if c!=1: raise SystemExit('no portrait '+rel)
              n,c=og_re.subn(r'\1https://silwadi.ae/assets/dr-fahed-new.webp\2',n,count=1)
              if c!=1: raise SystemExit('no og '+rel)
              n,c=schema_re.subn(r'\1https://silwadi.ae/assets/dr-fahed-new.webp\2',n,count=1)
              if c!=1: raise SystemExit('no schema '+rel)
              save(p,t,n)
          def section(t):
              s=t.find('<section class="section" id="doctors">')
              if s<0: raise SystemExit('no home doctors')
              e=t.find('</section>',s)
              if e<0: raise SystemExit('no home section end')
              return s,e+10,t[s:e+10]
          def add_moheb(path,ar=False):
              p=Path(path); t=p.read_text(encoding='utf-8'); s,e,sec=section(t)
              if 'dr-moheb-silwadi.html' in sec: return
              if ar:
                  card='<article class="doctor-card reveal"><div class="doctor-card__photo"><img src="/assets/dr-moheb-new.webp?v='+VERSION+'" alt="د. مهيب سلوادي" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>د. مهيب سلوادي</h3><p>طبيب أسنان عام</p><a href="/ar/doctors/dr-moheb-silwadi.html">عرض الملف <span>→</span></a></div></article>'; name='د. منير سلوادي'
              else:
                  card='<article class="doctor-card reveal"><div class="doctor-card__photo"><img src="assets/dr-moheb-new.webp?v='+VERSION+'" alt="Dr. Moheb Silwadi" width="600" height="600" loading="lazy" decoding="async"></div><div class="doctor-card__body"><h3>Dr. Moheb Silwadi</h3><p>General Dentist</p><a href="doctors/dr-moheb-silwadi.html">View profile <span>→</span></a></div></article>'; name='Dr. Munir Silwadi'
              r=re.compile(r'<article class="doctor-card reveal">(?:(?!</article>).)*?<h3>'+re.escape(name)+r'</h3>.*?</article>',re.S)
              m=r.search(sec)
              if not m: raise SystemExit('no munir card '+path)
              save(p,t,t[:s]+sec[:m.end()]+card+sec[m.end():]+t[e:])
          add_moheb('index.html',False); add_moheb('ar/index.html',True)
          css=Path('styles.css'); t=css.read_text(encoding='utf-8')
          n=t.replace('.featured-doctors{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}', '.featured-doctors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}')
          if n==t and 'grid-template-columns:repeat(auto-fit,minmax(170px,1fr))' not in t: n=t+'\n.featured-doctors{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}\n'
          save(css,t,n)
          if '<meta name="google-site-verification" content="D04F_KM2zspLqt5BKQidBerlHgPB9dc_ngJSAbPDEuE" />' not in Path('index.html').read_text(encoding='utf-8'): raise SystemExit('verification tag changed')
          for rel in ['doctors.html','ar/doctors.html','doctors/dr-fahed-khalil.html','ar/doctors/dr-fahed-khalil.html']:
              if 'dr-fahed-new.webp' not in Path(rel).read_text(encoding='utf-8'): raise SystemExit('fahed missing '+rel)
          for rel,names in {'index.html':['Dr. Munir Silwadi','Dr. Moheb Silwadi'],'ar/index.html':['د. منير سلوادي','د. مهيب سلوادي']}.items():
              _,_,sec=section(Path(rel).read_text(encoding='utf-8'))
              found=re.findall(r'<h3>(.*?)</h3>',sec)
              if found[:2]!=names: raise SystemExit('bad home order '+rel+' '+str(found[:3]))
          bad=[]
          for p in Path('.').rglob('*'):
              if p.is_dir() or '.git' in p.parts or p.suffix.lower() not in {'.html','.js','.json','.xml','.css'}: continue
              if '.webp.webp' in p.read_text(encoding='utf-8',errors='ignore'): bad.append(p.as_posix())
          if bad: raise SystemExit('double webp '+str(bad))
          print('Changed files:', sorted(changed)); print('Verification passed')
          PY
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/apply-fahed-moheb-home-20260907.yml .github/workflows/apply-fahed-moheb-home-20260907-v2.yml .github/fahed-moheb-trigger-20260907.txt .github/fahed-moheb-trigger-20260907-v3.txt
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "No changes to commit"; else git commit -m "Update Dr Fahed portrait and add Moheb to homepage [skip arabic build]" && git push; fi
