          asset = Path("assets/dr-fahed-new.webp")
          asset.write_bytes(base64.b64decode(WEBP_B64))
          data = asset.read_bytes()
          if not (data.startswith(b"RIFF") and data[8:12] == b"WEBP"):
              raise SystemExit("Generated Dr Fahed asset is not a valid WebP")
          if len(data) < 8000:
              raise SystemExit(f"Generated Dr Fahed asset is suspiciously small: {len(data)} bytes")
          print(f"Wrote {asset} ({len(data)} bytes)")

          changed = set()

          def write_if_changed(path: Path, text: str, new: str):
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.add(path.as_posix())

          # Replace old Dr. Fahed portrait references across static site files.
          old_fahed_patterns = [
              re.compile(r'(?P<prefix>(?:https://silwadi\.ae/|/|\.\./)?assets/)doctors/optimized/dr-fahed-khalil\.webp(?:\?v=[^"\'\s<]*)?'),
              re.compile(r'(?P<prefix>(?:https://silwadi\.ae/|/|\.\./)?assets/)doctors/dr-fahed-khalil\.png(?:\?v=[^"\'\s<]*)?'),
          ]

          def fahed_repl(match):
              return match.group("prefix") + "dr-fahed-new.webp?v=" + VERSION

          for path in Path(".").rglob("*"):
              if path.is_dir() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".html", ".js", ".json", ".xml", ".css"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              new = text
              for pattern in old_fahed_patterns:
                  new = pattern.sub(fahed_repl, new)
              new = new.replace("dr-fahed-new.webp.webp", "dr-fahed-new.webp")
              write_if_changed(path, text, new)

          # Force correct Dr. Fahed profile portrait paths and social/schema image URLs.
          fahed_profiles = {
              "doctors/dr-fahed-khalil.html": "../assets/dr-fahed-new.webp?v=" + VERSION,
              "ar/doctors/dr-fahed-khalil.html": "/assets/dr-fahed-new.webp?v=" + VERSION,
          }
          portrait_re = re.compile(r'(<div class="consultant-portrait__frame"><img src=")[^"]+(")')
          og_re = re.compile(r'(<meta property="og:image" content=")[^"]+(")')
          schema_image_re = re.compile(r'("image":")[^"]+(")')

          for rel, src in fahed_profiles.items():
              path = Path(rel)
              if not path.exists():
                  raise SystemExit(f"Missing expected Dr Fahed profile page: {rel}")
              text = path.read_text(encoding="utf-8")
              new, n = portrait_re.subn(r"\1" + src + r"\2", text, count=1)
              if n != 1:
                  raise SystemExit(f"Could not update profile portrait in {rel}")
              absolute = "https://silwadi.ae/assets/dr-fahed-new.webp"
              new, n = og_re.subn(r"\1" + absolute + r"\2", new, count=1)
              if n != 1:
                  raise SystemExit(f"Could not update og:image in {rel}")
              new, n = schema_image_re.subn(r"\1" + absolute + r"\2", new, count=1)
              if n != 1:
                  raise SystemExit(f"Could not update schema image in {rel}")
              write_if_changed(path, text, new)

          def extract_doctors_section(text: str):
              start = text.find('<section class="section" id="doctors">')
              if start < 0:
                  raise SystemExit("Homepage doctors section not found")
              end = text.find("</section>", start)
              if end < 0:
                  raise SystemExit("Homepage doctors section end not found")
              end += len("</section>")
              return start, end, text[start:end]

          def add_moheb_home_card(path_str: str, arabic: bool):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              start, end, section = extract_doctors_section(text)

              if "dr-moheb-silwadi.html" in section:
                  print(f"Moheb already present in homepage doctors section: {path_str}")
                  return

              if arabic:
                  moheb_card = (
                      '<article class="doctor-card reveal"><div class="doctor-card__photo">'
                      '<img src="/assets/dr-moheb-new.webp?v=' + VERSION + '" alt="د. مهيب سلوادي" width="600" height="600" loading="lazy" decoding="async">'
                      '</div><div class="doctor-card__body"><h3>د. مهيب سلوادي</h3><p>طبيب أسنان عام</p>'
                      '<a href="/ar/doctors/dr-moheb-silwadi.html">عرض الملف <span>→</span></a></div></article>'
                  )
                  munir_name = "د. منير سلوادي"
              else:
                  moheb_card = (
                      '<article class="doctor-card reveal"><div class="doctor-card__photo">'
                      '<img src="assets/dr-moheb-new.webp?v=' + VERSION + '" alt="Dr. Moheb Silwadi" width="600" height="600" loading="lazy" decoding="async">'
                      '</div><div class="doctor-card__body"><h3>Dr. Moheb Silwadi</h3><p>General Dentist</p>'
                      '<a href="doctors/dr-moheb-silwadi.html">View profile <span>→</span></a></div></article>'
                  )
                  munir_name = "Dr. Munir Silwadi"

              card_re = re.compile(r'<article class="doctor-card reveal">(?:(?!</article>).)*?<h3>' + re.escape(munir_name) + r'</h3>.*?</article>', re.S)
              m = card_re.search(section)
              if not m:
                  raise SystemExit(f"Could not find Munir card in {path_str}")
              new_section = section[:m.end()] + moheb_card + section[m.end():]
              new = text[:start] + new_section + text[end:]
              write_if_changed(path, text, new)
              print(f"Inserted Moheb homepage doctor card after Munir in {path_str}")

          add_moheb_home_card("index.html", arabic=False)
          add_moheb_home_card("ar/index.html", arabic=True)

          # Adjust homepage featured doctor grid for six cards without affecting mobile overrides.
          css_path = Path("styles.css")
          css = css_path.read_text(encoding="utf-8")
          css_new = css.replace(
              ".featured-doctors{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}",
              ".featured-doctors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}"
          )
          if css_new == css and "grid-template-columns:repeat(auto-fit,minmax(170px,1fr))" not in css:
              css_new = css + "\n\n/* Homepage doctor cards support six featured profiles. */\n.featured-doctors{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}\n"
          write_if_changed(css_path, css, css_new)

          # Verification.
          if '<meta name="google-site-verification" content="D04F_KM2zspLqt5BKQidBerlHgPB9dc_ngJSAbPDEuE" />' not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("Homepage Google verification tag changed or missing")

          for rel, src in fahed_profiles.items():
              text = Path(rel).read_text(encoding="utf-8")
              if src not in text:
                  raise SystemExit(f"Expected Dr Fahed portrait src missing in {rel}")
              clean = src.split("?", 1)[0]
              resolved = Path(clean.lstrip("/")) if clean.startswith("/") else Path(os.path.normpath((Path(rel).parent / clean).as_posix()))
              if not resolved.exists():
                  raise SystemExit(f"Dr Fahed profile path does not resolve: {rel} -> {src} -> {resolved}")
              data = resolved.read_bytes()
              if not (data.startswith(b"RIFF") and data[8:12] == b"WEBP"):
                  raise SystemExit(f"Dr Fahed profile image is not valid WebP: {resolved}")

          for rel in ["doctors.html", "ar/doctors.html", "doctors/dr-fahed-khalil.html", "ar/doctors/dr-fahed-khalil.html"]:
              text = Path(rel).read_text(encoding="utf-8")
              if "dr-fahed-new.webp" not in text:
                  raise SystemExit(f"New Dr Fahed image not referenced in {rel}")

          def verify_home_order(path_str, names):
              text = Path(path_str).read_text(encoding="utf-8")
              _, _, section = extract_doctors_section(text)
              found = re.findall(r'<h3>(.*?)</h3>', section)
              if found[:len(names)] != names:
                  raise SystemExit(f"Unexpected homepage doctor order in {path_str}: {found[:len(names)]}")
              if section.count("dr-moheb-silwadi.html") != 1:
                  raise SystemExit(f"Moheb homepage card missing or duplicated in {path_str}")
              print(f"Homepage order OK in {path_str}: {found[:len(names)]}")

          verify_home_order("index.html", ["Dr. Munir Silwadi", "Dr. Moheb Silwadi"])
          verify_home_order("ar/index.html", ["د. منير سلوادي", "د. مهيب سلوادي"])

          # Make sure malformed double-webp paths did not return.
          bad = []
          for path in Path(".").rglob("*"):
              if path.is_dir() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".html", ".js", ".json", ".xml", ".css"}:
                  continue
              if ".webp.webp" in path.read_text(encoding="utf-8", errors="ignore"):
                  bad.append(path.as_posix())
          if bad:
              raise SystemExit("Malformed .webp.webp remains in: " + ", ".join(bad))

          print("Changed files:", sorted(changed))
          print("Verification passed")
          PY

          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/apply-fahed-moheb-home-20260907.yml"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Dr Fahed portrait and add Moheb to homepage [skip arabic build]"
            git push
          fi
