name: Update Dr Fahed portrait and add Moheb home

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fahed-moheb-home:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Fahed portrait and homepage doctors
