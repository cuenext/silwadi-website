name: Apply premium homepage hero

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-home-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add homepage hero Arabic translations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          version = '20260905-hero-arabic-1'

          translations = {
              'Dr. Munir Silwadi Dental Centre': 'مركز د. منير سلوادي لطب الأسنان',
              'How can we': 'كيف يمكننا',
              'help you?': 'مساعدتك؟',
              'How can we help you?': 'كيف يمكننا مساعدتك؟',
              'From routine check-ups to specialist dental care, our Abu Dhabi team is here to help you find the right treatment with clarity and confidence.': 'من الفحوصات الدورية إلى رعاية الأسنان التخصصية، يساعدك فريقنا في أبوظبي على اختيار العلاج المناسب بوضوح وثقة.',
              'Book an Appointment': 'احجز موعداً',
              'Book an Appointment →': 'احجز موعداً ←',
              'Explore Services': 'استكشف الخدمات',
              'Explore Services →': 'استكشف الخدمات ←',
              'Clinic highlights': 'مميزات المركز',
              'Serving patients': 'نخدم المرضى',
              'since 1980': 'منذ عام 1980',
              'Serving patients since 1980': 'نخدم المرضى منذ عام 1980',
              'Bani Yas Tower': 'برج بني ياس',
              '& Al Raha Mall': 'والراحة مول',
              'Bani Yas Tower & Al Raha Mall': 'برج بني ياس والراحة مول',
              'Reception-led': 'الحجز عبر الاستقبال',
              'booking': 'الحجز',
              'Reception-led booking': 'الحجز عبر الاستقبال',
          }

          language_path = Path('language.js')
          js = language_path.read_text(encoding='utf-8')
          marker_start = '    // Premium homepage hero translations\n'
          marker_end = '    // End premium homepage hero translations\n'

          if marker_start in js:
              start = js.index(marker_start)
              end = js.index(marker_end, start) + len(marker_end)
              js = js[:start] + js[end:]

          block = marker_start
          for key, value in translations.items():
              block += f'    {json.dumps(key, ensure_ascii=False)}: {json.dumps(value, ensure_ascii=False)},\n'
          block += marker_end

          match = re.search(r'  const arabic = \{([\s\S]*?)\n  \};', js)
          if not match:
              raise SystemExit('Arabic translation object not found in language.js')
          js = js[:match.end(1)] + '\n' + block + js[match.end(1):]
          language_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          rtl_css = '''<style id="premium-home-hero-arabic-styles">
          html[dir="rtl"] .premium-home-hero__copy{text-align:right}
          html[dir="rtl"] .premium-home-hero__accent{margin-right:0;margin-left:auto}
          html[dir="rtl"] .premium-home-hero__actions,
          html[dir="rtl"] .premium-home-hero__trust{justify-content:flex-start}
          html[dir="rtl"] .premium-home-hero__trust li{direction:rtl;text-align:right}
          html[dir="rtl"] .premium-home-hero h1{letter-spacing:-.04em;max-width:13ch}
          @media(max-width:760px){
            html[dir="rtl"] .premium-home-hero__copy{text-align:right}
            html[dir="rtl"] .premium-home-hero__actions .btn{direction:rtl}
            html[dir="rtl"] .premium-home-hero h1{max-width:12ch}
          }
          </style>'''
          html = re.sub(r'<style id="premium-home-hero-arabic-styles">.*?</style>', '', html, flags=re.S)
          html = html.replace('</head>', rtl_css + '</head>', 1)

          html = re.sub(r'src="language\.js(\?v=[^"]+)?"', f'src="language.js?v={version}"', html)
          html = re.sub(r'src="app\.js(\?v=[^"]+)?"', f'src="app.js?v={version}"', html)

          language_tag = f'<script src="language.js?v={version}"></script>'
          existing_language_tag = re.search(r'<script src="language\.js[^"<>]*"></script>', html)
          if existing_language_tag:
              html = html[:existing_language_tag.start()] + html[existing_language_tag.end():]

          if 'src="app.js' in html:
              html = re.sub(r'(<script src="app\.js)', language_tag + r'\1', html, count=1)
          elif '</body>' in html:
              html = html.replace('</body>', language_tag + '</body>', 1)
          else:
              html += language_tag

          index_path.write_text(html, encoding='utf-8')

          refreshed_js = language_path.read_text(encoding='utf-8')
          for key, value in translations.items():
              if key not in refreshed_js or value not in refreshed_js:
                  raise SystemExit(f'Missing translation pair: {key}')

          refreshed_html = index_path.read_text(encoding='utf-8')
          if f'language.js?v={version}' not in refreshed_html:
              raise SystemExit('language.js was not loaded/cache-busted in index.html')
          if refreshed_html.find('language.js') > refreshed_html.find('app.js'):
              raise SystemExit('language.js must load before app.js')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add language.js index.html
          git diff --cached --check
          git commit -m "Add Arabic homepage hero translations" || exit 0
          git push
