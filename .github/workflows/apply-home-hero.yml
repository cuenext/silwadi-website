name: Apply premium homepage hero

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-home-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage hero text layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          style = '''<style id="premium-home-hero-styles">
          .premium-home-hero{position:relative;isolation:isolate;min-height:calc(100vh - 88px);overflow:hidden;background:#071d2f;color:#fff;display:flex;align-items:center}.premium-home-hero__media{position:absolute;inset:0;z-index:-4}.premium-home-hero__media img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;filter:saturate(1.02) contrast(1.02) brightness(1.02)}.premium-home-hero__shade{position:absolute;inset:0;z-index:-3;background:linear-gradient(90deg,rgba(4,18,31,.96) 0%,rgba(6,28,47,.88) 30%,rgba(13,49,76,.58) 51%,rgba(18,70,98,.16) 70%,rgba(18,70,98,0) 100%)}.premium-home-hero__inner{position:relative;z-index:2;width:100%;padding:6.4rem clamp(1.5rem,4vw,4rem) 5.2rem}.premium-home-hero__copy{max-width:43rem;margin-left:clamp(1.25rem,4.6vw,5.8rem)}.premium-home-hero__eyebrow{margin:0 0 1rem;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:clamp(.82rem,1.05vw,.98rem);font-weight:750;letter-spacing:.13em;color:#d8f7fb;text-transform:none}.premium-home-hero__accent{display:block;width:3.6rem;height:.22rem;border-radius:999px;background:linear-gradient(90deg,#17bfd6,#67e8ee);margin:0 0 1.45rem}.premium-home-hero h1{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:clamp(3.15rem,5.8vw,6.1rem);font-weight:820;line-height:.96;letter-spacing:-.065em;color:#f8fdff;text-shadow:0 18px 42px rgba(0,0,0,.28)}.premium-home-hero h1 span{display:block;color:#5de3e9;text-shadow:0 10px 32px rgba(15,197,216,.18)}.premium-home-hero__lead{max-width:40rem;margin:1.45rem 0 0;color:rgba(236,249,252,.9);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:clamp(1rem,1.35vw,1.17rem);font-weight:420;line-height:1.68}.premium-home-hero__actions{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2rem}.premium-home-hero__actions .btn{min-height:3.75rem;padding-inline:1.65rem;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:1rem;font-weight:760;border-radius:.78rem}.premium-home-hero__actions .btn--primary{background:linear-gradient(135deg,#10cfd0,#0b8fb7);box-shadow:0 20px 42px rgba(5,154,184,.26)}.premium-home-hero__actions .btn--secondary{background:rgba(255,255,255,.075);border:1px solid rgba(218,245,251,.58);color:#effcff;backdrop-filter:blur(10px)}.premium-home-hero__trust{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;margin:2.15rem 0 0;padding:0;list-style:none;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.premium-home-hero__trust li{display:flex;align-items:center;gap:.72rem;min-width:10.7rem}.premium-home-hero__icon{display:grid;place-items:center;flex:0 0 2.85rem;width:2.85rem;height:2.85rem;border-radius:999px;background:rgba(255,255,255,.105);border:1px solid rgba(221,248,252,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.13);font-size:1.05rem;color:#ecfdff}.premium-home-hero__trust strong{display:block;color:#effcff;font-size:.92rem;line-height:1.28;font-weight:700}.premium-home-hero__tagline,.premium-home-hero__down{display:none!important}.home-hero{display:none!important}@media(max-width:1100px){.premium-home-hero__copy{margin-left:clamp(.75rem,3vw,2.5rem)}.premium-home-hero__shade{background:linear-gradient(90deg,rgba(4,18,31,.96) 0%,rgba(6,28,47,.86) 42%,rgba(10,42,68,.48) 100%)}}@media(max-width:760px){.premium-home-hero{min-height:auto}.premium-home-hero__media img{object-position:67% center}.premium-home-hero__shade{background:linear-gradient(180deg,rgba(4,18,31,.58) 0%,rgba(4,18,31,.76) 38%,rgba(4,18,31,.94) 100%)}.premium-home-hero__inner{padding:5.4rem 1.25rem 3.7rem}.premium-home-hero__copy{margin-left:0}.premium-home-hero h1{font-size:clamp(2.65rem,14vw,4.05rem);letter-spacing:-.055em}.premium-home-hero__lead{font-size:1rem;line-height:1.62}.premium-home-hero__actions{flex-direction:column}.premium-home-hero__actions .btn{width:100%;justify-content:center}.premium-home-hero__trust{display:grid;grid-template-columns:1fr;gap:.85rem}.premium-home-hero__trust li{min-width:0}.premium-home-hero__tagline,.premium-home-hero__down{display:none!important}}
          </style>'''

          hero = '''<section class="premium-home-hero" id="home" aria-labelledby="premiumHomeHeroTitle"><picture class="premium-home-hero__media"><img src="assets/munir-home-hero?v=20260905-text-tune-1" alt="Dr. Munir Silwadi at Dr. Munir Silwadi Dental Centre" width="1815" height="867" decoding="async" fetchpriority="high"></picture><div class="premium-home-hero__shade" aria-hidden="true"></div><div class="container premium-home-hero__inner"><div class="premium-home-hero__copy reveal visible"><p class="premium-home-hero__eyebrow">Dr. Munir Silwadi Dental Centre</p><span class="premium-home-hero__accent" aria-hidden="true"></span><h1 id="premiumHomeHeroTitle">How can we <span>help you?</span></h1><p class="premium-home-hero__lead">From routine check-ups to specialist dental care, our Abu Dhabi team is here to help you find the right treatment with clarity and confidence.</p><div class="premium-home-hero__actions"><a class="btn btn--primary" href="contact.html#consultation-form">Book an Appointment <span aria-hidden="true">→</span></a><a class="btn btn--secondary" href="services.html">Explore Services <span aria-hidden="true">→</span></a></div><ul class="premium-home-hero__trust" aria-label="Clinic highlights"><li><span class="premium-home-hero__icon" aria-hidden="true">✓</span><strong>Serving patients<br>since 1980</strong></li><li><span class="premium-home-hero__icon" aria-hidden="true">⌖</span><strong>Bani Yas Tower<br>&amp; Al Raha Mall</strong></li><li><span class="premium-home-hero__icon" aria-hidden="true">☎</span><strong>Reception-led<br>booking</strong></li></ul></div></div></section>'''

          html = re.sub(r'<style id="premium-home-hero-styles">.*?</style>', '', html, flags=re.S)
          html = html.replace('</head>', style + '</head>', 1)
          html = re.sub(r'<meta property="og:image" content="[^"]+">', '<meta property="og:image" content="https://silwadi.ae/assets/munir-home-hero">', html, count=1)

          if '<section class="premium-home-hero"' in html:
              html = re.sub(r'<section class="premium-home-hero"[\s\S]*?</section>(?=<section class="team-proof|<nav class="care-shortcuts|<section class="section")', hero, html, count=1)
          else:
              html = re.sub(r'<section class="home-hero" id="home">[\s\S]*?</section>(?=<section class="team-proof)', hero, html, count=1)
              if '<section class="premium-home-hero"' not in html:
                  html = html.replace('<main id="main">', '<main id="main">' + hero, 1)

          html = re.sub(r'src="app\.js(\?v=[^"]+)?"', 'src="app.js?v=20260905-text-tune-1"', html)
          p.write_text(html, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tune homepage hero typography and spacing" || exit 0
          git push