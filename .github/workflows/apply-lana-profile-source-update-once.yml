name: Apply Lana profile source update once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-lana-profile-source-update-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Lana identity and source-backed profile
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('doctors/dr-lana-masoud.html')
          source = path.read_text(encoding='utf-8')
          source = source.replace('Dr. Lana Masoud', 'Dr. Lana Almasoud')

          old_intro = "Dr. Lana Almasoud is listed as a Specialist Endodontist at Dr. Munir Silwadi Dental Centre. The centre's updated medical team list confirms practice at Al Raha Mall."
          new_intro = "Dr. Lana Almasoud is a DOH-licensed Specialist Endodontist at Dr. Munir Silwadi Dental Centre. Her clinical work includes root canal treatment, complex retreatment, vital pulp therapy, endodontic microsurgery and dental trauma management, with a focus on preserving natural teeth where clinically appropriate."
          if old_intro not in source:
              raise SystemExit('Expected Lana intro not found')
          source = source.replace(old_intro, new_intro)

          start = '<section class="profile-section"><h2>Clinical focus</h2>'
          related = '<section class="profile-section"><h2>Related care</h2>'
          i = source.index(start)
          j = source.index(related, i)
          replacement = '''<section class="profile-section"><h2>Clinical focus</h2><div class="clinical-focus-grid"><div class="clinical-focus-item"><strong>Microscope-assisted root canal treatment</strong><span>Primary and complex root canal procedures supported by magnification where clinically appropriate.</span></div><div class="clinical-focus-item"><strong>Retreatment &amp; endodontic microsurgery</strong><span>Management of selected persistent endodontic conditions, including retreatment, apicoectomy and retrieval of separated instruments.</span></div><div class="clinical-focus-item"><strong>Vital pulp therapy &amp; regenerative procedures</strong><span>Techniques intended to preserve pulp vitality or support regeneration when indicated by the clinical assessment.</span></div><div class="clinical-focus-item"><strong>Dental trauma management</strong><span>Assessment and treatment planning for avulsed, luxated and fractured teeth.</span></div></div></section><section class="profile-section"><h2>Education &amp; professional background</h2><ul class="qualification-list"><li>Doctor of Dental Medicine (DMD), Gulf Medical University</li><li>Master’s Degree in Endodontics, Gulf Medical University; Dean’s List</li><li>Residency training at Thumbay Dental Hospital</li><li>DOH-licensed Specialist Endodontist</li></ul></section><section class="profile-section"><h2>Clinical technology &amp; approach</h2><p>Her endodontic practice includes the use of dental microscopes and Cone Beam Computed Tomography (CBCT) for selected cases. Dr. Lana speaks Arabic and English and emphasizes clear communication, careful treatment planning and patient comfort throughout care.</p></section>'''
          source = source[:i] + replacement + source[j:]

          source = source.replace(
              '["Endodontic assessment","Root canal care","Tooth preservation","General Dentistry"]',
              '["Microscope-assisted root canal treatment","Endodontic retreatment","Endodontic microsurgery","Vital pulp therapy","Dental trauma management"]'
          )
          source = source.replace(
              '<a class="profile-treatment-link" href="../treatments/general-dentistry.html">General Dentistry <span>→</span></a>',
              '<a class="profile-treatment-link" href="../treatments/endodontics.html">Endodontics <span>→</span></a>'
          )

          required = ['Dr. Lana Almasoud', 'Gulf Medical University', 'Master', 'Thumbay Dental Hospital', 'CBCT', 'microscope']
          for item in required:
              if item.lower() not in source.lower():
                  raise SystemExit(f'Missing required Lana fact: {item}')
          if 'Dr. Lana Masoud' in source:
              raise SystemExit('Old Lana name still present in English profile')
          path.write_text(source, encoding='utf-8')

          ar_path = Path('ar/doctors/dr-lana-masoud.html')
          ar = ar_path.read_text(encoding='utf-8')
          ar = ar.replace('Dr. Lana Masoud', 'Dr. Lana Almasoud')
          ar = ar.replace('لانا مسعود', 'لانا المسعود')
          if 'Dr. Lana Masoud' in ar or 'لانا مسعود' in ar:
              raise SystemExit('Old Lana name still present in Arabic profile')
          ar_path.write_text(ar, encoding='utf-8')
          PY
      - name: Verify targeted regressions
        run: |
          python -m unittest tests.test_lana_almasoud_name -v
          python -m unittest tests.test_doctor_profile_advertising_compliance -v
      - name: Commit profile updates
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add doctors/dr-lana-masoud.html ar/doctors/dr-lana-masoud.html
          git commit -m "fix: align Lana Almasoud profile with source bio"
          git push origin HEAD:main
