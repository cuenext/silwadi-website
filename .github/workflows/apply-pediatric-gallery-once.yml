name: Apply pediatric gallery once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pediatric-gallery-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pediatric clinic gallery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('review/pediatric-dentistry-v1.html')
          source = path.read_text(encoding='utf-8')

          css_marker = '    @media(max-width:1000px)'
          if '    .pd-clinic{position:relative;' not in source:
              css = '''    .pd-clinic{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0,rgba(142,229,233,.20),transparent 38%),linear-gradient(180deg,#f8fbfc 0%,#fff 100%);padding:38px 0 62px;border-bottom:1px solid rgba(8,56,71,.06)}
    .pd-clinic__head{display:flex;align-items:end;justify-content:space-between;gap:34px;margin-bottom:12px}
    .pd-clinic__head h2{margin:0;color:var(--pd-deep);font-size:clamp(36px,4.3vw,58px);line-height:.98;letter-spacing:-.05em;font-weight:680}
    .pd-clinic__head>p{margin:0 0 4px;color:var(--pd-muted);font-size:13px;line-height:1.65;max-width:430px}
    .pd-clinic-carousel{position:relative;touch-action:pan-y;user-select:none;outline:none}
    .pd-clinic-stage{position:relative;height:clamp(310px,44vw,620px);margin:4px 0 10px}
    .pd-clinic-slide{position:absolute;left:50%;top:50%;width:min(72vw,930px);margin:0;opacity:0;filter:blur(3px) saturate(.72);transform:translate(-50%,-50%) scale(.78);transition:transform .62s cubic-bezier(.22,.75,.24,1),opacity .45s ease,filter .45s ease;pointer-events:none;z-index:0}
    .pd-clinic-slide.is-prev{opacity:.28;filter:blur(2.1px) saturate(.78);transform:translate(-147%,-50%) scale(.87);z-index:1;pointer-events:auto;cursor:pointer}
    .pd-clinic-slide.is-active{opacity:1;filter:none;transform:translate(-50%,-50%) scale(1);z-index:3;pointer-events:auto}
    .pd-clinic-slide.is-next{opacity:.28;filter:blur(2.1px) saturate(.78);transform:translate(47%,-50%) scale(.87);z-index:1;pointer-events:auto;cursor:pointer}
    .pd-clinic-slide img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:22px;background:#dfecee;box-shadow:0 24px 64px rgba(8,56,71,.16)}
    .pd-clinic-controls{display:flex;align-items:center;justify-content:space-between;margin-top:0}
    .pd-clinic-status{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pd-muted)}
    .pd-clinic-controls__buttons{display:flex;gap:10px}
    .pd-clinic-arrow{width:48px;height:48px;padding:0;border-radius:50%;border:1px solid var(--pd-line);background:rgba(255,255,255,.94);color:var(--pd-deep);display:grid;place-items:center;box-shadow:0 9px 28px rgba(8,56,71,.10);cursor:pointer;transition:transform .2s ease,background .2s ease,border-color .2s ease}
    .pd-clinic-arrow:hover{transform:translateY(-2px);background:#fff;border-color:rgba(6,86,111,.28)}
    .pd-clinic-arrow:focus-visible,.pd-clinic-carousel:focus-visible{outline:3px solid rgba(36,169,198,.22);outline-offset:3px}
    .pd-clinic-arrow svg{width:19px;height:19px}

'''
              if css_marker not in source:
                  raise SystemExit('CSS insertion marker not found')
              source = source.replace(css_marker, css + css_marker, 1)

          mobile_marker = '  </style>'
          if '    @media(max-width:760px){\n      .pd-clinic{' not in source:
              mobile_css = '''    @media(max-width:760px){
      .pd-clinic{padding:26px 0 44px}
      .pd-clinic__head{display:block;margin-bottom:8px}
      .pd-clinic__head h2{font-size:41px}
      .pd-clinic__head>p{margin-top:12px;max-width:330px}
      .pd-clinic-stage{height:clamp(250px,59vw,360px);margin:0 0 8px}
      .pd-clinic-slide{width:86vw}
      .pd-clinic-slide.is-prev{opacity:.24;filter:blur(1.5px) saturate(.8);transform:translate(-139%,-50%) scale(.9)}
      .pd-clinic-slide.is-next{opacity:.24;filter:blur(1.5px) saturate(.8);transform:translate(39%,-50%) scale(.9)}
      .pd-clinic-slide img{border-radius:18px;box-shadow:0 16px 40px rgba(8,56,71,.14)}
      .pd-clinic-arrow{width:44px;height:44px}
    }
'''
              if mobile_marker not in source:
                  raise SystemExit('Style end marker not found')
              source = source.replace(mobile_marker, mobile_css + mobile_marker, 1)

          old_nav = '<nav class="pd-review-nav" aria-label="Preview navigation"><a href="#care">Care</a><a href="#visit">Your visit</a><a href="#specialist">Specialist</a><a href="#faq">FAQ</a></nav>'
          new_nav = '<nav class="pd-review-nav" aria-label="Preview navigation"><a href="#clinic">Clinic</a><a href="#care">Care</a><a href="#visit">Your visit</a><a href="#specialist">Specialist</a><a href="#faq">FAQ</a></nav>'
          if old_nav in source:
              source = source.replace(old_nav, new_nav, 1)
          elif 'href="#clinic">Clinic</a>' not in source:
              raise SystemExit('Review navigation marker not found')

          source = source.replace('<a class="pd-review-brand" href="#hero"', '<a class="pd-review-brand" href="#clinic"', 1)

          if 'id="clinic"' not in source:
              gallery = '''    <section class="pd-clinic" id="clinic" aria-labelledby="pd-clinic-title">
      <div class="container">
        <div class="pd-clinic__head">
          <div><p class="pd-eyebrow">Al Raha Mall · Pediatric Clinic</p><h2 id="pd-clinic-title">Explore Our Pediatric Clinic</h2></div>
          <p>A closer look at the child-focused treatment environment at our Al Raha Mall branch.</p>
        </div>
      </div>
      <div class="pd-clinic-carousel" data-pd-carousel tabindex="0" aria-roledescription="carousel" aria-label="Pediatric clinic photos">
        <div class="pd-clinic-stage">
          <figure class="pd-clinic-slide is-active" data-pd-slide><img src="../assets/review/pediatric-clinic/dscf2888.webp" alt="Pediatric dental treatment room at Silwadi Dental Center, Al Raha Mall" width="1200" height="800" fetchpriority="high" decoding="async"></figure>
          <figure class="pd-clinic-slide is-next" data-pd-slide><img src="../assets/review/pediatric-clinic/dscf2905.webp" alt="Pediatric dental chair and child-focused clinic environment at Al Raha Mall" width="1200" height="800" loading="lazy" decoding="async"></figure>
          <figure class="pd-clinic-slide" data-pd-slide><img src="../assets/review/pediatric-clinic/dscf2896.webp" alt="Wide view of the pediatric dental treatment room at Silwadi Dental Center" width="1200" height="800" loading="lazy" decoding="async"></figure>
          <figure class="pd-clinic-slide" data-pd-slide><img src="../assets/review/pediatric-clinic/dscf2894.webp" alt="Child-focused dinosaur dental chair in the pediatric clinic" width="1200" height="800" loading="lazy" decoding="async"></figure>
          <figure class="pd-clinic-slide is-prev" data-pd-slide><img src="../assets/review/pediatric-clinic/dscf2892.webp" alt="Pediatric clinic character and dental equipment at Al Raha Mall" width="1200" height="800" loading="lazy" decoding="async"></figure>
        </div>
        <div class="container pd-clinic-controls">
          <div class="pd-clinic-status"><span data-pd-current>01</span><span aria-hidden="true"> / </span><span>05</span></div>
          <div class="pd-clinic-controls__buttons">
            <button class="pd-clinic-arrow" type="button" data-pd-prev aria-label="Previous clinic photo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="pd-clinic-arrow" type="button" data-pd-next aria-label="Next clinic photo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
      </div>
    </section>

'''
              main_marker = '  <main>\n'
              if main_marker not in source:
                  raise SystemExit('Main marker not found')
              source = source.replace(main_marker, main_marker + gallery, 1)

          source = source.replace('../contact.html#consultation"', '../contact.html#consultation-form"')

          if 'data-pd-current' in source and "carousel.addEventListener('keydown'" not in source:
              script = '''  <script>
    (() => {
      const carousel = document.querySelector('[data-pd-carousel]');
      if (!carousel) return;
      const slides = [...carousel.querySelectorAll('[data-pd-slide]')];
      const previous = carousel.querySelector('[data-pd-prev]');
      const next = carousel.querySelector('[data-pd-next]');
      const current = carousel.querySelector('[data-pd-current]');
      let index = 0;
      let startX = null;

      const render = () => {
        const last = slides.length - 1;
        slides.forEach((slide, i) => {
          slide.classList.toggle('is-active', i === index);
          slide.classList.toggle('is-prev', i === (index - 1 + slides.length) % slides.length);
          slide.classList.toggle('is-next', i === (index + 1) % slides.length);
          slide.setAttribute('aria-hidden', i === index ? 'false' : 'true');
        });
        current.textContent = String(index + 1).padStart(2, '0');
      };
      const go = delta => {
        index = (index + delta + slides.length) % slides.length;
        render();
      };

      previous.addEventListener('click', () => go(-1));
      next.addEventListener('click', () => go(1));
      carousel.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') { event.preventDefault(); go(-1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); go(1); }
      });
      carousel.addEventListener('pointerdown', event => {
        startX = event.clientX;
        if (carousel.setPointerCapture) carousel.setPointerCapture(event.pointerId);
      });
      carousel.addEventListener('pointerup', event => {
        if (startX === null) return;
        const distance = event.clientX - startX;
        startX = null;
        if (Math.abs(distance) > 48) go(distance > 0 ? -1 : 1);
      });
      carousel.addEventListener('pointercancel', () => { startX = null; });
      slides.forEach((slide, i) => slide.addEventListener('click', () => {
        if (slide.classList.contains('is-prev')) go(-1);
        else if (slide.classList.contains('is-next')) go(1);
      }));
      render();
    })();
  </script>
'''
              script_marker = '  <script src="../app.js"></script>'
              if script_marker not in source:
                  raise SystemExit('App script marker not found')
              source = source.replace(script_marker, script + script_marker, 1)

          required = [
              'id="clinic"', 'Explore Our Pediatric Clinic', 'data-pd-carousel', 'data-pd-prev', 'data-pd-next',
              'dscf2888.webp', 'dscf2905.webp', 'dscf2896.webp', 'dscf2894.webp', 'dscf2892.webp',
              "carousel.addEventListener('keydown'", "carousel.addEventListener('pointerdown'"
          ]
          for item in required:
              if item not in source:
                  raise SystemExit(f'Missing pediatric gallery requirement: {item}')
          if source.index('id="clinic"') > source.index('id="hero"'):
              raise SystemExit('Clinic gallery must precede hero')
          if '../contact.html#consultation"' in source:
              raise SystemExit('Old booking anchor remains')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify pediatric review
        run: |
          python -m unittest tests.test_private_pediatric_review -v
          python -m unittest tests.test_private_pediatric_gallery -v
      - name: Commit pediatric gallery
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add review/pediatric-dentistry-v1.html
          git commit -m "feat: add pediatric clinic photo carousel"
          git push origin HEAD:main
