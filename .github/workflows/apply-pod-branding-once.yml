name: Apply final POD partnership branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pod-branding-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved page update
        run: python .github/scripts/apply_pod_branding.py
      - name: Verify POD tests
        run: python -m unittest tests.test_private_pod_review tests.test_private_pod_raha_review
      - name: Commit page update
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add review/people-of-determination-raha-v1.html tests/test_private_pod_review.py
          git commit -m "fix: refine POD partnership branding"
          git push
