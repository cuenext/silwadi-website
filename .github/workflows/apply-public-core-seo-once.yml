name: Apply public core SEO once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-public-core-seo-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved SEO changes
        run: python scripts/apply_public_core_seo.py
      - name: Verify SEO contract before commit
        run: python -m unittest tests.test_public_core_seo -v
      - name: Commit approved SEO pass
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add doctors.html about.html locations.html contact.html treatments.html treatments/*.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "seo: strengthen public core pages"
          git push origin HEAD:main
