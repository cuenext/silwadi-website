name: Apply selected doctor portrait zoom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-selected-doctor-zoom.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add selective closer crop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          TARGETS = [
              'dr-lana-new.png',
              'dr-fahed-new.png',
              'dr-afnan-new.webp',
              'dr-krish-new%20(2).png',
              'dr-ehab-new%20(2).png',
          ]

          changed = []

          def add_zoom_class(tag: str) -> str:
              if not any(asset in tag for asset in TARGETS):
                  return tag
              if 'doctor-photo-closer' in tag:
                  return tag
              class_match = re.search(r'class=("|\')([^"\']*)(\1)', tag, flags=re.I)
              if class_match:
                  current = class_match.group(2).strip()
                  replacement = f'class={class_match.group(1)}{current} doctor-photo-closer{class_match.group(1)}'
                  return tag[:class_match.start()] + replacement + tag[class_match.end():]
              return tag.replace('<img', '<img class="doctor-photo-closer"', 1)

          for path in ROOT.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'<img\b[^>]*>', lambda m: add_zoom_class(m.group(0)), text, flags=re.I)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          css_path = ROOT / 'doctor-pages.css'
          css = css_path.read_text(encoding='utf-8')
          css_addition = '''

/* Selective closer crop for approved doctor portraits */
.doctor-directory-card__photo img.doctor-photo-closer{transform:scale(1.15)}
.consultant-portrait__frame img.doctor-photo-closer{transform:scale(1.12)}
'''
          if '.doctor-directory-card__photo img.doctor-photo-closer' not in css:
              css_path.write_text(css.rstrip() + css_addition + '\n', encoding='utf-8')
              changed.append(str(css_path))

          if not changed:
              raise SystemExit('No changes made')

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Run portrait zoom contract
        run: python -m unittest tests.test_selected_doctor_zoom

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Silwadi Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doctor-pages.css '*.html' 'doctors/*.html' 'ar/*.html' 'ar/doctors/*.html' 2>/dev/null || git add -A
          git commit -m "style: zoom selected doctor portraits slightly closer"
          git push origin HEAD:main
