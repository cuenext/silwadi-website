name: Apply treatment review polish

on:
  push:
    branches:
      - review-treatment-polish-20260916
    paths:
      - scripts/apply_treatment_review_polish.py
      - .github/workflows/apply-treatment-review-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-treatment-polish-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved review-page polish
        run: python scripts/apply_treatment_review_polish.py
      - name: Commit generated review changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/orthodontics-v1.html review/dental-implants-v1.html review/cosmetic-dentistry-v1.html review/general-dentistry-v1.html review/emergency-dentist-v1.html review/ar review/treatment-refresh-v1.css
          git commit -m "feat: polish treatment review pages"
          git push origin HEAD:review-treatment-polish-20260916
