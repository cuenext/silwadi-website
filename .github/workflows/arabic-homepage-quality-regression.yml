name: Arabic homepage quality regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify natural Arabic homepage copy and dynamic translations
        run: |
          python -m unittest tests.test_arabic_quality_seo_rebuild tests.test_arabic_mobile_polish tests.test_homepage_featured_doctors -v
