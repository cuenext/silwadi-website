name: Booking full regression

on:
  push:
    branches:
      - fix/booking-instant-submit-20260914
    paths:
      - '.github/workflows/booking-full-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -v
