name: Booking success popup regression

on:
  push:
    branches:
      - main
      - fix/booking-success-popup-20260914
  pull_request:
    paths:
      - booking-modal.js
      - booking-modal.css
      - bilingual-routing.js
      - tests/test_booking_success_popup.py
      - .github/workflows/booking-success-popup-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run booking success popup regression
        run: python -m unittest tests/test_booking_success_popup.py
