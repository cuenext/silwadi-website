name: Booking success popup regression

on:
  push:
    branches:
      - main
      - fix/booking-success-popup-20260914
  pull_request:
    paths:
      - booking-modal.js
      - booking-modal.css
      - booking-email-validation.js
      - bilingual-routing.js
      - contact.html
      - arabic-quality.css
      - tests/test_booking_modal.py
      - tests/test_booking_success_popup.py
      - tests/test_booking_email_validation.py
      - .github/workflows/booking-success-popup-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run booking regressions
        run: python -m unittest tests/test_booking_modal.py tests/test_booking_success_popup.py tests/test_booking_email_validation.py
