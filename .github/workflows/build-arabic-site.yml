name: Validate bilingual website

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arabic-site.yml'
      - 'tools/build-arabic-site.mjs'
      - 'tools/remove-appointment-notice.mjs'
      - 'tools/seo_launch_audit.py'
      - 'data/arabic-seo.json'
      - 'data/arabic-quality-overrides.json'
      - 'data/arabic-quality-overrides-extra.json'
      - 'data/arabic-quality-overrides-critical.json'
      - 'language.js'
      - 'arabic-quality.css'
      - 'arabic-static.js'
      - 'bilingual-routing.js'
      - 'booking-modal.js'
      - 'booking-modal.css'
      - '*.html'
      - '*.css'
      - 'doctors/*.html'
      - 'treatments/*.html'
      - 'app.js'
      - 'sitemap.xml'
      - 'tests/test_arabic_quality_seo_rebuild.py'
      - 'tests/test_arabic_structured_data.py'
      - 'tests/test_arabic_mobile_polish.py'
      - 'tests/test_booking_modal.py'
      - 'tests/test_locations_page.py'
      - 'tests/test_patch14_official_content_alignment.py'
      - 'tests/test_patch16_truth_reviews_raha.py'
      - 'tests/test_patch21_reviews_footer_socials.py'
      - 'tests/test_patch23_mobile_ux.py'
      - 'tests/test_patch24_services_overhaul.py'
      - 'tests/test_patch26_arabic_completion.py'
      - 'tests/test_patch3_bilingual_experience.py'
      - 'tests/test_patch6_contract.py'
      - 'tests/test_patch7_local_seo.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip arabic build]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Arabic quality and SEO contracts
        run: |
          python -m unittest tests.test_arabic_quality_seo_rebuild -v
          python -m unittest tests.test_arabic_structured_data -v
          python -m unittest tests.test_arabic_mobile_polish -v
          python -m unittest tests.test_booking_modal -v

      - name: Run current site regression contracts
        run: |
          python -m unittest tests.test_locations_page tests.test_patch14_official_content_alignment tests.test_patch16_truth_reviews_raha tests.test_patch23_mobile_ux tests.test_patch3_bilingual_experience tests.test_patch6_contract tests.test_patch7_local_seo tests.test_public_core_seo tests.test_homepage_featured_doctors -v

      - name: Run bilingual SEO launch audit
        run: python tools/seo_launch_audit.py

      - name: Show audit summary on failure
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/arabic-audit.json')
          if p.exists():
              rows = json.loads(p.read_text(encoding='utf-8'))
              same = [r for r in rows if r.get('source') == r.get('arabic')]
              print(f'Audited strings: {len(rows)}')
              print(f'Unchanged strings: {len(same)}')
              for row in same[:80]:
                  print('-', row['source'])
          PY
