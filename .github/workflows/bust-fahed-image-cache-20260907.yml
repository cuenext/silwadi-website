name: Bust Fahed image cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force fresh Fahed image URL
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          version = '20260907-fahed-cachefix'
          changed = []
          pattern = re.compile(r'dr-fahed-new\.webp(?:\?v=[^"\'\s<)]*)?')
          for path in Path('.').rglob('*'):
              if path.is_dir() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.json', '.xml', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'dr-fahed-new.webp' not in text:
                  continue
              new = pattern.sub(f'dr-fahed-new.webp?v={version}', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.as_posix())
          required = ['doctors.html', 'ar/doctors.html', 'doctors/dr-fahed-khalil.html', 'ar/doctors/dr-fahed-khalil.html']
          for rel in required:
              body = Path(rel).read_text(encoding='utf-8', errors='ignore')
              if f'dr-fahed-new.webp?v={version}' not in body:
                  raise SystemExit(f'Missing fresh Fahed version in {rel}')
          if '<meta name="google-site-verification" content="D04F_KM2zspLqt5BKQidBerlHgPB9dc_ngJSAbPDEuE" />' not in Path('index.html').read_text(encoding='utf-8'):
              raise SystemExit('Google verification tag changed')
          bad = []
          for path in Path('.').rglob('*'):
              if path.is_dir() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in {'.html', '.js', '.json', '.xml', '.css'} and '.webp.webp' in path.read_text(encoding='utf-8', errors='ignore'):
                  bad.append(path.as_posix())
          if bad:
              raise SystemExit('Double webp paths found: ' + ', '.join(bad))
          print('Changed:', changed)
          PY
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/bust-fahed-image-cache-20260907.yml
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Force refresh Dr Fahed image cache [skip arabic build]"
            git push
          fi
