name: One-shot implant OG asset

on:
  push:
    paths:
      - ".github/workflows/create-implant-og-asset.yml"

permissions:
  contents: write

jobs:
  create-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dedicated implant social image
        run: |
          set -euo pipefail
          cp assets/locations/al-raha-treatment-room.webp assets/services/implantology.webp
          test -s assets/services/implantology.webp
      - name: Commit asset and remove workflow
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add assets/services/implantology.webp
          git rm .github/workflows/create-implant-og-asset.yml
          git commit -m "Add dental implants social image"
          git push
