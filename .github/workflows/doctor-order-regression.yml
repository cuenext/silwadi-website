name: Doctor order regression

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'doctors.html'
      - 'ar/doctors.html'
      - '.github/workflows/doctor-order-regression.yml'

# Post-fix verification: these are literal card-slot swaps, not a loose preferred order.
jobs:
  verify-doctor-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify literal requested card swaps
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          expected = [
              'Dr. Munir Silwadi',
              'Dr. Moheb Silwadi',
              'Dr. Ahmed El Shehri',
              'Dr. Hani Hasbini',
              'Dr. Dana Awad',
              'Dr. Afnan Mashal',
              'Dr. Lana Masoud',
              'Dr. Fahed Abi Khalil',
              'Dr. Kashmira Pawar Jayprakash',
              'Dr. Krishnamurthy Balajee',
              'Dr. Ehab Hassouneh Bassam A',
              'Dr. Sara Ismail',
              'Dr. Nachiket Shah',
              'Dr. Nasr Keshkiea',
              'Dr. Moammar Mohamed Rifai',
          ]

          js = Path('app.js').read_text(encoding='utf-8')
          match = re.search(r"const preferredDoctorOrder = \[(.*?)\];", js, re.S)
          assert match, 'preferredDoctorOrder not found'
          js_order = re.findall(r"'([^']+)'", match.group(1))
          assert js_order == expected, f'Wrong JS order:\n{js_order}'

          for page in ['doctors.html', 'ar/doctors.html']:
              html = Path(page).read_text(encoding='utf-8')
              html_order = re.findall(r'data-name="([^"]+)"', html)
              assert html_order == expected, f'Wrong static card order in {page}:\n{html_order}'
              assert 'app.js?v=20260906-doctor-slots-1' in html, f'Fresh app.js cache key missing in {page}'
          PY
