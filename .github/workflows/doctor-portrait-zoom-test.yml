name: Doctor portrait zoom test

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_selected_doctor_zoom.py'
      - 'doctor-pages.css'
      - 'doctors.html'
      - 'ar/doctors.html'
      - 'doctors/**.html'
      - 'ar/doctors/**.html'
      - '.github/workflows/doctor-portrait-zoom-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run selected doctor zoom contract
        run: python -m unittest tests.test_selected_doctor_zoom

