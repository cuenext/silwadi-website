name: Doctor profile advertising compliance

on:
  push:
    branches: [main]
    paths:
      - 'doctors.html'
      - 'doctors/**.html'
      - 'ar/doctors/dr-lana-masoud.html'
      - 'tests/test_doctor_profile_advertising_compliance.py'
      - 'tests/test_lana_almasoud_name.py'
      - '.github/workflows/doctor-profile-advertising-compliance.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Doctor profile source and advertising audit
        run: python -m unittest tests.test_doctor_profile_advertising_compliance -v
      - name: Lana Almasoud identity regression
        run: python -m unittest tests.test_lana_almasoud_name -v
