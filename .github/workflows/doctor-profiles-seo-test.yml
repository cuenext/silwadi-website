name: Doctor profiles SEO test

on:
  push:
    branches: [main]
    paths:
      - 'doctors/*.html'
      - 'sitemap.xml'
      - 'tests/test_doctor_profiles_seo.py'
      - '.github/workflows/doctor-profiles-seo-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_doctor_profiles_seo -v

# Permanent regression check for the 15 English doctor profile pages.
