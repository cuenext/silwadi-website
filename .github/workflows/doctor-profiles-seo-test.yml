name: Doctor profiles SEO test

on:
  push:
    branches: [main]
    paths:
      - 'doctors/*.html'
      - 'sitemap.xml'
      - 'tests/test_doctor_profiles_seo.py'
      - '.github/workflows/doctor-profiles-seo-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_doctor_profiles_seo -v

# Permanent regression check for the 15 English doctor profile pages.
