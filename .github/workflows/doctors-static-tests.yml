name: Doctors static tests

on:
  pull_request:
    paths:
      - 'doctors.html'
      - 'doctors/**'
      - 'assets/doctors/**'
      - 'tests/test_doctor_portrait_replacements.py'
      - '.github/workflows/doctors-static-tests.yml'

jobs:
  doctors-page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor portrait checks
        run: python3 tests/test_doctor_portrait_replacements.py -v
