name: Emergency hero rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-hero-rollback.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last clean hero asset
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = ['index.html','ar/index.html']
          for f in files:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              if f == 'index.html':
                  s=s.replace('assets/munir-home-hero-mobile-20260906.webp?v=20260906-hero-2','assets/munir-home-hero?v=20260906-emergency-clean')
                  s=s.replace('assets/munir-home-hero-20260906.webp?v=20260906-hero-2','assets/munir-home-hero?v=20260906-emergency-clean')
                  s=s.replace('https://silwadi.ae/assets/munir-home-hero-20260906.webp','https://silwadi.ae/assets/munir-home-hero')
              else:
                  s=s.replace('/assets/munir-home-hero-mobile-20260906.webp?v=20260906-hero-2','/assets/munir-home-hero?v=20260906-emergency-clean')
                  s=s.replace('/assets/munir-home-hero-20260906.webp?v=20260906-hero-2','/assets/munir-home-hero?v=20260906-emergency-clean')
                  s=s.replace('https://silwadi.ae/assets/munir-home-hero-20260906.webp','https://silwadi.ae/assets/munir-home-hero')
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'munir-home-hero?v=20260906-emergency-clean' index.html
          grep -q '/assets/munir-home-hero?v=20260906-emergency-clean' ar/index.html
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html ar/index.html
          git rm .github/workflows/emergency-hero-rollback.yml
          git commit -m 'fix: restore clean homepage hero immediately [skip arabic build]'
          git push
