name: Finalize Krish photo metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-krish-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Krish profile metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = list(Path('.').rglob('dr-krishnamurthy-katta-balajee.html'))
          if not files:
              raise SystemExit('Krish profile pages not found')

          changed = 0
          new_url = 'https://silwadi.ae/assets/dr-krish-new%20(2).png'
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'(<meta property="og:image" content=")[^"]*(">)', rf'\1{new_url}\2', text, count=1)
              text = text.replace('https://silwadi.ae/assets/doctors/dr-krishnamurthy-katta-balajee.png', new_url)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
                  print('Updated', path)

          if changed == 0:
              raise SystemExit('No Krish metadata changes found')

          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'dr-krishnamurthy-katta-balajee.png' in text:
                  raise SystemExit(f'Old Krish metadata image remains in {path}')
              if new_url not in text:
                  raise SystemExit(f'New Krish metadata image missing from {path}')
          print('Verification passed')
          PY
      - name: Commit changes
        run: |
          git config user.name "Silwadi Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/dr-krishnamurthy-katta-balajee.html' 2>/dev/null || git add -A
          git commit -m "fix: align Krish profile image metadata"
          git push origin HEAD:main
