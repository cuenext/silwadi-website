name: Finalize approved service taxonomy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-service-taxonomy.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run approved taxonomy transformation
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/verify-service-taxonomy.yml').read_text(encoding='utf-8').splitlines()
          blocks = []
          i = 0
          while i < len(workflow):
              if "python - <<'PY'" in workflow[i]:
                  start = i + 1
                  j = start
                  while j < len(workflow) and workflow[j].strip() != 'PY':
                      j += 1
                  code_lines = []
                  for line in workflow[start:j]:
                      code_lines.append(line[10:] if line.startswith('          ') else line)
                  blocks.append('\n'.join(code_lines))
                  i = j
              i += 1
          if len(blocks) < 2:
              raise SystemExit(f'Expected apply + verify Python blocks, found {len(blocks)}')
          exec(compile(blocks[0], '<taxonomy-apply>', 'exec'), {})
          PY

      - name: Normalize whitespace exposed by touched pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('about.html', 'ar/about.html'):
              p = Path(name)
              lines = p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip(' \t') for line in lines) + '\n', encoding='utf-8')
          PY

      - name: Re-run approved verification
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/verify-service-taxonomy.yml').read_text(encoding='utf-8').splitlines()
          blocks = []
          i = 0
          while i < len(workflow):
              if "python - <<'PY'" in workflow[i]:
                  start = i + 1
                  j = start
                  while j < len(workflow) and workflow[j].strip() != 'PY':
                      j += 1
                  code_lines = [line[10:] if line.startswith('          ') else line for line in workflow[start:j]]
                  blocks.append('\n'.join(code_lines))
                  i = j
              i += 1
          if len(blocks) < 2:
              raise SystemExit(f'Expected apply + verify Python blocks, found {len(blocks)}')
          exec(compile(blocks[1], '<taxonomy-verify>', 'exec'), {})
          PY

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit site update
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add -- '*.html'
          git commit -m "fix: separate service categories and add official motto [skip arabic build]"
          git push
