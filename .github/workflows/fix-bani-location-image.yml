name: Fix Bani Yas location image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bani-location-image.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Bani Yas location hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'locations.html': 'assets/locations/bani-yas-naeem-featured.webp?v=20260906-location-1',
              'ar/locations.html': '/assets/locations/bani-yas-naeem-featured.webp?v=20260906-location-1',
          }

          pattern = re.compile(r'(<figure class="location-branch__media location-branch__media--bani"><img src=")[^"]+("[^>]*>)')
          for name, new_src in replacements.items():
              p = Path(name)
              text = p.read_text()
              updated, count = pattern.subn(r'\1' + new_src + r'\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one Bani Yas hero image in {name}, found {count}')
              p.write_text(updated)
          PY
      - name: Verify scoped change
        run: |
          grep -F 'location-branch__media--bani"><img src="assets/locations/bani-yas-naeem-featured.webp?v=20260906-location-1"' locations.html
          grep -F 'location-branch__media--bani"><img src="/assets/locations/bani-yas-naeem-featured.webp?v=20260906-location-1"' ar/locations.html
      - name: Commit and clean workflow
        run: |
          rm -f .github/workflows/fix-bani-location-image.yml
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add locations.html ar/locations.html
          git add -u -- .github/workflows/fix-bani-location-image.yml
          git commit -m "fix: use preferred Bani Yas image on location pages [skip arabic build]"
          git push
