name: Fix Ehab display name

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ehab-name.yml'

permissions:
  contents: write

jobs:
  fix-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace outdated Ehab name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('doctors.html'),
              Path('doctors/dr-ehab-hassouneh.html'),
              Path('ar/doctors.html'),
              Path('ar/doctors/dr-ehab-hassouneh.html'),
              Path('language.js'),
              Path('app.js'),
          ]
          replacements = [
              ('Dr. Ehab Hassouneh Bassam A', 'Dr. Ehab Hassouneh'),
              ('Ehab Hassouneh Bassam A', 'Ehab Hassouneh'),
              ('إيهاب حسونة بسام أ', 'إيهاب حسونة'),
              ('إيهاب حسونة بسام', 'إيهاب حسونة'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          remaining = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if 'Ehab Hassouneh Bassam' in text or 'إيهاب حسونة بسام' in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('Old Ehab name remains in: ' + ', '.join(remaining))
          PY

          node --check app.js
          node --check language.js

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No additional changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctors.html doctors/dr-ehab-hassouneh.html ar/doctors.html ar/doctors/dr-ehab-hassouneh.html language.js app.js
          git commit -m 'Fix Ehab Hassouneh name site-wide'
          git push origin HEAD:main
