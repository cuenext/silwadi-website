          )

          arabic_path.parent.mkdir(parents=True, exist_ok=True)
          arabic_path.write_text(ar, encoding='utf-8')

          sitemap = sitemap_path.read_text(encoding='utf-8')
          arabic_url = 'https://silwadi.ae/ar/treatments/people-of-determination.html'
          if arabic_url not in sitemap:
              entry = (
                  '  <url>\n'
                  f'    <loc>{arabic_url}</loc>\n'
                  '    <lastmod>2026-09-16</lastmod>\n'
                  '  </url>\n'
              )
              sitemap = sitemap.replace('</urlset>', entry + '</urlset>')
              sitemap_path.write_text(sitemap, encoding='utf-8')

          # Guard against silently producing another treatment page or a broken route.
          generated = arabic_path.read_text(encoding='utf-8')
          required = [
              '<html lang="ar" dir="rtl">',
              'رعاية أسنان أصحاب الهمم',
              '/assets/DSCF2857.webp',
              '/assets/DSCF2880.webp',
              'href="/treatments/people-of-determination.html"',
          ]
          for marker in required:
              if marker not in generated:
                  raise SystemExit(f'Missing generated marker: {marker}')
          if 'علاج جذور الأسنان في أبوظبي' in generated:
              raise SystemExit('Arabic POD page contains Endodontics page title')
          PY

      - name: Verify implementation is green
        run: |
          python tests/test_people_of_determination_arabic.py
          python tests/test_people_of_determination_gallery.py

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add treatments/people-of-determination.html ar/treatments/people-of-determination.html sitemap.xml tests/test_people_of_determination_arabic.py
          git commit -m "fix: add Arabic People of Determination page"
          git push origin HEAD:fix-pod-arabic-route
