name: Fix POD Arabic route

on:
  push:
    branches:
      - fix-pod-arabic-route

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pod-arabic-route
          fetch-depth: 0

      - name: Verify regression test is red before implementation
        shell: bash
        run: |
          set +e
          python tests/test_people_of_determination_arabic.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the regression test to fail before implementation, but it passed."
            exit 1
          fi
          echo "Regression test failed before implementation as expected."

      - name: Create Arabic POD page and repair language routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          english_path = root / 'treatments' / 'people-of-determination.html'
          arabic_path = root / 'ar' / 'treatments' / 'people-of-determination.html'
          sitemap_path = root / 'sitemap.xml'

          source = english_path.read_text(encoding='utf-8')

          # Repair the English POD page so both language switches point to the
          # exact Arabic counterpart instead of the generic Arabic services page.
          english = source.replace(
              'class="global-language" href="/ar/services.html" lang="ar" hreflang="ar" aria-label="عرض الموقع بالعربية">عربي</a>',
              'class="global-language" href="/ar/treatments/people-of-determination.html" lang="ar" hreflang="ar" aria-label="عرض صفحة أصحاب الهمم بالعربية">عربي</a>'
          ).replace(
              '<a href="/ar/services.html" lang="ar" hreflang="ar">عربي</a>',
              '<a href="/ar/treatments/people-of-determination.html" lang="ar" hreflang="ar">عربي</a>'
          )
          if 'hreflang="ar-AE" href="https://silwadi.ae/ar/treatments/people-of-determination.html"' not in english:
              english = english.replace(
                  '<link rel="canonical" href="https://silwadi.ae/treatments/people-of-determination.html">',
                  '<link rel="canonical" href="https://silwadi.ae/treatments/people-of-determination.html">\n'
                  '<link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/people-of-determination.html">\n'
                  '<link rel="alternate" hreflang="ar-AE" href="https://silwadi.ae/ar/treatments/people-of-determination.html">\n'
                  '<link rel="alternate" hreflang="x-default" href="https://silwadi.ae/treatments/people-of-determination.html">'
              )
          english_path.write_text(english, encoding='utf-8')

          # Build a real, refresh-safe static Arabic counterpart from the exact
          # current production POD page so the gallery/layout stay in sync.
          ar = source
          ar = ar.replace('<html lang="en">', '<html lang="ar" dir="rtl">')
          ar = ar.replace('<meta name="content-language" content="en">', '<meta name="content-language" content="ar">')
          ar = ar.replace(
              '<title>Dental Care for People of Determination in Abu Dhabi | Silwadi Dental Center</title>',
              '<title>رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان</title>'
          )
          ar = ar.replace(
              '<meta name="description" content="Learn how Silwadi Dental Center supports thoughtful, respectful dental visits for People of Determination at Al Raha Mall in Abu Dhabi.">',
              '<meta name="description" content="تعرّف على رعاية الأسنان الميسّرة والمحترمة لأصحاب الهمم في مركز سلوادي بالراحة مول في أبوظبي، مع تخطيط الزيارة وفق احتياجات كل مريض.">'
          )
          ar = ar.replace(
              '<link rel="canonical" href="https://silwadi.ae/treatments/people-of-determination.html">',
              '<link rel="canonical" href="https://silwadi.ae/ar/treatments/people-of-determination.html">\n'
              '<link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/people-of-determination.html">\n'
              '<link rel="alternate" hreflang="ar-AE" href="https://silwadi.ae/ar/treatments/people-of-determination.html">\n'
              '<link rel="alternate" hreflang="x-default" href="https://silwadi.ae/treatments/people-of-determination.html">'
          )
          ar = ar.replace(
              '<meta property="og:title" content="Dental Care for People of Determination in Abu Dhabi | Silwadi Dental Center">',
              '<meta property="og:title" content="رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان">'
          ).replace(
              '<meta property="og:description" content="Learn how Silwadi Dental Center supports thoughtful, respectful dental visits for People of Determination at Al Raha Mall in Abu Dhabi.">',
              '<meta property="og:description" content="رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في فرع سلوادي بالراحة مول في أبوظبي.">'
          ).replace(
              '<meta property="og:url" content="https://silwadi.ae/treatments/people-of-determination.html">',
              '<meta property="og:url" content="https://silwadi.ae/ar/treatments/people-of-determination.html">'
          ).replace(
              '<meta property="og:locale" content="en_AE">',
              '<meta property="og:locale" content="ar_AE">\n<meta property="og:locale:alternate" content="en_AE">'
          ).replace(
              '<meta name="twitter:title" content="Dental Care for People of Determination in Abu Dhabi | Silwadi Dental Center">',
              '<meta name="twitter:title" content="رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان">'
          ).replace(
              '<meta name="twitter:description" content="Learn how Silwadi Dental Center supports thoughtful, respectful dental visits for People of Determination at Al Raha Mall in Abu Dhabi.">',
              '<meta name="twitter:description" content="رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في فرع سلوادي بالراحة مول في أبوظبي.">'
          )

          schema = {
              '@context': 'https://schema.org',
              '@graph': [
                  {
                      '@type': 'WebPage',
                      '@id': 'https://silwadi.ae/ar/treatments/people-of-determination.html#webpage',
                      'url': 'https://silwadi.ae/ar/treatments/people-of-determination.html',
                      'name': 'رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان',
                      'description': 'رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في فرع سلوادي بالراحة مول في أبوظبي.',
                      'inLanguage': 'ar-AE',
                      'isPartOf': {'@id': 'https://silwadi.ae/#website'},
                      'mainEntity': {'@id': 'https://silwadi.ae/ar/treatments/people-of-determination.html#service'},
                      'primaryImageOfPage': {'@type': 'ImageObject', 'url': 'https://silwadi.ae/assets/DSCF2857.webp'},
                  },
                  {
                      '@type': 'BreadcrumbList',
                      'itemListElement': [
                          {'@type': 'ListItem', 'position': 1, 'name': 'الرئيسية', 'item': 'https://silwadi.ae/ar/'},
                          {'@type': 'ListItem', 'position': 2, 'name': 'العلاجات', 'item': 'https://silwadi.ae/ar/treatments.html'},
                          {'@type': 'ListItem', 'position': 3, 'name': 'رعاية أسنان أصحاب الهمم', 'item': 'https://silwadi.ae/ar/treatments/people-of-determination.html'},
                      ],
                  },
                  {
                      '@type': 'Service',
                      '@id': 'https://silwadi.ae/ar/treatments/people-of-determination.html#service',
                      'name': 'رعاية أسنان أصحاب الهمم',
                      'serviceType': 'رعاية أسنان ميسّرة ومخططة بشكل فردي لأصحاب الهمم',
                      'url': 'https://silwadi.ae/ar/treatments/people-of-determination.html',
                      'provider': {'@id': 'https://silwadi.ae/#organization'},
                      'areaServed': {'@type': 'City', 'name': 'أبوظبي'},
                      'availableAtOrFrom': {'@type': 'Place', 'name': 'مركز سلوادي لطب الأسنان - الراحة مول'},
                  },
              ],
          }
          ar = re.sub(
              r'<script type="application/ld\+json" data-seo-schema>.*?</script>',
              '<script type="application/ld+json" data-seo-schema>' + json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '</script>',
              ar,
              count=1,
              flags=re.S,
          )

          # Paths: the Arabic page lives one directory deeper than the English page.
          ar = ar.replace('href="../favicon.svg"', 'href="/favicon.svg"')
          ar = ar.replace('href="../styles.css"', 'href="/styles.css"')
          ar = ar.replace('src="../assets/', 'src="/assets/')
          ar = ar.replace('src="../app.js"', 'src="/app.js"')
          ar = ar.replace('href="../contact.html#consultation-form"', 'href="/ar/contact.html#consultation-form"')
          ar = ar.replace('href="../services.html"', 'href="/ar/services.html"')
          ar = ar.replace('href="../treatments.html"', 'href="/ar/treatments.html"')
          ar = ar.replace('href="../doctors.html"', 'href="/ar/doctors.html"')
          ar = ar.replace('href="../about.html"', 'href="/ar/about.html"')
          ar = ar.replace('href="../locations.html"', 'href="/ar/locations.html"')
          ar = ar.replace('href="../contact.html"', 'href="/ar/contact.html"')

          # Arabic global navigation, with an exact English counterpart switch.
          ar = ar.replace('href="/" aria-label="Silwadi Dental Center home"', 'href="/ar/" aria-label="الصفحة الرئيسية لمركز سلوادي لطب الأسنان"')
          ar = ar.replace('href="/services.html"', 'href="/ar/services.html"')
          ar = ar.replace('href="/doctors.html"', 'href="/ar/doctors.html"')
          ar = ar.replace('href="/about.html"', 'href="/ar/about.html"')
          ar = ar.replace('href="/locations.html"', 'href="/ar/locations.html"')
          ar = ar.replace('href="/contact.html#consultation-form"', 'href="/ar/contact.html#consultation-form"')
          ar = ar.replace(
              'class="global-language" href="/ar/services.html" lang="ar" hreflang="ar" aria-label="عرض الموقع بالعربية">عربي</a>',
              'class="global-language" href="/treatments/people-of-determination.html" lang="en" hreflang="en" aria-label="View this page in English">EN</a>'
          )
          ar = ar.replace(
              '<a href="/ar/services.html" lang="ar" hreflang="ar">عربي</a>',
              '<a href="/treatments/people-of-determination.html" lang="en" hreflang="en">EN</a>'
          )
          ar = ar.replace('<body class="pod-page">', '<body class="pod-page language-ar static-arabic">')

          translations = {
              'Services <span aria-hidden="true">⌄</span>': 'الخدمات <span aria-hidden="true">⌄</span>',
              '>Doctors</a>': '>الأطباء</a>',
              '>About</a>': '>عن المركز</a>',
              '>Locations</a>': '>الفروع</a>',
              '<span>WhatsApp</span>': '<span>واتساب</span>',
              '>Book a Consultation</a>': '>احجز استشارة</a>',
              '<a href="/ar/services.html">Services</a>': '<a href="/ar/services.html">الخدمات</a>',
              '<span class="pod-subnav__label">On this page</span>': '<span class="pod-subnav__label">في هذه الصفحة</span>',
              '>Partnership</a>': '>الشراكة</a>',
              '>Care</a>': '>الرعاية</a>',
              '>Support needs</a>': '>احتياجات الدعم</a>',
              '>Before your visit</a>': '>قبل الزيارة</a>',
              '>Al Raha</a>': '>الراحة مول</a>',
              'People of Determination · Al Raha Mall': 'أصحاب الهمم · الراحة مول',
              'Dental Care for People of Determination in <span>Abu&nbsp;Dhabi</span>': 'رعاية أسنان أصحاب الهمم في <span>أبوظبي</span>',
              'Respectful dental care with an environment and visit plan shaped around the individual patient.': 'رعاية أسنان باحترام واهتمام، ضمن بيئة وخطة زيارة تُهيّأ وفق احتياجات كل مريض.',
              '>Request an Appointment</a>': '>اطلب موعداً</a>',
              '>Request Appointment</a>': '>اطلب موعداً</a>',
              'Official partnership · 10 April 2026': 'شراكة رسمية · 10 أبريل 2026',
              'Official Partnership with Zayed Authority for People of Determination': 'شراكة رسمية مع مؤسسة زايد العليا لأصحاب الهمم',
              'The formal MoU establishes an approved referral pathway for specialized dental services and supports more coordinated access to care for People of Determination.': 'تُرسّخ مذكرة التفاهم مسار إحالة معتمداً لخدمات طب الأسنان التخصصية، وتدعم وصولاً أكثر تنسيقاً إلى الرعاية لأصحاب الهمم.',
              'View official announcement ↗': 'عرض الإعلان الرسمي ↗',
              'Greater Access to Specialized Care': 'وصول أفضل إلى الرعاية التخصصية',
              'A More Inclusive Community': 'مجتمع أكثر شمولاً',
              'Healthier Smiles, Brighter Futures': 'ابتسامات أكثر صحة ومستقبل أكثر إشراقاً',
              'Care designed around the individual': 'رعاية مصممة حول احتياجات الفرد',
              'Thoughtful support, without making the visit feel complicated.': 'دعم مدروس من دون تعقيد تجربة الزيارة.',
              'Practical needs can be shared before the appointment so the Al Raha team can prepare the environment, communication and clinical approach appropriately.': 'يمكن مشاركة الاحتياجات العملية قبل الموعد حتى يتمكن فريق الراحة من تهيئة البيئة وطريقة التواصل والنهج السريري بالشكل المناسب.',
              'Accessible treatment environment': 'بيئة علاج ميسّرة',
