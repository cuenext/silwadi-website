              '>Call Al Raha</a>': '>اتصل بفرع الراحة</a>',
              'Tell us how we can support the visit.': 'أخبرنا كيف يمكننا دعم الزيارة.',
              'Request an appointment and share any access or support considerations with our Al Raha team in advance.': 'اطلب موعداً وشارك أي اعتبارات تتعلق بسهولة الوصول أو الدعم مع فريقنا في فرع الراحة مسبقاً.',
