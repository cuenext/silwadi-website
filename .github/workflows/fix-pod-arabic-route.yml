              'Individual care planning': 'تخطيط فردي للرعاية',
              'Relevant medical, mobility and support information can be shared before the visit and considered by the clinical team.': 'يمكن مشاركة المعلومات الطبية واحتياجات الحركة والدعم قبل الزيارة ليأخذها الفريق السريري في الاعتبار.',
