name: Apply POD and footer visual fixes v2

on:
  push:
    branches:
      - fix-pod-box-footer-logo-v2
    paths:
      - .github/workflows/fix-pod-box-footer-logo-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-pod-box-footer-logo-v2
          fetch-depth: 0

      - name: Patch site-wide footer logo matte and POD mobile care dividers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')

          marker = '/* Patch 25: POD mobile dividers + footer logo matte */'
          override = '''\n\n/* Patch 25: POD mobile dividers + footer logo matte */\n/* The official footer logo has a white matte; multiply makes white inherit the pale footer surface instead of rendering as a square. */\n.site-footer-logo{mix-blend-mode:multiply}\n@media(max-width:700px){\n  .pod-review .pod-care-grid{border:0!important}\n  .pod-review .pod-care-item,\n  .pod-review .pod-care-item:nth-child(3),\n  .pod-review .pod-care-item:nth-child(4){border:0!important;border-bottom:1px solid var(--pod-line)!important}\n  .pod-review .pod-care-item:last-child{border-bottom:0!important}\n}\n'''
          if marker not in css:
              css += override
          path.write_text(css, encoding='utf-8')
          PY

      - name: Verify visual-fix contract
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          assert '.site-footer-logo{mix-blend-mode:multiply}' in css
          assert '.pod-review .pod-care-grid{border:0!important}' in css
          assert '.pod-review .pod-care-item:last-child{border-bottom:0!important}' in css
          print('Footer matte and POD mobile outline fixes are present.')
          PY

      - name: Run POD regression tests
        run: |
          python -m unittest tests.test_private_pod_review
          python -m unittest tests/test_private_pod_raha_review.py
          python -m unittest tests/test_people_of_determination_gallery.py

      - name: Verify site footers still contain both branch contacts
        run: |
          python3 <<'PY'
          from pathlib import Path
          footer_pages = []
          failures = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '<footer class="site-footer">' not in text:
                  continue
              footer_pages.append(path)
              footer = text.split('<footer class="site-footer">', 1)[1].split('</footer>', 1)[0]
              is_ar = '/ar/' in f'/{path.as_posix()}' or 'lang="ar"' in text[:500]
              required = ['+971 2 626 2042', '+971 2 666 2408', 'tel:+97126662408', 'Al Raha Mall' if not is_ar else 'الراحة مول']
              missing = [item for item in required if item not in footer]
              if missing:
                  failures.append(f'{path}: missing {missing}')
          assert footer_pages, 'No site footer pages found'
          assert not failures, '\n'.join(failures)
          print(f'Validated {len(footer_pages)} footers')
          PY

      - name: Commit verified CSS changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-pod-box-footer-logo-v2.yml
          git add styles.css
          git commit -m 'Fix POD mobile dividers and footer logo matte'
          git push origin HEAD:fix-pod-box-footer-logo-v2
