name: Fix service cards and image repetition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-service-cards-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current bug, patch service cards, and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_treatment_paths(path, new_block):
              text = Path(path).read_text(encoding='utf-8')
              start_marker = '<div class="treatment-paths">'
              end_marker = '<div class="section-link reveal">'
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + new_block + text[end:]

          en_index = Path('index.html').read_text(encoding='utf-8')
          ar_index = Path('ar/index.html').read_text(encoding='utf-8')
          en_services = Path('services.html').read_text(encoding='utf-8')
          ar_services = Path('ar/services.html').read_text(encoding='utf-8')

          # RED: prove the bugs/old state are present before patching.
          assert '<h3>Prosthodontics &amp; Implantology</h3>' in en_index
          assert '<h3>تركيبات وزراعة الأسنان</h3>' in ar_index
          assert '<div class="services-hero__visual"><img src="assets/services/prosthodontics.webp"' in en_services
          assert 'id="prosthodontics"><div class="service-card__image"><img src="assets/services/prosthodontics.webp"' in en_services
          assert 'id="implantology"><div class="service-card__image"><img src="assets/services/prosthodontics.webp"' in en_services
          assert '<div class="services-hero__visual"><img src="/assets/services/prosthodontics.webp"' in ar_services

          en_block = '''<div class="treatment-paths"><a class="treatment-path reveal" href="services.html#prosthodontics"><span class="treatment-path__index">01</span><span class="treatment-path__thumb"><img src="assets/services/cosmetics.webp?v=20260906-servicefix-1" alt="Prosthodontic restorations" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>Prosthodontics</h3><p>Specialist restorative care for repairing or replacing teeth with crowns, bridges, veneers, dentures and other prosthetic solutions.</p></div><b aria-hidden="true">→</b></a><a class="treatment-path reveal" href="treatments/dental-implants.html"><span class="treatment-path__index">02</span><span class="treatment-path__thumb"><img src="assets/services/prosthodontics.webp?v=20260906-servicefix-1" alt="Dental implant care" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>Implantology</h3><p>Dental implants replace missing tooth roots and can support crowns, bridges or dentures after clinical assessment and treatment planning.</p></div><b aria-hidden="true">→</b></a><a class="treatment-path reveal" href="treatments/orthodontics.html"><span class="treatment-path__index">03</span><span class="treatment-path__thumb"><img src="assets/services/orthodontics.webp?v=20260906-servicefix-1" alt="Orthodontic care" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>Orthodontics</h3><p>Specialist care for braces, aligners, tooth alignment and bite correction.</p></div><b aria-hidden="true">→</b></a><a class="treatment-path reveal" href="treatments/cosmetic-dentistry.html"><span class="treatment-path__index">04</span><span class="treatment-path__thumb"><img src="assets/services/teeth-whitening.webp?v=20260906-servicefix-1" alt="Cosmetic dentistry and teeth whitening" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>Cosmetic Dentistry &amp; Teeth Whitening</h3><p>Aesthetic dental care including Hollywood Smile planning, veneers, smile design and professional teeth whitening after assessment.</p></div><b aria-hidden="true">→</b></a><a class="treatment-path reveal" href="treatments/general-dentistry.html"><span class="treatment-path__index">05</span><span class="treatment-path__thumb"><img src="assets/services/preventive-dentistry.webp?v=20260906-servicefix-1" alt="Preventive dental care" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>Preventive Treatments</h3><p>Routine examinations, preventive planning and care that supports ongoing oral health.</p></div><b aria-hidden="true">→</b></a><a class="treatment-path reveal" href="services.html#periodontics"><span class="treatment-path__index">06</span><span class="treatment-path__thumb"><img src="assets/services/periodontics.webp?v=20260906-servicefix-1" alt="Periodontal care" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>Periodontics</h3><p>Specialist care for the gums and supporting tissues around the teeth.</p></div><b aria-hidden="true">→</b></a></div>'''

          ar_block = '''<div class="treatment-paths"><a class="treatment-path reveal" href="/ar/services.html#prosthodontics"><span class="treatment-path__index">01</span><span class="treatment-path__thumb"><img src="/assets/services/cosmetics.webp?v=20260906-servicefix-1" alt="رعاية تركيبات الأسنان" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>تركيبات الأسنان</h3><p>رعاية تخصصية لترميم الأسنان أو تعويضها بالتيجان والجسور والقشور والأطقم وغيرها من الحلول التعويضية.</p></div></a><a class="treatment-path reveal" href="/ar/treatments/dental-implants.html"><span class="treatment-path__index">02</span><span class="treatment-path__thumb"><img src="/assets/services/prosthodontics.webp?v=20260906-servicefix-1" alt="رعاية زراعة الأسنان" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>زراعة الأسنان</h3><p>تعوّض زراعة الأسنان جذور الأسنان المفقودة ويمكن أن تدعم التيجان أو الجسور أو الأطقم بعد التقييم والتخطيط العلاجي.</p></div></a><a class="treatment-path reveal" href="/ar/treatments/orthodontics.html"><span class="treatment-path__index">03</span><span class="treatment-path__thumb"><img src="/assets/services/orthodontics.webp?v=20260906-servicefix-1" alt="رعاية تقويم الأسنان" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>تقويم الأسنان</h3><p>رعاية تخصصية للتقويم والصفافات وتصحيح اصطفاف الأسنان والإطباق.</p></div></a><a class="treatment-path reveal" href="/ar/treatments/cosmetic-dentistry.html"><span class="treatment-path__index">04</span><span class="treatment-path__thumb"><img src="/assets/services/teeth-whitening.webp?v=20260906-servicefix-1" alt="تجميل الأسنان وتبييض الأسنان" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>تجميل الأسنان وتبييض الأسنان</h3><p>رعاية تجميلية تشمل هوليوود سمايل والقشور وتصميم الابتسامة وتبييض الأسنان الاحترافي بعد التقييم.</p></div></a><a class="treatment-path reveal" href="/ar/treatments/general-dentistry.html"><span class="treatment-path__index">05</span><span class="treatment-path__thumb"><img src="/assets/services/preventive-dentistry.webp?v=20260906-servicefix-1" alt="رعاية الأسنان الوقائية" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>العلاجات الوقائية</h3><p>فحوصات دورية وتخطيط وقائي ورعاية تدعم صحة الفم المستمرة.</p></div></a><a class="treatment-path reveal" href="/ar/services.html#periodontics"><span class="treatment-path__index">06</span><span class="treatment-path__thumb"><img src="/assets/services/periodontics.webp?v=20260906-servicefix-1" alt="رعاية اللثة" width="1200" height="900" loading="lazy" decoding="async"></span><div><h3>أمراض اللثة</h3><p>رعاية تخصصية للثة والأنسجة الداعمة المحيطة بالأسنان.</p></div></a></div>'''

          en_index = replace_treatment_paths('index.html', en_block)
          ar_index = replace_treatment_paths('ar/index.html', ar_block)

          # Services page: make every visible hero/card image unique while keeping imagery clinically relevant.
          en_services = en_services.replace(
              '<div class="services-hero__visual"><img src="assets/services/prosthodontics.webp" alt="Dental restoration and prosthodontic care"',
              '<div class="services-hero__visual"><img src="assets/services/endodontics.webp?v=20260906-servicefix-1" alt="Dental care at Silwadi Dental Center Abu Dhabi"',
              1,
          )
          en_services = en_services.replace(
              'id="prosthodontics"><div class="service-card__image"><img src="assets/services/prosthodontics.webp" alt="Prosthodontics care at Silwadi Dental Center Abu Dhabi"',
              'id="prosthodontics"><div class="service-card__image"><img src="assets/services/cosmetics.webp?v=20260906-servicefix-1" alt="Prosthodontic restorative care at Silwadi Dental Center Abu Dhabi"',
              1,
          )
          en_services = en_services.replace(
              'id="implantology"><div class="service-card__image"><img src="assets/services/prosthodontics.webp" alt="Dental implant care at Silwadi Dental Center Abu Dhabi"',
              'id="implantology"><div class="service-card__image"><img src="assets/services/prosthodontics.webp?v=20260906-servicefix-1" alt="Dental implant care at Silwadi Dental Center Abu Dhabi"',
              1,
          )
          en_services = en_services.replace(
              'id="cosmetic-dentistry"><div class="service-card__image"><img src="assets/services/cosmetics.webp" alt="Cosmetic dentistry, Hollywood Smile and teeth whitening at Silwadi Dental Center Abu Dhabi"',
              'id="cosmetic-dentistry"><div class="service-card__image"><img src="assets/services/teeth-whitening.webp?v=20260906-servicefix-1" alt="Cosmetic dentistry, Hollywood Smile and teeth whitening at Silwadi Dental Center Abu Dhabi"',
              1,
          )

          ar_services = ar_services.replace(
              '<div class="services-hero__visual"><img src="/assets/services/prosthodontics.webp" alt="رعاية ترميم الأسنان وتركيباتها"',
              '<div class="services-hero__visual"><img src="/assets/services/endodontics.webp?v=20260906-servicefix-1" alt="رعاية الأسنان في مركز سلوادي بأبوظبي"',
              1,
          )
          ar_services = ar_services.replace(
              'id="prosthodontics"><div class="service-card__image"><img src="/assets/services/prosthodontics.webp" alt="رعاية تركيبات الأسنان في مركز سلوادي بأبوظبي"',
              'id="prosthodontics"><div class="service-card__image"><img src="/assets/services/cosmetics.webp?v=20260906-servicefix-1" alt="رعاية تركيبات الأسنان في مركز سلوادي بأبوظبي"',
              1,
          )
          ar_services = ar_services.replace(
              'id="implantology"><div class="service-card__image"><img src="/assets/services/prosthodontics.webp" alt="رعاية زراعة الأسنان في مركز سلوادي بأبوظبي"',
              'id="implantology"><div class="service-card__image"><img src="/assets/services/prosthodontics.webp?v=20260906-servicefix-1" alt="رعاية زراعة الأسنان في مركز سلوادي بأبوظبي"',
              1,
          )
          ar_services = ar_services.replace(
              'id="cosmetic-dentistry"><div class="service-card__image"><img src="/assets/services/cosmetics.webp" alt="تجميل الأسنان وهوليوود سمايل وتبييض الأسنان في مركز سلوادي بأبوظبي"',
              'id="cosmetic-dentistry"><div class="service-card__image"><img src="/assets/services/teeth-whitening.webp?v=20260906-servicefix-1" alt="تجميل الأسنان وهوليوود سمايل وتبييض الأسنان في مركز سلوادي بأبوظبي"',
              1,
          )

          Path('index.html').write_text(en_index, encoding='utf-8')
          Path('ar/index.html').write_text(ar_index, encoding='utf-8')
          Path('services.html').write_text(en_services, encoding='utf-8')
          Path('ar/services.html').write_text(ar_services, encoding='utf-8')

          # GREEN: verify structure and that visible Services imagery is not repeated.
          assert '<h3>Prosthodontics &amp; Implantology</h3>' not in en_index
          assert '<h3>تركيبات وزراعة الأسنان</h3>' not in ar_index
          assert en_index.count('class="treatment-path reveal"') >= 6
          assert '<h3>Prosthodontics</h3>' in en_index and '<h3>Implantology</h3>' in en_index
          assert '<h3>Cosmetic Dentistry &amp; Teeth Whitening</h3>' in en_index
          assert '<h3>تركيبات الأسنان</h3>' in ar_index and '<h3>زراعة الأسنان</h3>' in ar_index

          def visible_service_images(text, prefix=''):
              hero = re.search(r'<div class="services-hero__visual"><img src="([^"]+)"', text).group(1)
              cards = re.findall(r'<article class="service-card reveal"[^>]*><div class="service-card__image(?: [^"]*)?"><img src="([^"]+)"', text)
              clean = [re.sub(r'\?.*$', '', x) for x in [hero] + cards]
              return clean

          en_imgs = visible_service_images(en_services)
          ar_imgs = visible_service_images(ar_services)
          assert len(en_imgs) == 10, en_imgs
          assert len(set(en_imgs)) == 10, en_imgs
          assert len(ar_imgs) == 10, ar_imgs
          assert len(set(ar_imgs)) == 10, ar_imgs
          assert 'assets/services/cosmetics.webp' in en_imgs
          assert 'assets/services/prosthodontics.webp' in en_imgs
          assert 'assets/services/periodontics.webp' in en_imgs
          print('English visible service images:', en_imgs)
          print('Arabic visible service images:', ar_imgs)
          print('Service card split and image de-duplication verified.')
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit website fix
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html ar/index.html services.html ar/services.html
          git diff --cached --stat
          git commit -m 'fix: split homepage services and remove repeated imagery [skip arabic build]'
          git push
