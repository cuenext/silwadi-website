name: Google authority SEO tests

on:
  push:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'tests/test_google_authority.py'
      - '.github/workflows/google-authority-test.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'tests/test_google_authority.py'
      - '.github/workflows/google-authority-test.yml'

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Google authority regression contract
        run: python -m unittest tests.test_google_authority -v
