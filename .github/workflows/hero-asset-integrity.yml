name: Hero asset integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-asset-integrity.yml'
      - 'index.html'
      - 'ar/index.html'
      - 'assets/munir-home-hero-clean-20260906.jpg'
      - 'assets/munir-home-hero-mobile-clean-20260906.jpg'

jobs:
  verify-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean hero assets and references
        run: |
          set -euo pipefail
          test -f assets/munir-home-hero-clean-20260906.jpg
          test -f assets/munir-home-hero-mobile-clean-20260906.jpg
          test "$(stat -c%s assets/munir-home-hero-clean-20260906.jpg)" -gt 250000
          test "$(stat -c%s assets/munir-home-hero-mobile-clean-20260906.jpg)" -gt 250000
          file assets/munir-home-hero-clean-20260906.jpg | grep -q 'JPEG image data'
          file assets/munir-home-hero-mobile-clean-20260906.jpg | grep -q 'JPEG image data'
          sha256sum assets/munir-home-hero-clean-20260906.jpg | grep -q '^6b4827569d9de5d90469a57de5fea42167af79f59f2da0500c60fd3e83c5664c '
          sha256sum assets/munir-home-hero-mobile-clean-20260906.jpg | grep -q '^8c6dc45c0a8a8a460cae4b99edc48bfac5c4490d6b07ca1cacd73386c3cb065e '
          grep -q 'assets/munir-home-hero-clean-20260906.jpg?v=20260906-hero-clean-1' index.html
          grep -q 'assets/munir-home-hero-mobile-clean-20260906.jpg?v=20260906-hero-clean-1' index.html
          grep -q '/assets/munir-home-hero-clean-20260906.jpg?v=20260906-hero-clean-1' ar/index.html
          grep -q '/assets/munir-home-hero-mobile-clean-20260906.jpg?v=20260906-hero-clean-1' ar/index.html
