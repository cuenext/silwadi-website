name: Homepage featured doctors test

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_homepage_featured_doctors.py'
      - 'index.html'
      - 'ar/index.html'
      - '.github/workflows/homepage-featured-doctors-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify homepage featured doctor cards
        run: python -m unittest tests.test_homepage_featured_doctors
