name: Lana Almasoud name regression

on:
  push:
    branches: [main]
    paths:
      - 'doctors.html'
      - 'doctors/dr-lana-masoud.html'
      - 'ar/doctors/dr-lana-masoud.html'
      - 'tests/test_lana_almasoud_name.py'
      - '.github/workflows/lana-almasoud-name-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_lana_almasoud_name -v
