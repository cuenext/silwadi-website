name: Light theme regression

on:
  push:
    branches: [main]
    paths:
      - 'styles.css'
      - '.github/workflows/light-theme-regression.yml'

# Protects the clinic's light visual identity from browser auto-dark transformations.
permissions:
  contents: read

jobs:
  verify-light-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify browsers cannot auto-darken the site
        run: |
          python3 <<'PY'
          from pathlib import Path

          css = Path('styles.css').read_text(encoding='utf-8')
          compact = ''.join(css.split())

          assert 'color-scheme:onlylight' in compact, 'styles.css must declare color-scheme: only light'
          assert 'html{' in compact and 'background:#fff' in compact, 'html must have an explicit white canvas'
          PY
