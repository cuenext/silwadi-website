name: Lighthouse Diagnostic

on:
  push:
    branches:
      - audit-lighthouse-prelaunch

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-lighthouse-prelaunch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start site and find Chrome
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - name: Repeat implants mobile and capture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lh
          for i in 1 2 3; do
            npx --yes lighthouse@latest http://127.0.0.1:8765/treatments/dental-implants.html \
              --output=json --output-path="/tmp/lh/implants-${i}.json" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo --quiet
          done
          npx --yes lighthouse@latest http://127.0.0.1:8765/ \
            --output=json --output-path=/tmp/lh/home.json \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --only-categories=performance,accessibility,best-practices,seo --quiet
      - name: Write diagnostic report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from statistics import median

          root=Path('/tmp/lh')
          runs=[]
          for i in (1,2,3):
              d=json.loads((root/f'implants-{i}.json').read_text())
              a=d['audits']; c=d['categories']
              runs.append({
                  'run':i,
                  'perf':round(c['performance']['score']*100),
                  'lcp':a['largest-contentful-paint'].get('numericValue'),
                  'lcp_display':a['largest-contentful-paint'].get('displayValue'),
                  'fcp':a['first-contentful-paint'].get('displayValue'),
                  'tbt':a['total-blocking-time'].get('displayValue'),
                  'cls':a['cumulative-layout-shift'].get('displayValue'),
              })
          med_perf=median([x['perf'] for x in runs])
          med_lcp=median([x['lcp'] for x in runs])

          def node_lines(data, audit_id, limit=12):
              audit=data['audits'].get(audit_id,{})
              details=audit.get('details') or {}
              items=details.get('items') or []
              out=[]
              for item in items[:limit]:
                  node=item.get('node') or item.get('tapTarget') or {}
                  if isinstance(node,dict):
                      selector=node.get('selector') or ''
                      snippet=node.get('snippet') or ''
                  else:
                      selector=snippet=''
                  out.append((selector,snippet,str(item.get('contrastRatio','')),str(item.get('expectedContrastRatio',''))))
              return audit.get('title',audit_id),out

          home=json.loads((root/'home.json').read_text())
          contrast_title,contrast=node_lines(home,'color-contrast')
          tap_title,taps=node_lines(home,'tap-targets')

          d=json.loads((root/'implants-2.json').read_text())
          requests=d['audits'].get('network-requests',{}).get('details',{}).get('items',[]) or []
          requests=sorted(requests,key=lambda x:x.get('transferSize',0),reverse=True)[:10]

          lcp_details=[]
          for key,audit in d['audits'].items():
              if 'largest-contentful' in key or key.startswith('lcp-'):
                  det=audit.get('details') or {}
                  items=det.get('items') or []
                  for item in items[:5]:
                      node=item.get('node') or {}
                      if isinstance(node,dict) and (node.get('selector') or node.get('snippet')):
                          lcp_details.append((key,node.get('selector',''),node.get('snippet','')))

          lines=['# Lighthouse Diagnostic','', '## Dental Implants mobile repeat', '', '| Run | Performance | FCP | LCP | TBT | CLS |','|---:|---:|---:|---:|---:|---:|']
          for x in runs:
              lines.append(f"| {x['run']} | {x['perf']} | {x['fcp']} | {x['lcp_display']} | {x['tbt']} | {x['cls']} |")
          lines += ['',f'- Median performance: **{med_perf:.0f}**',f'- Median LCP: **{med_lcp/1000:.2f} s**','', '## Largest transferred resources — Dental Implants', '']
          for r in requests:
              url=r.get('url',''); size=r.get('transferSize',0); resource=r.get('resourceType','')
              lines.append(f'- {size/1024:.1f} KB — {resource} — `{url}`')
          lines += ['', '## LCP element diagnostics', '']
          if lcp_details:
              for key,selector,snippet in lcp_details:
                  lines.append(f'- `{key}` — `{selector}` — `{snippet}`')
          else:
              lines.append('- Lighthouse did not expose a node snippet in the available LCP audit details.')
          lines += ['',f'## {contrast_title} — Home mobile','']
          for selector,snippet,ratio,expected in contrast:
              lines.append(f'- `{selector}` — `{snippet}` — ratio {ratio}; expected {expected}')
          lines += ['',f'## {tap_title} — Home mobile','']
          for selector,snippet,_,_ in taps:
              lines.append(f'- `{selector}` — `{snippet}`')
          lines.append('')
          Path('docs/launch/LIGHTHOUSE-DIAGNOSTIC.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Self-clean and save diagnostic
        if: always()
        shell: bash
        run: |
          if [ ! -f docs/launch/LIGHTHOUSE-DIAGNOSTIC.md ]; then
            printf '# Lighthouse Diagnostic\n\nFAILED TO COMPLETE. No diagnostic score claims should be made.\n' > docs/launch/LIGHTHOUSE-DIAGNOSTIC.md
          fi
          rm -f .github/workflows/lighthouse-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/launch/LIGHTHOUSE-DIAGNOSTIC.md .github/workflows/lighthouse-diagnostic.yml
          git commit -m 'docs: record Lighthouse diagnostic'
          git push origin HEAD:audit-lighthouse-prelaunch
