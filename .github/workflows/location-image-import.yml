name: Location image import

on:
  push:
    branches:
      - fix/locations-two-branch-experience
    paths:
      - 'assets/locations/_upload_chunks_v2/READY'

permissions:
  contents: write

jobs:
  decode-location-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/locations-two-branch-experience

      - name: Decode and validate location images
        shell: bash
        run: |
          set -euo pipefail
          v2='assets/locations/_upload_chunks_v2'
          legacy='assets/locations/_upload_chunks'

          cat "$legacy/bani-yas-treatment-room.webp.part-"* | base64 --decode > assets/locations/bani-yas-treatment-room.webp
          for name in al-raha-exterior.webp al-raha-treatment-room.webp al-raha-reception.webp al-raha-children-room.webp al-raha-waiting-area.webp; do
            cat "$v2/$name.part-"* | base64 --decode > "assets/locations/$name"
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
              'bani-yas-treatment-room.webp',
              'al-raha-exterior.webp',
              'al-raha-treatment-room.webp',
              'al-raha-reception.webp',
              'al-raha-children-room.webp',
              'al-raha-waiting-area.webp',
          ]
          root = Path('assets/locations')
          for name in names:
              p = root / name
              data = p.read_bytes()
              assert len(data) > 6000, (name, len(data))
              assert data[:4] == b'RIFF', name
              assert data[8:12] == b'WEBP', name
              with Image.open(p) as im:
                  im.verify()
              print(name, len(data))
          PY

      - name: Commit decoded image assets and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/locations/_upload_chunks assets/locations/_upload_chunks_v2
          rm -f assets/locations/.binary-upload-test
          rm -f .github/workflows/location-image-import.yml
          git config user.name 'ADVA'
          git config user.email 'abdullahavadoglu@gmail.com'
          git add -A assets/locations .github/workflows/location-image-import.yml
          git commit -m 'Replace truncated location images with valid WebP assets'
          git push origin HEAD:fix/locations-two-branch-experience
