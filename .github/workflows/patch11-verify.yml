name: Patch 11 Verification

on:
  push:
    branches:
      - patch-11-performance-mobile-clean

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate optimized doctor WebPs cleanly
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/doctors')
          target = source / 'optimized'
          target.mkdir(exist_ok=True)
          expected = sorted(source.glob('*.png'))
          assert len(expected) == 12, len(expected)
          for png in expected:
              out = target / f'{png.stem}.webp'
              with Image.open(png) as im:
                  im.thumbnail((720, 720), Image.Resampling.LANCZOS)
                  bands = im.getbands()
                  if 'A' in bands:
                      if im.mode != 'RGBA':
                          im = im.convert('RGBA')
                  elif im.mode != 'RGB':
                      im = im.convert('RGB')
                  im.save(out, 'WEBP', quality=82, method=6)
          print(f'generated={len(expected)}')
          PY

      - name: Full regression suite
        run: python -m unittest discover -s tests -p '*.py' -v

      - name: JavaScript syntax
        run: node --check app.js

      - name: Internal links assets and JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import json, re

          root = Path('.')
          html_files = sorted(root.rglob('*.html'))
          broken = []
          json_errors = []
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              for attr, raw in re.findall(r'\b(href|src)=["\']([^"\']+)["\']', text, re.I):
                  if raw.startswith(('http://','https://','mailto:','tel:','data:','javascript:','#')):
                      continue
                  path_part = unquote(raw.split('#',1)[0].split('?',1)[0])
                  if not path_part:
                      continue
                  target = (page.parent / path_part).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      broken.append((str(page), raw, 'outside-root'))
                      continue
                  if not target.exists():
                      broken.append((str(page), raw, 'missing'))
              for idx, block in enumerate(re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', text, re.I|re.S), 1):
                  try:
                      json.loads(block)
                  except Exception as exc:
                      json_errors.append((str(page), idx, str(exc)))
          print(f'html_pages={len(html_files)} broken_internal_links_assets={len(broken)} jsonld_errors={len(json_errors)}')
          if broken:
              print(*broken, sep='\n')
          if json_errors:
              print(*json_errors, sep='\n')
          assert not broken
          assert not json_errors
          PY

      - name: Image integrity and payload
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/doctors')
          originals = sorted(source.glob('*.png'))
          optimized = sorted((source/'optimized').glob('*.webp'))
          assert len(originals) == 12
          assert len(optimized) == 12
          original_total = sum(p.stat().st_size for p in originals)
          optimized_total = sum(p.stat().st_size for p in optimized)
          for png in originals:
              webp = source/'optimized'/f'{png.stem}.webp'
              assert webp.is_file()
              assert webp.stat().st_size > 0
              assert webp.stat().st_size < png.stat().st_size
              with Image.open(webp) as im:
                  assert im.format == 'WEBP', (webp, im.format)
                  assert max(im.size) <= 720, (webp, im.size)
                  im.verify()
          reduction = (1 - optimized_total/original_total) * 100
          print(f'original_bytes={original_total} optimized_bytes={optimized_total} reduction_percent={reduction:.2f}')
          PY

      - name: Local HTTP 200 smoke
        run: |
          python -m http.server 8765 >/tmp/silwadi-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          mapfile -t htmls < <(find . -type f -name '*.html' -not -path './.git/*' | sort)
          test "${#htmls[@]}" -eq 24
          urls=()
          for f in "${htmls[@]}"; do urls+=("/${f#./}"); done
          urls+=("/robots.txt" "/sitemap.xml" "/app.js" "/styles.css" "/assets/silwadi-logo-original.jpeg")
          test "${#urls[@]}" -eq 29
          ok=0
          for url in "${urls[@]}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765$url")
            test "$code" = "200"
            ok=$((ok+1))
          done
          echo "http_200=$ok/29"

      - name: Commit generated binaries and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/patch11-verify.yml
          git add -A assets/doctors/optimized .github/workflows/patch11-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize Patch 11 generated assets and verification cleanup'
            git push origin HEAD:patch-11-performance-mobile-clean
          fi
