name: Verify cleaned Patch 12 release tree

on:
  push:
    branches:
      - patch-12-final-seo-launch-clean

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-12-final-seo-launch-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image-test dependency
        run: python -m pip install --disable-pip-version-check pillow

      - id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p '*.py' -v 2>&1 | tee /tmp/tests.log

      - id: js
        continue-on-error: true
        shell: bash
        run: node --check app.js 2>&1 | tee /tmp/js.log

      - id: seo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/seo_launch_audit.py 2>&1 | tee /tmp/seo.log

      - id: links
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/links.log
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          ROOT=Path('.').resolve(); broken=[]; checked=0
          class C(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in {'a','link'} and d.get('href'): self.refs.append(d['href'])
                  if tag in {'img','script','iframe','source'} and d.get('src'): self.refs.append(d['src'])
          for page in sorted(ROOT.rglob('*.html')):
              p=C(); p.feed(page.read_text(encoding='utf-8'))
              for raw in p.refs:
                  ref=raw.strip()
                  if not ref or ref.startswith('#'): continue
                  u=urlsplit(ref)
                  if u.scheme.lower() in {'http','https','mailto','tel','data','javascript'} or u.netloc: continue
                  rel=unquote(u.path)
                  if not rel: continue
                  target=(ROOT/rel.lstrip('/')) if rel.startswith('/') else (page.parent/rel)
                  target=target.resolve(); checked+=1
                  if target.is_dir(): target=target/'index.html'
                  if not target.exists(): broken.append(f'{page.relative_to(ROOT)} -> {ref}')
          print(f'Internal reference audit: {checked} local references, {len(broken)} broken')
          for x in broken: print(f'- {x}')
          if broken: raise SystemExit(1)
          PY

      - id: jsonld
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/jsonld.log
          from pathlib import Path
          import json,re
          errors=[]; blocks=0
          for path in sorted(Path('.').rglob('*.html')):
              html=path.read_text(encoding='utf-8')
              for i,b in enumerate(re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',html,re.I|re.S),1):
                  blocks+=1
                  try: json.loads(b)
                  except json.JSONDecodeError as e: errors.append(f'{path}: block {i}: {e}')
          print(f'JSON-LD audit: {blocks} blocks, {len(errors)} errors')
          for e in errors: print(f'- {e}')
          if errors: raise SystemExit(1)
          PY

      - id: http
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http-server.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT; sleep 1
          python - <<'PY' 2>&1 | tee /tmp/http.log
          from urllib.request import urlopen
          import xml.etree.ElementTree as ET
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('sitemap.xml').getroot()
          paths=[loc.text.removeprefix('https://silwadi.ae') or '/' for loc in root.findall('sm:url/sm:loc',ns)]
          paths += ['/robots.txt','/sitemap.xml','/app.js','/styles.css','/favicon.svg']
          if len(paths)!=29: raise SystemExit(f'expected 29 smoke resources, got {len(paths)}')
          failures=[]
          for path in paths:
              try:
                  with urlopen(f'http://127.0.0.1:8765{path}',timeout=5) as r: code=r.status
              except Exception as e: failures.append(f'{path}: {e}'); continue
              if code!=200: failures.append(f'{path}: HTTP {code}')
          print(f'HTTP smoke: {len(paths)-len(failures)}/{len(paths)} returned 200')
          for f in failures: print(f'- {f}')
          if failures: raise SystemExit(1)
          PY

      - name: Record result and self-clean
        if: always()
        shell: bash
        env:
          TESTS: ${{ steps.tests.outcome }}
          JS: ${{ steps.js.outcome }}
          SEO: ${{ steps.seo.outcome }}
          LINKS: ${{ steps.links.outcome }}
          JSONLD: ${{ steps.jsonld.outcome }}
          HTTP: ${{ steps.http.outcome }}
        run: |
          overall=PASS
          for o in "$TESTS" "$JS" "$SEO" "$LINKS" "$JSONLD" "$HTTP"; do [ "$o" = success ] || overall=FAIL; done
          test_count=$(sed -nE 's/^Ran ([0-9]+) tests.*/\1/p' /tmp/tests.log 2>/dev/null | tail -1); test_count=${test_count:-unknown}
          seo_summary=$(head -1 /tmp/seo.log 2>/dev/null || true)
          link_summary=$(tail -1 /tmp/links.log 2>/dev/null || true)
          jsonld_summary=$(tail -1 /tmp/jsonld.log 2>/dev/null || true)
          http_summary=$(tail -1 /tmp/http.log 2>/dev/null || true)
          cat > docs/launch/PATCH12-QA-REPORT.md <<EOF
          # Patch 12 — Final SEO QA Report

          Verified: 2026-08-22
          Overall: ${overall}
          Branch: \`patch-12-final-seo-launch-clean\`

          ## Gate outcomes

          - Full regression suite: ${TESTS} — ${test_count} tests, with Pillow installed only for WebP integrity tests.
          - JavaScript syntax: ${JS} — \`node --check app.js\`.
          - SEO launch audit: ${SEO} — ${seo_summary:-no summary}.
          - Internal links/assets: ${LINKS} — ${link_summary:-no summary}.
          - JSON-LD: ${JSONLD} — ${jsonld_summary:-no summary}.
          - Local HTTP smoke: ${HTTP} — ${http_summary:-no summary}.
          - Patch 12 RED proof was recorded before implementation.

          ## Launch package

          - Primary canonical origin: \`https://silwadi.ae\`.
          - 24 canonical URLs in \`sitemap.xml\`, each with significant-update \`lastmod\` of \`2026-08-22\`.
          - Stable 64×64 SVG favicon and explicit index/follow/max-image-preview policy across all canonical pages.
          - Legacy migration map: \`docs/launch/legacy-redirect-map.csv\` with permanent 301 targets for known indexed legacy pages and all 12 doctor-detail URLs.
          - Operational handoff: \`docs/launch/SEO-LAUNCH-CHECKLIST.md\`.

          ## Deployment-only verification still required

          The repository cannot prove server-side redirects, DNS/TLS cutover, Google Search Console, Bing Webmaster Tools, Google Business Profile, or public production behavior before those systems are configured. Keep the legacy domain/SSL active for redirects and follow the launch checklist after deployment.

          ## Lighthouse

          Lighthouse was not run for Patch 12. No Lighthouse score is claimed.
          EOF
          rm -f .github/workflows/patch12-postclean-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "test: verify cleaned Patch 12 tree ${overall}"
          git push origin HEAD:patch-12-final-seo-launch-clean
          [ "$overall" = PASS ]
