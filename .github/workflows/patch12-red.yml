name: Patch 12 RED proof

on:
  push:
    branches:
      - patch-12-final-seo-launch-clean

permissions:
  contents: write

jobs:
  red-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-12-final-seo-launch-clean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Patch 12 contract is RED
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_patch12_launch_seo -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Patch 12 contract unexpectedly passed before implementation"
            exit 1
          fi
          mkdir -p docs
          printf 'Patch 12 RED confirmed on %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/.patch12-red-confirmed
      - name: Record RED proof and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch12-red.yml
          git add docs/.patch12-red-confirmed .github/workflows/patch12-red.yml
          git commit -m 'test: confirm Patch 12 RED contract'
          git push origin HEAD:patch-12-final-seo-launch-clean
