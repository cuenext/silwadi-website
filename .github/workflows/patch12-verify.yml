name: Verify Patch 12 release candidate

on:
  push:
    branches:
      - patch-12-final-seo-launch-clean

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-12-final-seo-launch-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: tests
        name: Full regression suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p '*.py' -v 2>&1 | tee /tmp/patch12-tests.log

      - id: js
        name: JavaScript syntax
        continue-on-error: true
        shell: bash
        run: node --check app.js 2>&1 | tee /tmp/patch12-js.log

      - id: seo
        name: SEO launch audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/seo_launch_audit.py 2>&1 | tee /tmp/patch12-seo-audit.log

      - id: links
        name: Internal links and assets
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/patch12-links.log
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          ROOT = Path('.').resolve()
          broken = []
          checked = 0

          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag in {'a', 'link'} and data.get('href'):
                      self.refs.append(data['href'])
                  if tag in {'img', 'script', 'iframe', 'source'} and data.get('src'):
                      self.refs.append(data['src'])

          for html_path in sorted(ROOT.rglob('*.html')):
              parser = Collector()
              parser.feed(html_path.read_text(encoding='utf-8'))
              for raw in parser.refs:
                  ref = raw.strip()
                  if not ref or ref.startswith('#'):
                      continue
                  parsed = urlsplit(ref)
                  if parsed.scheme.lower() in {'http', 'https', 'mailto', 'tel', 'data', 'javascript'} or parsed.netloc:
                      continue
                  relative = unquote(parsed.path)
                  if not relative:
                      continue
                  target = ROOT / relative.lstrip('/') if relative.startswith('/') else html_path.parent / relative
                  target = target.resolve()
                  checked += 1
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.exists():
                      broken.append(f'{html_path.relative_to(ROOT)} -> {ref}')

          print(f'Internal reference audit: {checked} local references, {len(broken)} broken')
          for item in broken:
              print(f'- {item}')
          if broken:
              raise SystemExit(1)
          PY

      - id: jsonld
        name: JSON-LD parse audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/patch12-jsonld.log
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')
          errors = []
          blocks = 0
          for path in sorted(ROOT.rglob('*.html')):
              html = path.read_text(encoding='utf-8')
              found = re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', html, re.I | re.S)
              for index, block in enumerate(found, 1):
                  blocks += 1
                  try:
                      json.loads(block)
                  except json.JSONDecodeError as exc:
                      errors.append(f'{path}: block {index}: {exc}')
          print(f'JSON-LD audit: {blocks} blocks, {len(errors)} errors')
          for error in errors:
              print(f'- {error}')
          if errors:
              raise SystemExit(1)
          PY

      - id: http
        name: Local HTTP 200 smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/patch12-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          python - <<'PY' 2>&1 | tee /tmp/patch12-http.log
          from urllib.request import urlopen
          import xml.etree.ElementTree as ET

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('sitemap.xml').getroot()
          paths = []
          for loc in root.findall('sm:url/sm:loc', ns):
              path = loc.text.removeprefix('https://silwadi.ae') or '/'
              paths.append(path)
          paths += ['/robots.txt', '/sitemap.xml', '/app.js', '/styles.css', '/favicon.svg']
          if len(paths) != 29:
              raise SystemExit(f'expected 29 smoke resources, got {len(paths)}')
          failures = []
          for path in paths:
              try:
                  with urlopen(f'http://127.0.0.1:8765{path}', timeout=5) as response:
                      code = response.status
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
                  continue
              if code != 200:
                  failures.append(f'{path}: HTTP {code}')
          print(f'HTTP smoke: {len(paths) - len(failures)}/{len(paths)} returned 200')
          for failure in failures:
              print(f'- {failure}')
          if failures:
              raise SystemExit(1)
          PY

      - name: Record verification result and clean workflow
        if: always()
        shell: bash
        env:
          TESTS: ${{ steps.tests.outcome }}
          JS: ${{ steps.js.outcome }}
          SEO: ${{ steps.seo.outcome }}
          LINKS: ${{ steps.links.outcome }}
          JSONLD: ${{ steps.jsonld.outcome }}
          HTTP: ${{ steps.http.outcome }}
        run: |
          overall=PASS
          for outcome in "$TESTS" "$JS" "$SEO" "$LINKS" "$JSONLD" "$HTTP"; do
            if [ "$outcome" != "success" ]; then overall=FAIL; fi
          done
          test_count=$(sed -nE 's/^Ran ([0-9]+) tests.*/\1/p' /tmp/patch12-tests.log 2>/dev/null | tail -1)
          test_count=${test_count:-unknown}
          seo_summary=$(head -1 /tmp/patch12-seo-audit.log 2>/dev/null || true)
          link_summary=$(tail -1 /tmp/patch12-links.log 2>/dev/null || true)
          jsonld_summary=$(tail -1 /tmp/patch12-jsonld.log 2>/dev/null || true)
          http_summary=$(tail -1 /tmp/patch12-http.log 2>/dev/null || true)
          cat > docs/launch/PATCH12-QA-REPORT.md <<EOF
          # Patch 12 — Final SEO QA Report

          Verified: 2026-08-22
          Overall: ${overall}
          Branch: \`patch-12-final-seo-launch-clean\`

          ## Gate outcomes

          - Full regression suite: ${TESTS} — ${test_count} tests discovered.
          - JavaScript syntax: ${JS} — \`node --check app.js\`.
          - SEO launch audit: ${SEO} — ${seo_summary:-no summary}.
          - Internal links/assets: ${LINKS} — ${link_summary:-no summary}.
          - JSON-LD: ${JSONLD} — ${jsonld_summary:-no summary}.
          - Local HTTP smoke: ${HTTP} — ${http_summary:-no summary}.
          - Patch 12 RED proof was recorded before implementation.

          ## Launch package

          - Primary canonical origin: \`https://silwadi.ae\`.
          - 24 canonical URLs in \`sitemap.xml\`, each with significant-update \`lastmod\` of \`2026-08-22\`.
          - Stable 64×64 SVG favicon and explicit index/follow/max-image-preview policy across all canonical pages.
          - Legacy migration map: \`docs/launch/legacy-redirect-map.csv\`.
          - Operational handoff: \`docs/launch/SEO-LAUNCH-CHECKLIST.md\`.

          ## Deployment-only verification still required

          The repository cannot prove server-side redirects, DNS/TLS cutover, Google Search Console, Bing Webmaster Tools, Google Business Profile, or public production behavior before those systems are configured. Keep the legacy domain/SSL active for redirects and follow the launch checklist after deployment.

          ## Lighthouse

          Lighthouse was not run for Patch 12. No Lighthouse score is claimed.
          EOF
          rm -f .github/workflows/patch12-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/launch/PATCH12-QA-REPORT.md .github/workflows/patch12-verify.yml
          git commit -m "test: record Patch 12 verification ${overall}"
          git push origin HEAD:patch-12-final-seo-launch-clean
          if [ "$overall" != "PASS" ]; then exit 1; fi
