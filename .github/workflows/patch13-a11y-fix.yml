name: Patch 13 Accessibility Fix

on:
  push:
    branches:
      - patch-13-lighthouse-polish

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-13-lighthouse-polish
          fetch-depth: 0
      - name: Apply confirmed contrast and target-size fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '--muted:#637a82;': '--muted:#60777f;',
              '.legacy-seal strong{color:var(--teal);font-size:22px;letter-spacing:-.03em}.legacy-seal span{margin-top:2px;color:#758a91;font-size:8px;text-transform:uppercase;letter-spacing:.1em}': '.legacy-seal strong{color:var(--teal);font-size:22px;letter-spacing:-.03em}.legacy-seal span{margin-top:2px;color:#60777f;font-size:8px;text-transform:uppercase;letter-spacing:.1em}',
              '.care-shortcuts span{grid-row:1/3;color:#9aabb0;font-size:9px;font-weight:750}': '.care-shortcuts span{grid-row:1/3;color:#60777f;font-size:9px;font-weight:750}',
              '.care-shortcuts strong{color:var(--navy);font-size:12px;font-weight:750}.care-shortcuts em{margin-top:4px;color:#7a8d93;font-size:9px;font-style:normal}': '.care-shortcuts strong{color:var(--navy);font-size:12px;font-weight:750}.care-shortcuts em{margin-top:4px;color:#60777f;font-size:9px;font-style:normal}',
              '.treatment-path__index{color:#98a9ae;font-size:9px;font-weight:800}': '.treatment-path__index{color:#60777f;font-size:9px;font-weight:800}',
              '.location-status--muted{background:#e7edef;color:#61777e}': '.location-status--muted{background:#e7edef;color:#526a73}',
              '.footer-grid a,.footer-grid span{color:#687f87;font-size:10px}.footer-grid a:hover{color:var(--teal)}': '.footer-grid a,.footer-grid span{color:#60777f;font-size:10px}.footer-grid a{display:inline-flex;align-items:center;min-height:24px}.footer-grid a:hover{color:var(--teal)}',
              '.footer-bottom{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#85979c;font-size:9px}': '.footer-bottom{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#60777f;font-size:9px}',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one CSS match, found {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify accessibility regression tests
        shell: bash
        run: |
          python -m unittest \
            tests.test_patch13_lighthouse_polish.PatchThirteenLighthousePolish.test_light_surface_neutral_text_meets_wcag_aa \
            tests.test_patch13_lighthouse_polish.PatchThirteenLighthousePolish.test_footer_links_meet_minimum_target_size -v
      - name: Commit fix and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/patch13-a11y-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css .github/workflows/patch13-a11y-fix.yml
          git commit -m 'fix: improve Lighthouse accessibility contrast'
          git push origin HEAD:patch-13-lighthouse-polish
