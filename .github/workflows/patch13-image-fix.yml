name: Patch 13 Image Fix

on:
  push:
    branches:
      - patch-13-lighthouse-polish

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-13-lighthouse-polish
          fetch-depth: 0
      - name: Apply the confirmed implant portrait fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('treatments/dental-implants.html')
          text = path.read_text(encoding='utf-8')
          old = '<img src="../assets/doctors/dr-munir-silwadi.png" alt="Dr. Munir Silwadi">'
          new = '<img src="../assets/doctors/optimized/dr-munir-silwadi.webp" alt="Dr. Munir Silwadi" width="720" height="720" loading="lazy" decoding="async">'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy provider image tag, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify image regression tests
        shell: bash
        run: |
          python -m unittest \
            tests.test_patch13_lighthouse_polish.PatchThirteenLighthousePolish.test_html_never_renders_original_doctor_pngs \
            tests.test_patch13_lighthouse_polish.PatchThirteenLighthousePolish.test_implant_provider_uses_lazy_optimized_dimensioned_portrait -v
      - name: Commit fix and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/patch13-image-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add treatments/dental-implants.html .github/workflows/patch13-image-fix.yml
          git commit -m 'perf: optimize implant provider portrait'
          git push origin HEAD:patch-13-lighthouse-polish
