name: Patch 13 A11y Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose implant mobile contrast
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)
          timeout 120s npx --yes lighthouse@latest 'http://127.0.0.1:8765/treatments/dental-implants.html' \
            --output=json --output-path=/tmp/lighthouse.json \
            --chrome-path="$CHROME" \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --only-categories=accessibility --quiet
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/lighthouse.json','utf8'));
          for (const id of ['color-contrast','target-size']) {
            const a=d.audits[id];
            console.log(`PATCH13_DIAG ${id} score=${a?.score} mode=${a?.scoreDisplayMode}`);
            for (const item of a?.details?.items || []) {
              const n=item.node || item.tapTarget || {};
              console.log('PATCH13_DIAG_ITEM '+JSON.stringify({id,selector:n.selector,snippet:n.snippet,label:n.nodeLabel,explanation:n.explanation}));
            }
          }
          NODE
