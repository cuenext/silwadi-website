name: Patch 13 Full Verification

on:
  push:
    branches:
      - patch-13-lighthouse-polish

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-13-lighthouse-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test-only image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run full regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/tests.log

      - name: Run JS and SEO verification
        shell: bash
        run: |
          node --check app.js
          python tools/seo_launch_audit.py | tee /tmp/seo.log

      - name: Verify local references and JSON-LD
        shell: bash
        run: |
          python - <<'PY' | tee /tmp/static-checks.log
          from pathlib import Path
          from urllib.parse import urlsplit
          import json, re

          root = Path('.').resolve()
          html_files = sorted(root.rglob('*.html'))
          refs = 0
          broken = []
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              for attr, value in re.findall(r'\b(href|src)=["\']([^"\']+)["\']', text, re.I):
                  if value.startswith(('#', 'mailto:', 'tel:', 'data:', 'javascript:', 'http://', 'https://', '//')):
                      continue
                  clean = urlsplit(value).path
                  if not clean:
                      continue
                  refs += 1
                  target = (page.parent / clean).resolve()
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      broken.append(f'{page.relative_to(root)} -> {value}')
          if broken:
              print('\n'.join(broken))
              raise SystemExit(f'Broken local references: {len(broken)}')
          print(f'Internal references: {refs} local references, 0 broken')

          blocks = 0
          errors = []
          pattern = re.compile(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', re.I | re.S)
          for page in html_files:
              for raw in pattern.findall(page.read_text(encoding='utf-8')):
                  blocks += 1
                  try:
                      json.loads(raw)
                  except Exception as exc:
                      errors.append(f'{page.relative_to(root)}: {exc}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(f'JSON-LD errors: {len(errors)}')
          print(f'JSON-LD: {blocks} blocks, 0 errors')
          PY

      - name: Start local static site and run HTTP smoke
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/silwadi-http.log 2>&1 &
          echo $! > /tmp/silwadi-http.pid
          sleep 2
          python - <<'PY' | tee /tmp/http-smoke.log
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          tree = ET.parse('sitemap.xml')
          urls = []
          for loc in tree.findall('.//s:loc', ns):
              p = urlsplit(loc.text).path
              urls.append('/' if p == '/' else p)
          urls += ['/robots.txt', '/sitemap.xml', '/favicon.svg', '/styles.css', '/app.js']
          failures = []
          for path in urls:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765' + path, timeout=10) as response:
                      if response.status != 200:
                          failures.append((path, response.status))
              except Exception as exc:
                  failures.append((path, str(exc)))
          if failures:
              for item in failures:
                  print(item)
              raise SystemExit(f'HTTP smoke failures: {len(failures)}')
          print(f'HTTP smoke: {len(urls)}/{len(urls)} returned 200')
          PY

      - name: Confirm Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner' >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Run representative mobile and desktop Lighthouse matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lighthouse
          pages=(
            'home|/'
            'doctors|/doctors.html'
            'munir-profile|/doctors/dr-munir-silwadi.html'
            'treatments|/treatments.html'
            'implants|/treatments/dental-implants.html'
            'locations|/locations.html'
            'contact|/contact.html'
          )
          for item in "${pages[@]}"; do
            name="${item%%|*}"
            path="${item#*|}"
            url="http://127.0.0.1:8765${path}"
            npx --yes lighthouse@latest "$url" \
              --output=json --output-path="/tmp/lighthouse/${name}-mobile.json" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo --quiet
            npx --yes lighthouse@latest "$url" \
              --preset=desktop \
              --output=json --output-path="/tmp/lighthouse/${name}-desktop.json" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo --quiet
          done

      - name: Build Patch 13 QA report and release verdict
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from statistics import mean

          pages = [
              ('home', 'Home'),
              ('doctors', 'Doctors'),
              ('munir-profile', 'Dr. Munir profile'),
              ('treatments', 'Treatments'),
              ('implants', 'Dental Implants'),
              ('locations', 'Locations'),
              ('contact', 'Contact'),
          ]
          modes = ('mobile', 'desktop')
          src = Path('/tmp/lighthouse')
          rows = []
          category_values = {m: {k: [] for k in ('performance','accessibility','best-practices','seo')} for m in modes}
          known_failures = []
          all_failed_a11y = []

          def pct(v):
              return round((v or 0) * 100)

          def metric(audits, key):
              return audits.get(key, {}).get('displayValue') or '—'

          for slug, label in pages:
              for mode in modes:
                  data = json.loads((src / f'{slug}-{mode}.json').read_text())
                  cats, audits = data['categories'], data['audits']
                  scores = {k: pct(cats[k]['score']) for k in category_values[mode]}
                  for k, v in scores.items():
                      category_values[mode][k].append(v)
                  rows.append((label, mode.title(), scores['performance'], scores['accessibility'], scores['best-practices'], scores['seo'], metric(audits,'first-contentful-paint'), metric(audits,'largest-contentful-paint'), metric(audits,'total-blocking-time'), metric(audits,'cumulative-layout-shift')))
                  for audit_id in ('color-contrast', 'target-size'):
                      audit = audits.get(audit_id)
                      if audit and audit.get('scoreDisplayMode') != 'notApplicable' and audit.get('score') not in (1, None):
                          known_failures.append(f'{label} {mode}: {audit_id}')
                  for ref in cats['accessibility'].get('auditRefs', []):
                      audit = audits.get(ref['id'], {})
                      score = audit.get('score')
                      if isinstance(score, (int,float)) and score < 1 and audit.get('scoreDisplayMode') not in {'notApplicable','manual','informative'}:
                          all_failed_a11y.append((label, mode.title(), ref['id'], audit.get('title', ref['id'])))

          tests_text = Path('/tmp/tests.log').read_text(errors='replace')
          ran = re.search(r'Ran (\d+) tests?', tests_text)
          test_count = ran.group(1) if ran else 'unknown'
          seo = Path('/tmp/seo.log').read_text().strip().splitlines()[-1]
          static = Path('/tmp/static-checks.log').read_text().strip().splitlines()
          http = Path('/tmp/http-smoke.log').read_text().strip().splitlines()[-1]
          source_sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()

          mobile_perf = category_values['mobile']['performance']
          bp_all = category_values['mobile']['best-practices'] + category_values['desktop']['best-practices']
          seo_all = category_values['mobile']['seo'] + category_values['desktop']['seo']
          release_pass = min(mobile_perf) >= 95 and all(v == 100 for v in bp_all) and all(v == 100 for v in seo_all) and not known_failures

          lines = [
              '# Patch 13 — Lighthouse QA Report', '',
              f'Overall: **{"PASS" if release_pass else "FAIL"}**', '',
              'Run date: 2026-08-22',
              f'Source commit before verification self-commit: `{source_sha}`',
              'Environment: GitHub Actions Ubuntu runner, headless Chrome, Lighthouse CLI against the local static feature-branch build.', '',
              '## Repository verification', '',
              f'- Full regression suite: **{test_count} tests, PASS**',
              '- JavaScript syntax: **PASS** (`node --check app.js`)',
              f'- SEO launch audit: **{seo}**',
              f'- {static[0] if static else "Internal reference check: unavailable"}',
              f'- {static[1] if len(static) > 1 else "JSON-LD check: unavailable"}',
              f'- {http}', '',
              '## Lighthouse scores', '',
              '| Page | Mode | Performance | Accessibility | Best Practices | SEO | FCP | LCP | TBT | CLS |',
              '|---|---|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for row in rows:
              lines.append('| ' + ' | '.join(map(str, row)) + ' |')

          lines += ['', '## Average category scores', '']
          for mode in modes:
              vals = category_values[mode]
              lines.append(f"- **{mode.title()}** — Performance {mean(vals['performance']):.1f}, Accessibility {mean(vals['accessibility']):.1f}, Best Practices {mean(vals['best-practices']):.1f}, SEO {mean(vals['seo']):.1f}.")

          implant_mobile = next(r for r in rows if r[0] == 'Dental Implants' and r[1] == 'Mobile')
          lines += [
              '', '## Dental Implants before / after', '',
              '- Patch 12 baseline: **Performance 82**, **LCP 5.0 s** (three-run median performance 82; median LCP 4.95 s).',
              f'- Patch 13 run: **Performance {implant_mobile[2]}**, **LCP {implant_mobile[7]}**.', '',
              '## Confirmed accessibility regressions', '',
          ]
          if known_failures:
              lines.append('The confirmed Lighthouse regressions are still present:')
              lines += [f'- {item}' for item in known_failures]
          else:
              lines.append('- `color-contrast`: **no failures in the representative matrix**')
              lines.append('- `target-size`: **no failures in the representative matrix**')

          lines += ['', '## Remaining automated accessibility failures', '']
          if all_failed_a11y:
              seen = []
              for item in all_failed_a11y:
                  if item not in seen:
                      seen.append(item)
              for label, mode, audit_id, title in seen:
                  lines.append(f'- {label} — {mode}: `{audit_id}` — {title}')
          else:
              lines.append('No scored automated accessibility failures were reported in the representative matrix.')

          lines += [
              '', '## Release gate', '',
              f'- Minimum representative mobile Performance: **{min(mobile_perf)}** (target ≥95)',
              f'- Best Practices: **{"PASS" if all(v == 100 for v in bp_all) else "FAIL"}** (target 100)',
              f'- SEO: **{"PASS" if all(v == 100 for v in seo_all) else "FAIL"}** (target 100)',
              f'- Confirmed contrast/target-size regressions cleared: **{"PASS" if not known_failures else "FAIL"}**', '',
              '> These remain pre-launch lab measurements. The final launch-signoff Lighthouse run must be repeated against `https://silwadi.ae` after public deployment so hosting, TLS, caching and network delivery are included.', '',
          ]
          Path('docs/launch/PATCH13-LIGHTHOUSE-QA.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Save report and clean verification-only files
        if: always()
        shell: bash
        run: |
          if [ ! -f docs/launch/PATCH13-LIGHTHOUSE-QA.md ]; then
            cat > docs/launch/PATCH13-LIGHTHOUSE-QA.md <<'EOF'
          # Patch 13 — Lighthouse QA Report

          Overall: **FAIL**

          The full Patch 13 verification workflow did not complete far enough to generate Lighthouse release-gate results. No merge is permitted from this report.
          EOF
          fi
          rm -f .github/workflows/patch13-verify.yml
          rm -f docs/.patch13-red-confirmed docs/.patch13-a11y-red-confirmed
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record Patch 13 Lighthouse QA'
          git push origin HEAD:patch-13-lighthouse-polish

      - name: Enforce release verdict
        shell: bash
        run: grep -q 'Overall: \*\*PASS\*\*' docs/launch/PATCH13-LIGHTHOUSE-QA.md
