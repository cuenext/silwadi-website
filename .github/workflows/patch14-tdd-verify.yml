name: Patch 14 TDD Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-14-official-service-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine patient-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('index.html', 'Verified dental services at Silwadi.', 'Dental services at Silwadi.')
          replace(
              'treatments.html',
              '<meta property="og:description" content="Explore dental care at Silwadi Dental Center in Abu Dhabi, including implants, orthodontics, restorative dentistry, endodontics, periodontics and preventive care.">',
              '<meta property="og:description" content="Explore Silwadi Dental Center services in Abu Dhabi, including implantology, orthodontics, periodontics, pedodontics, endodontics, cosmetic care and prosthodontics.">'
          )
          replace(
              'treatments.html',
              'Explore the dental service areas published by Silwadi Dental Center, or contact us if you are not sure where to start.',
              'Explore Silwadi Dental Center’s dental service areas, or contact us if you are not sure where to start.'
          )
          replace(
              'treatments.html',
              'General and specialist dental care across the service lines published by Silwadi Dental Center.',
              'General and specialist dental care across ten established service areas.'
          )
          replace(
              'about.html',
              'The official Silwadi philosophy puts patient comfort, individual needs and understandable treatment planning at the centre of care.',
              'Patient comfort, individual needs and understandable treatment planning are central to the way the centre approaches care.'
          )
          replace(
              'about.html',
              'Patient education and open communication are part of the centre’s stated approach, with procedures and options explained before treatment decisions are made.',
              'Patient education and open communication are part of care, with procedures and options explained before treatment decisions are made.'
          )
          replace(
              'about.html',
              'The centre’s stated values emphasise patient comfort, education and treatment plans tailored to individual needs.',
              'Patient comfort, education and treatment plans tailored to individual needs guide the way care is delivered.'
          )
          replace(
              'about.html',
              'A compassionate setting and patient comfort are central to the way the official Silwadi site describes care.',
              'A compassionate setting and patient comfort are priorities throughout the visit.'
          )
          PY
      - name: Install test-only dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check app.js
      - name: SEO launch audit
        run: python tools/seo_launch_audit.py
      - name: Internal references and JSON-LD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import json, re
          root = Path('.').resolve(); refs = 0; broken = []; blocks = 0
          pattern = re.compile(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', re.I|re.S)
          for page in sorted(root.rglob('*.html')):
              text = page.read_text(encoding='utf-8')
              for _, value in re.findall(r'\b(href|src)=["\']([^"\']+)["\']', text, re.I):
                  if value.startswith(('#','mailto:','tel:','data:','javascript:','http://','https://','//')): continue
                  clean = urlsplit(value).path
                  if not clean: continue
                  refs += 1
                  target = (page.parent / clean).resolve()
                  if clean.endswith('/'): target /= 'index.html'
                  if not target.exists(): broken.append(f'{page.relative_to(root)} -> {value}')
              for raw in pattern.findall(text): blocks += 1; json.loads(raw)
          if broken: print('\n'.join(broken)); raise SystemExit(1)
          print(f'Internal references: {refs} local references, 0 broken')
          print(f'JSON-LD: {blocks} blocks, 0 errors')
          PY
      - name: HTTP smoke
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          tree=ET.parse('sitemap.xml'); urls=[]
          for loc in tree.findall('.//s:loc',ns):
              path=urlsplit(loc.text).path; urls.append('/' if path=='/' else path)
          urls += ['/robots.txt','/sitemap.xml','/favicon.svg','/styles.css','/app.js']
          for path in urls:
              with urllib.request.urlopen('http://127.0.0.1:8765'+path, timeout=10) as response:
                  if response.status != 200: raise SystemExit(f'{path}: {response.status}')
          print(f'HTTP smoke: {len(urls)}/{len(urls)} returned 200')
          PY
      - name: Commit refined verified content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html treatments.html about.html
          git diff --cached --quiet && exit 0
          git commit -m "refine: keep official content patient-facing [skip ci]"
          git push origin HEAD:patch-14-official-service-alignment
