name: Patch 14 TDD Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Run Patch 14 contract
        run: python -m unittest tests.test_patch14_official_content_alignment -v
