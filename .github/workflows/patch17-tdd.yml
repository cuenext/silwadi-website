name: Patch 17 Verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-17-home-rollback-reviews
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch 17 contract
        run: python -m unittest tests.test_patch17_home_rollback_reviews -v
