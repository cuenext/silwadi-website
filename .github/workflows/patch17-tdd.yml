name: Patch 17 Verification
on:
  push:
    branches:
      - patch-17-home-rollback-reviews
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-17-home-rollback-reviews
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply rollback candidate
        run: python tools/patch17_apply.py
      - name: Commit rollback candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-reviews.css
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore trusted homepage with reviews [skip ci]"
            git push origin HEAD:patch-17-home-rollback-reviews
          fi
      - name: Patch 17 contract
        run: python -m unittest tests.test_patch17_home_rollback_reviews -v
