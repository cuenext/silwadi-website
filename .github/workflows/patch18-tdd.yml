name: Patch 18 TDD
on:
  push:
    branches:
      - patch-18-services-about-imagery
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch 18 contract
        run: python -m unittest tests.test_patch18_services_about_imagery -v
