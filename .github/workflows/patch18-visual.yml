name: Patch 18 Visual Verification
on:
  push:
    branches:
      - patch-18-services-about-imagery
permissions:
  contents: read
jobs:
  lighthouse-seo-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-18-services-about-imagery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Services SEO diagnostic
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 160s npx --yes lighthouse@latest "http://127.0.0.1:8765/services.html" \
            --quiet --chrome-path="$CHROME" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=seo \
            --output=json --output-path=/tmp/lighthouse.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lighthouse.json')); c=r['categories']['seo']; a=r['audits']
          print('SEO', round(c['score']*100))
          for ref in c.get('auditRefs',[]):
              audit=a.get(ref['id'],{})
              score=audit.get('score')
              if score is not None and score < 1:
                  print('FAIL', ref['id'], 'score=', score, 'title=', audit.get('title'), 'display=', audit.get('displayValue'))
                  details=audit.get('details') or {}
                  items=details.get('items') or []
                  if isinstance(items,list):
                      for item in items[:12]: print(' ITEM', item)
          PY
