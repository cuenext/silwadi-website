name: Patch 18 Visual Verification
on:
  push:
    branches:
      - patch-18-services-about-imagery
permissions:
  contents: read
jobs:
  lighthouse-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        page: [services.html]
        mode: [mobile, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-18-services-about-imagery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Lighthouse diagnostic
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          EXTRA=""
          if [ "${{ matrix.mode }}" = "desktop" ]; then EXTRA="--preset=desktop"; fi
          timeout 160s npx --yes lighthouse@latest "http://127.0.0.1:8765/${{ matrix.page }}" \
            --quiet --chrome-path="$CHROME" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=/tmp/lighthouse.json $EXTRA
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lighthouse.json')); c=r['categories']; a=r['audits']
          print('CATEGORIES', {k: round(v['score']*100) for k,v in c.items()})
          for category in c.values():
              for ref in category.get('auditRefs',[]):
                  audit=a.get(ref['id'],{})
                  score=audit.get('score')
                  if score is not None and score < 1:
                      print('FAIL', ref['id'], 'score=', score, 'title=', audit.get('title'), 'display=', audit.get('displayValue'))
                      details=audit.get('details') or {}
                      for item in (details.get('items') or [])[:8]:
                          print(' ITEM', item)
          PY
