name: Patch 19 TDD
on:
  push:
    branches:
      - patch-19-whatsapp-services-nav
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-19-whatsapp-services-nav
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply Patch 19
        run: |
          python tools/patch19_apply.py
          python tools/patch19_fix_mobile.py
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: apply Patch 19 WhatsApp and services UX [skip ci]"
            git push origin HEAD:patch-19-whatsapp-services-nav
          fi
      - name: Patch 19 contract
        run: python -m unittest tests.test_patch19_whatsapp_services_nav -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check app.js
      - name: SEO audit
        run: python tools/seo_launch_audit.py
