name: Patch 19 Final Verification
on:
  push:
    branches:
      - patch-19-whatsapp-services-nav
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-19-whatsapp-services-nav
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Patch 19 contract
        run: python -m unittest tests.test_patch19_whatsapp_services_nav -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check app.js
      - name: SEO audit
        run: python tools/seo_launch_audit.py
