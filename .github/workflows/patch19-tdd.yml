name: Patch 19 TDD
on:
  push:
    branches:
      - patch-19-whatsapp-services-nav
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-19-whatsapp-services-nav
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch 19 contract
        run: python -m unittest tests.test_patch19_whatsapp_services_nav -v
