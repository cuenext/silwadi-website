name: Patch 21 Accessibility Diagnostic
on:
  push:
    branches:
      - patch-21-reviews-footer-social
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-21-reviews-footer-social
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Print failed accessibility audits
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npx --yes lighthouse@latest http://127.0.0.1:8765/index.html --quiet \
            --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=accessibility --output=json --output-path=/tmp/lh.json --preset=desktop
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lh.json'))
          print('ACCESSIBILITY', round(r['categories']['accessibility']['score']*100))
          for ref in r['categories']['accessibility']['auditRefs']:
              audit=r['audits'][ref['id']]
              if audit.get('score') == 0:
                  print('\nFAIL', ref['id'], '-', audit.get('title'))
                  print(audit.get('description'))
                  details=audit.get('details') or {}
                  for item in (details.get('items') or [])[:20]:
                      print(item)
          PY
