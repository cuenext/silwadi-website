name: Patch 21 TDD
on:
  push:
    branches:
      - patch-21-reviews-footer-socials
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-21-reviews-footer-socials
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply Patch 21
        run: python tools/patch21_apply.py
      - name: Patch 21 contract
        run: python -m unittest tests.test_patch21_reviews_footer_socials -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check app.js
      - name: SEO audit
        run: python tools/seo_launch_audit.py
      - name: Commit verified candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: refine reviews footer hours and socials [skip ci]"
            git push origin HEAD:patch-21-reviews-footer-socials
          fi
