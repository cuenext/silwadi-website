name: Patch 21 Visual Verification
on:
  push:
    branches:
      - patch-21-reviews-footer-socials
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-21-reviews-footer-socials
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright core
        run: npm install --no-save playwright-core
      - name: Start site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Capture review and footer states
        shell: bash
        run: |
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/patch21-shots
          node <<'JS'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const desktop=await browser.newPage({viewport:{width:1440,height:900}});
            await desktop.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle'});
            const reviews=desktop.locator('#reviews'); await reviews.scrollIntoViewIfNeeded(); await desktop.waitForTimeout(100);
            await reviews.screenshot({path:'/tmp/patch21-shots/reviews-desktop.png'});
            await desktop.locator('[data-review-expand]').first().click(); await desktop.waitForTimeout(100);
            await desktop.screenshot({path:'/tmp/patch21-shots/review-modal-desktop.png'});
            await desktop.locator('[data-review-close]').click();
            const footer=desktop.locator('.site-footer'); await footer.scrollIntoViewIfNeeded();
            await footer.screenshot({path:'/tmp/patch21-shots/footer-desktop.png'});
            await desktop.close();

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,deviceScaleFactor:1});
            await mobile.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle'});
            const mobileReviews=mobile.locator('#reviews'); await mobileReviews.scrollIntoViewIfNeeded();
            await mobile.locator('[data-review-expand]').first().click(); await mobile.waitForTimeout(100);
            await mobile.screenshot({path:'/tmp/patch21-shots/review-modal-mobile.png'});
            await mobile.locator('[data-review-close]').click();
            const mobileFooter=mobile.locator('.site-footer'); await mobileFooter.scrollIntoViewIfNeeded();
            await mobileFooter.screenshot({path:'/tmp/patch21-shots/footer-mobile.png'});
            await mobile.close(); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: patch21-visuals
          path: /tmp/patch21-shots/*.png

  lighthouse:
    strategy:
      fail-fast: false
      matrix:
        mode: [mobile, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-21-reviews-footer-socials
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Lighthouse home
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          EXTRA=""
          if [ "${{ matrix.mode }}" = "desktop" ]; then EXTRA="--preset=desktop"; fi
          timeout 160s npx --yes lighthouse@latest http://127.0.0.1:8765/index.html --quiet --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/lh.json $EXTRA
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/lh.json')); c=r['categories']
          vals={k:round(c[k]['score']*100) for k in ['performance','accessibility','best-practices','seo']}
          print(vals)
          if vals['performance'] < 90 or vals['accessibility'] != 100 or vals['best-practices'] != 100 or vals['seo'] != 100:
              raise SystemExit('Lighthouse gate failed')
          PY
