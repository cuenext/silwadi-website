name: Pediatric carousel proportion patch

on:
  push:
    branches:
      - pediatric-carousel-review-0914
    paths:
      - '.github/workflows/pediatric-carousel-proportion-patch.yml'

permissions:
  contents: write

jobs:
  patch-private-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pediatric-carousel-review-0914
      - name: Apply private carousel proportion adjustment
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('review/pediatric-dentistry-v1.html')
          text = page.read_text(encoding='utf-8')
          old_desktop = '--pd-slide-width:min(78vw,960px)'
          new_desktop = '--pd-slide-width:min(82vw,1120px)'
          old_mobile = ':root{--pd-slide-width:84vw}'
          new_mobile = ':root{--pd-slide-width:86vw}'
          if old_desktop not in text or old_mobile not in text:
              raise SystemExit('Expected carousel proportion markers were not found')
          text = text.replace(old_desktop, new_desktop, 1).replace(old_mobile, new_mobile, 1)
          page.write_text(text, encoding='utf-8')
          PY
          python -m unittest tests.test_private_pediatric_gallery -v
      - name: Commit private review adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/pediatric-dentistry-v1.html
          git commit -m 'fix: make pediatric carousel center slide dominant'
          git push origin HEAD:pediatric-carousel-review-0914
