name: One-time pediatric infinite carousel red check

on:
  push:
    branches:
      - pediatric-review-infinite-0914
    paths:
      - .github/workflows/pediatric-infinite-red.yml

jobs:
  red-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pediatric-review-infinite-0914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pediatric gallery contract
        run: python -m unittest tests.test_private_pediatric_gallery -v
