name: Apply POD hero gallery refresh

on:
  push:
    branches:
      - pod-hero-gallery-refresh
    paths:
      - .github/workflows/pod-hero-gallery-refresh.yml
      - scripts/apply_pod_hero_gallery_refresh.py
      - tests/test_people_of_determination_gallery.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pod-hero-gallery-refresh

      - name: Verify contract is red before implementation
        shell: bash
        run: |
          set +e
          python tests/test_people_of_determination_gallery.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the updated gallery contract to fail before implementation."
            exit 1
          fi

      - name: Apply POD hero and seven-image gallery refresh
        run: python scripts/apply_pod_hero_gallery_refresh.py

      - name: Verify refreshed POD gallery
        run: python tests/test_people_of_determination_gallery.py

      - name: Commit verified review-page refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/people-of-determination-raha-v1.html
          git commit -m "feat: integrate POD gallery into hero"
          git push origin HEAD:pod-hero-gallery-refresh
