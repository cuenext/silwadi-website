name: POD remove reception image RED check
on:
  push:
    branches: [pod-remove-reception-image]
jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm new contract fails before implementation
        run: |
          if python -m unittest tests.test_private_pod_review.PrivatePodReviewTests.test_complex_needs_section_is_text_only_and_uses_full_width -v; then
            echo "Expected RED test to fail before implementation, but it passed."
            exit 1
          fi
