name: Private AI dental FAQ review test

on:
  push:
    branches:
      - main
      - feature/silwadi-ai-review-v1
    paths:
      - 'review/dental-faq-ai-v1.html'
      - 'review/dental-faq-ai-v1.js'
      - 'ai/clinic-knowledge-v1.json'
      - 'ai/dental-guidance-v1.json'
      - 'worker/silwadi-ai-worker.js'
      - 'worker/README.md'
      - 'tests/test_private_ai_faq_review.py'
      - 'tests/test_ai_knowledge_v1.py'
      - 'tests/test_ai_worker_contract.py'
      - '.github/workflows/private-ai-faq-review-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify private AI FAQ review page contract
        run: python -m unittest tests.test_private_ai_faq_review -v
      - name: Verify AI knowledge contract
        if: always()
        run: python -m unittest tests.test_ai_knowledge_v1 -v
      - name: Verify AI Worker contract
        if: always()
        run: python -m unittest tests.test_ai_worker_contract -v
      - name: Syntax-check AI review JavaScript
        if: always()
        run: |
          node --check review/dental-faq-ai-v1.js
          node --check worker/silwadi-ai-worker.js
