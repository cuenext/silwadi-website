name: Private POD Raha review test

on:
  push:
    branches: [main]
    paths:
      - 'review/people-of-determination-raha-v1.html'
      - 'tests/test_private_pod_raha_review.py'
      - '.github/workflows/private-pod-raha-review-test.yml'
  workflow_dispatch:

# Verifies the final Al Raha private-review contract.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_private_pod_raha_review.py
