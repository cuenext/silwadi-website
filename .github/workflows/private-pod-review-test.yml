name: Private POD review test

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_private_pod_review.py'
      - 'review/people-of-determination-raha-v1.html'
      - '.github/workflows/private-pod-review-test.yml'

# Verifies the final private POD review contract.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify private POD review contract
        run: python -m unittest tests.test_private_pod_review
