name: Public core SEO test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ar/**/*.html'
      - 'locations/*.html'
      - 'scripts/apply_google_authority.py'
      - 'tests/test_branch_geo.py'
      - 'doctors.html'
      - 'about.html'
      - 'locations.html'
      - 'contact.html'
      - 'treatments.html'
      - 'treatments/dental-implants.html'
      - 'treatments/orthodontics.html'
      - 'treatments/cosmetic-dentistry.html'
      - 'treatments/general-dentistry.html'
      - 'treatments/emergency-dentist.html'
      - 'sitemap.xml'
      - 'tests/test_public_core_seo.py'
      - '.github/workflows/public-core-seo-test.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ar/**/*.html'
      - 'locations/*.html'
      - 'scripts/apply_google_authority.py'
      - 'tests/test_branch_geo.py'
      - 'doctors.html'
      - 'about.html'
      - 'locations.html'
      - 'contact.html'
      - 'treatments.html'
      - 'treatments/**.html'
      - 'sitemap.xml'
      - 'tests/test_public_core_seo.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_public_core_seo tests.test_branch_geo -v
