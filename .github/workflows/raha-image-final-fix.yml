name: Final Al Raha image fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raha-image-final-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified WebP from staged payload
        run: |
          base64 -d assets/locations/al-raha-accessible-treatment-room-final.webp.b64 > assets/locations/al-raha-accessible-treatment-room-final.webp
          echo '70fdd6df40ec90ec9b3cff73b301e0aa2a2fcf3e1801e3e5d3480d7f845deb0c  assets/locations/al-raha-accessible-treatment-room-final.webp' | sha256sum -c -
          test "$(stat -c%s assets/locations/al-raha-accessible-treatment-room-final.webp)" -eq 11414

      - name: Verify clean WebP decodes fully
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp >/dev/null
          dwebp assets/locations/al-raha-accessible-treatment-room-final.webp -o /tmp/raha-final.png
          test -s /tmp/raha-final.png
          file assets/locations/al-raha-accessible-treatment-room-final.webp

      - name: Switch Al Raha image references
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'al-raha-accessible-treatment-room.webp?v=20260906-raha-accessible-1'
          new = 'al-raha-accessible-treatment-room-final.webp?v=20260906-raha-final-1'
          for fn in ('locations.html', 'ar/locations.html'):
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              assert old in s, f'{old} not found in {fn}'
              s = s.replace(old, new, 1)
              assert new in s
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit fix and remove temporary files
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add locations.html ar/locations.html assets/locations/al-raha-accessible-treatment-room-final.webp
          git rm assets/locations/al-raha-accessible-treatment-room-final.webp.b64 .github/workflows/raha-image-final-fix.yml
          git commit -m 'fix: replace corrupted Al Raha room image with verified asset [skip arabic build]'
          git push
