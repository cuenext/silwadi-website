name: Repair Dr Lana portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lana-image.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Dr Lana portrait
        shell: bash
        run: |
          set -euo pipefail

          cat .tmp/lana-upload/part*.txt | tr -d '\r\n' | base64 -d > assets/dr-lana-new-v2.webp

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import runpy

          p = Path('assets/dr-lana-new-v2.webp')
          data = p.read_bytes()
          expected_sha = '207cc004e088fba848a26d826d9cf4d27b66752b7dfd0e2153b9b15401fccc95'

          assert len(data) == 77852, f'wrong size: {len(data)}'
          assert hashlib.sha256(data).hexdigest() == expected_sha, hashlib.sha256(data).hexdigest()
          assert data[:4] == b'RIFF'
          assert data[8:12] == b'WEBP'
          assert int.from_bytes(data[4:8], 'little') + 8 == len(data)

          ns = runpy.run_path('tests/test_lana_image_integrity.py')
          ns['test_lana_portrait_webp_is_complete_and_not_truncated']()
          print('Lana portrait OK:', len(data), expected_sha)
          PY

          file assets/dr-lana-new-v2.webp
          git diff --check

      - name: Commit repaired image and cleanup
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp/lana-upload
          rm -f .github/workflows/repair-lana-image.yml

          git config user.name 'Silwadi Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add assets/dr-lana-new-v2.webp tests/test_lana_image_integrity.py
          git add -u .tmp/lana-upload
          git add -u .github/workflows/repair-lana-image.yml
          git diff --cached --stat
          git commit -m 'fix: restore complete Dr. Lana portrait asset [skip arabic build]'
          git push
