name: Repair taxonomy migration selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-service-taxonomy-runner.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct selector in migration workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/verify-service-taxonomy.yml')
          text = p.read_text(encoding='utf-8')
          old = 'combined = re.compile(r\'<article class="service-card reveal" id="prosthodontics">.*?</article>\', re.S)'
          new = 'combined = re.compile(r\'<article class="service-card reveal" id="prosthodontics-implantology">.*?</article>\', re.S)'
          if text.count(old) != 1:
              raise SystemExit(f'Expected selector exactly once, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit selector repair and remove helper
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git rm .github/workflows/repair-service-taxonomy-runner.yml
          git add .github/workflows/verify-service-taxonomy.yml
          git commit -m "fix: correct taxonomy migration selector"
          git push
