name: Review treatment polish test

on:
  push:
    branches:
      - review-treatment-polish-20260916

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run treatment review polish contract
        run: python -m pytest tests/test_treatment_refresh_polish.py -q
