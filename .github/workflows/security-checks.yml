name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate public bundle and workflow permissions
        run: python -m unittest discover -s tests -p test_security_publication.py -v
      - name: Validate bundle builder
        run: python -m unittest discover -s tests -p test_public_bundle.py -v
      - name: Validate booking browser scripts
        run: |
          node --check app.js
          node --check booking-modal.js
          node --check language.js
      - name: Validate booking server input rules
        run: php tests/server/test-booking-validation.php
      - name: Validate current doctor profile content and Arabic qualifications
        run: python -m unittest tests.test_doctor_profile_refresh -v
