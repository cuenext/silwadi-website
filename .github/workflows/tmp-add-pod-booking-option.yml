name: Temporary add POD booking option

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-add-pod-booking-option.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - confirm POD booking option is missing
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          contact = Path('contact.html').read_text(encoding='utf-8')
          modal = Path('booking-modal.js').read_text(encoding='utf-8')
          assert 'People of Determination Dental Care' in contact
          assert 'People of Determination Dental Care' in modal
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'POD option already exists; aborting.'
            exit 1
          fi
          echo 'RED confirmed: POD option is missing from booking treatment choices.'

      - name: Add POD option everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          english_label = 'People of Determination Dental Care'
          arabic_label = 'رعاية أسنان لأصحاب الهمم'

          # Embedded English contact form
          path = Path('contact.html')
          html = path.read_text(encoding='utf-8')
          old = '<option>Paediatric Dentistry</option><option>Other / Not sure</option>'
          new = f'<option>Paediatric Dentistry</option><option>{english_label}</option><option>Other / Not sure</option>'
          if html.count(old) != 1:
              raise SystemExit(f'Expected one English treatment option insertion point, found {html.count(old)}')
          path.write_text(html.replace(old, new, 1), encoding='utf-8')

          # Bilingual booking modal
          path = Path('booking-modal.js')
          js = path.read_text(encoding='utf-8')
          old_en = "      ['Paediatric Dentistry', 'Paediatric Dentistry'],\n      ['Other / Not sure', 'Other / Not sure'],"
          new_en = "      ['Paediatric Dentistry', 'Paediatric Dentistry'],\n      ['People of Determination Dental Care', 'People of Determination Dental Care'],\n      ['Other / Not sure', 'Other / Not sure'],"
          old_ar = "      ['Paediatric Dentistry', 'طب أسنان الأطفال'],\n      ['Other / Not sure', 'أخرى / لست متأكداً'],"
          new_ar = "      ['Paediatric Dentistry', 'طب أسنان الأطفال'],\n      ['People of Determination Dental Care', 'رعاية أسنان لأصحاب الهمم'],\n      ['Other / Not sure', 'أخرى / لست متأكداً'],"
          for old, new, label in [(old_en,new_en,'EN modal'), (old_ar,new_ar,'AR modal')]:
              if js.count(old) != 1:
                  raise SystemExit(f'Expected one {label} insertion point, found {js.count(old)}')
              js = js.replace(old, new, 1)
          path.write_text(js, encoding='utf-8')

          # Static Arabic fallback form currently published
          path = Path('ar/contact.html')
          ar = path.read_text(encoding='utf-8')
          old = '<option>طب أسنان الأطفال</option><option>أخرى / لست متأكداً</option>'
          new = f'<option>طب أسنان الأطفال</option><option>{arabic_label}</option><option>أخرى / لست متأكداً</option>'
          if ar.count(old) != 1:
              raise SystemExit(f'Expected one Arabic treatment option insertion point, found {ar.count(old)}')
          path.write_text(ar.replace(old, new, 1), encoding='utf-8')

          # Keep Arabic rebuild source aware of this new phrase.
          path = Path('data/arabic-quality-overrides-extra.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data[english_label] = arabic_label
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Permanent regression coverage
          path = Path('tests/test_booking_modal.py')
          tests = path.read_text(encoding='utf-8')
          marker = '    def test_modal_has_global_mobile_accessible_styling(self):\n'
          test_block = '''    def test_people_of_determination_is_available_in_all_booking_treatment_lists(self):\n        contact = (ROOT / "contact.html").read_text(encoding="utf-8")\n        arabic_contact = (ROOT / "ar" / "contact.html").read_text(encoding="utf-8")\n        modal = (ROOT / "booking-modal.js").read_text(encoding="utf-8")\n\n        self.assertIn("People of Determination Dental Care", contact)\n        self.assertIn("People of Determination Dental Care", modal)\n        self.assertIn("رعاية أسنان لأصحاب الهمم", modal)\n        self.assertIn("رعاية أسنان لأصحاب الهمم", arabic_contact)\n\n'''
          if 'test_people_of_determination_is_available_in_all_booking_treatment_lists' not in tests:
              if marker not in tests:
                  raise SystemExit('Could not find test insertion marker')
              tests = tests.replace(marker, test_block + marker, 1)
              path.write_text(tests, encoding='utf-8')
          PY

      - name: GREEN - verify booking regression
        run: |
          python -m unittest tests.test_booking_modal -v
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add contact.html ar/contact.html booking-modal.js data/arabic-quality-overrides-extra.json tests/test_booking_modal.py
          git commit -m 'fix: add People of Determination to booking options'
          git push
