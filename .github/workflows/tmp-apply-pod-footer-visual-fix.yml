name: Temporary apply POD and footer visual fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-pod-footer-visual-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply visual fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* Patch 25: POD mobile dividers + footer logo matte */'
          override = '''\n\n/* Patch 25: POD mobile dividers + footer logo matte */\n/* Use the existing official Silwadi logo cleanly on the pale footer surface. */\n.site-footer-logo{mix-blend-mode:multiply}\n@media(max-width:700px){\n  .pod-review .pod-care-grid{border:0!important}\n  .pod-review .pod-care-item,\n  .pod-review .pod-care-item:nth-child(3),\n  .pod-review .pod-care-item:nth-child(4){border:0!important;border-bottom:1px solid var(--pod-line)!important}\n  .pod-review .pod-care-item:last-child{border-bottom:0!important}\n}\n'''
          if marker not in css:
              css += override
          path.write_text(css, encoding='utf-8')
          PY

      - name: Verify POD and footer contract
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          assert '.site-footer-logo{mix-blend-mode:multiply}' in css
          assert '.pod-review .pod-care-grid{border:0!important}' in css
          assert '.pod-review .pod-care-item:last-child{border-bottom:0!important}' in css
          PY
          python -m unittest tests.test_private_pod_review
          python -m unittest tests/test_private_pod_raha_review.py
          python -m unittest tests/test_people_of_determination_gallery.py

      - name: Verify site footer contacts
        run: |
          python3 <<'PY'
          from pathlib import Path
          failures=[]; count=0
          for path in Path('.').rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              if '<footer class="site-footer">' not in text:
                  continue
              count += 1
              footer=text.split('<footer class="site-footer">',1)[1].split('</footer>',1)[0]
              is_ar='/ar/' in f'/{path.as_posix()}' or 'lang="ar"' in text[:500]
              required=['+971 2 626 2042','+971 2 666 2408','tel:+97126662408','Al Raha Mall' if not is_ar else 'الراحة مول']
              missing=[x for x in required if x not in footer]
              if missing: failures.append(f'{path}: missing {missing}')
          assert count, 'No site footers found'
          assert not failures, '\n'.join(failures)
          print(f'Validated {count} footers')
          PY

      - name: Commit directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-apply-pod-footer-visual-fix.yml
          git add styles.css
          git commit -m 'Fix POD mobile outline and footer logo background'
          git push origin HEAD:main
