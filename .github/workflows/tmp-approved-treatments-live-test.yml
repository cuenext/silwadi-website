name: Temporary approved treatment publish test

on:
  push:
    branches: [publish-approved-treatments-20260916]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run approved treatment publication regressions
        run: |
          python -m unittest \
            tests.test_approved_treatments_live \
            tests.test_booking_modal \
            tests.test_pediatric_booking_modal \
            tests.test_people_of_determination_gallery \
            tests.test_private_pod_raha_review \
            tests.test_private_pediatric_review \
            tests.test_private_endodontics_review -v
      - name: Check whitespace and patch validity
        run: git diff --check origin/main...HEAD
