name: Temporary approved treatment publish test

on:
  push:
    branches: [publish-approved-treatments-20260916]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run approved treatment publish contract
        run: python -m unittest tests.test_approved_treatments_live -v
      - name: Run booking regression
        run: python -m unittest tests.test_booking_modal -v
      - name: Run site contract regression
        run: python tests/site_contract_test.py
      - name: Run complete unit regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check whitespace and patch validity
        run: git diff --check origin/main...HEAD
