name: Temporary correct POD mobile selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-correct-pod-mobile-selector.yml'

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Correct POD selectors to match real markup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          replacements = {
              '.pod-review .pod-care-grid{border:0!important}': '.pod-care-grid{border:0!important}',
              '.pod-review .pod-care-item,': '.pod-care-item,',
              '.pod-review .pod-care-item:nth-child(3),': '.pod-care-item:nth-child(3),',
              '.pod-review .pod-care-item:nth-child(4){border:0!important;border-bottom:1px solid var(--pod-line)!important}': '.pod-care-item:nth-child(4){border:0!important;border-bottom:1px solid var(--pod-line)!important}',
              '.pod-review .pod-care-item:last-child{border-bottom:0!important}': '.pod-care-item:last-child{border-bottom:0!important}',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Missing expected selector: {old}')
              css = css.replace(old, new, 1)
          path.write_text(css, encoding='utf-8')
          PY

      - name: Verify selector contract against actual POD markup
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          html = Path('review/people-of-determination-raha-v1.html').read_text(encoding='utf-8')
          assert 'class="pod-care-grid"' in html
          assert 'class="pod-review' not in html
          assert '.pod-care-grid{border:0!important}' in css
          assert '.pod-care-item:last-child{border-bottom:0!important}' in css
          assert '.pod-review .pod-care-grid' not in css
          assert '.site-footer-logo{mix-blend-mode:multiply}' in css
          print('Selectors now match the real POD DOM and footer matte fix remains present.')
          PY

      - name: Run POD regressions
        run: |
          python -m unittest tests.test_private_pod_review
          python -m unittest tests/test_private_pod_raha_review.py
          python -m unittest tests/test_people_of_determination_gallery.py

      - name: Commit corrected production CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-correct-pod-mobile-selector.yml
          git add styles.css
          git commit -m 'Correct POD mobile divider selectors'
          git pull --rebase origin main
          git push origin HEAD:main
