name: Temporary polish Endodontics V4 mobile and SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-endodontics-v4-seo-mobile.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify final review-page polish
        run: python3 .tmp/endodontics-polish.py
      - name: Commit polished review page
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add review/endodontics-v4.html
          git commit -m "feat: polish Endodontics review mobile portraits and SEO"
          git push
