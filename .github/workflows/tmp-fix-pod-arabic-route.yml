          ar = ar.replace('aria-label="Accessible dental treatment room photo gallery"', 'aria-label="معرض صور غرفة علاج الأسنان الميسّرة"')
          ar = ar.replace('aria-label="Accessible dental treatment room photos"', 'aria-label="صور غرفة علاج الأسنان الميسّرة"')
          ar = ar.replace('aria-label="Previous clinic photo"', 'aria-label="الصورة السابقة للعيادة"')
          ar = ar.replace('aria-label="Next clinic photo"', 'aria-label="الصورة التالية للعيادة"')
          ar = ar.replace('aria-label="Information you can share before your appointment"', 'aria-label="معلومات يمكنك مشاركتها قبل الموعد"')
          ar = ar.replace('aria-label="Official partnership logos"', 'aria-label="شعارات الشراكة الرسمية"')
          ar = ar.replace('content:"Al Raha Mall"', 'content:"الراحة مول"')
          ar = ar.replace("open?'Close navigation':'Open navigation'", "open?'إغلاق القائمة':'فتح القائمة'")
          ar = ar.replace("'Open navigation'", "'فتح القائمة'")

          rtl_css = '''
    html[dir="rtl"] body{direction:rtl;text-align:right}
    html[dir="rtl"] .global-nav{margin-left:0;margin-right:auto}
    html[dir="rtl"] .global-menu-button{margin-left:0;margin-right:auto}
    html[dir="rtl"] .pod-header .pod-btn{margin-left:0;margin-right:auto}
    html[dir="rtl"] .pod-subnav__label{padding-right:0;padding-left:18px;border-right:0;border-left:1px solid var(--pod-line)}
    html[dir="rtl"] .pod-care-item+.pod-care-item{border-left:0;border-right:1px solid var(--pod-line)}
    html[dir="rtl"] .pod-partnership__benefit+.pod-partnership__benefit{border-left:0;border-right:1px solid rgba(255,255,255,.18);padding-left:18px;padding-right:20px}
    html[dir="rtl"] .pod-partnership__visual{margin:0 0 24px 62px}
    html[dir="rtl"] .pod-partnership__aside{right:auto;left:20px}
    html[dir="rtl"] .pod-tag:before{margin-right:0;margin-left:9px}
    html[dir="rtl"] .pod-eyebrow,html[dir="rtl"] .pod-partnership__eyebrow{letter-spacing:0;text-transform:none}
    @media(max-width:760px){html[dir="rtl"] .pod-subnav__links{padding-right:0;padding-left:10px}}
    @media(max-width:700px){html[dir="rtl"] .pod-hero__intro{text-align:right}}
          '''
          ar = ar.replace('\n  </style>\n</head>', rtl_css + '\n  </style>\n<link rel="stylesheet" href="/arabic-quality.css"><script src="/bilingual-routing.js"></script>\n</head>', 1)

          ar_path.write_text(ar, encoding='utf-8')

          sitemap = sitemap_path.read_text(encoding='utf-8')
          ar_url = 'https://silwadi.ae/ar/treatments/people-of-determination.html'
          if ar_url not in sitemap:
              sitemap = sitemap.replace('</urlset>', '  <url>\n    <loc>' + ar_url + '</loc>\n    <lastmod>2026-09-16</lastmod>\n  </url>\n</urlset>')
              sitemap_path.write_text(sitemap, encoding='utf-8')

          green = subprocess.run(['python3', str(test_path)], text=True)
          if green.returncode != 0:
              raise SystemExit('Arabic POD regression test is not green after implementation')
          gallery = subprocess.run(['python3', 'tests/test_people_of_determination_gallery.py'], text=True)
          if gallery.returncode != 0:
              raise SystemExit('Existing POD gallery regression failed')
          print('Arabic POD routing and gallery regressions are green.')
