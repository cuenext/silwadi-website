name: Temporary POD Arabic route repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-pod-arabic-route.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add regression test, repair Arabic POD page, and verify
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          root = Path('.')
          en_path = root / 'treatments' / 'people-of-determination.html'
          ar_path = root / 'ar' / 'treatments' / 'people-of-determination.html'
          pediatric_ar_path = root / 'ar' / 'treatments' / 'pediatric-dentistry.html'
          sitemap_path = root / 'sitemap.xml'
          test_path = root / 'tests' / 'test_people_of_determination_arabic.py'

          test_source = '''from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          ENGLISH_PAGE = ROOT / "treatments" / "people-of-determination.html"
          ARABIC_PAGE = ROOT / "ar" / "treatments" / "people-of-determination.html"
          SITEMAP = ROOT / "sitemap.xml"

          class PeopleOfDeterminationArabicContract(unittest.TestCase):
              def test_arabic_pod_page_exists_and_is_really_pod(self):
                  self.assertTrue(ARABIC_PAGE.exists(), "Arabic POD page is missing")
                  html = ARABIC_PAGE.read_text(encoding="utf-8")
                  self.assertIn('<html lang="ar" dir="rtl">', html)
                  self.assertIn("أصحاب الهمم", html)
                  self.assertIn("رعاية أسنان أصحاب الهمم", html)
                  self.assertNotIn("علاج جذور الأسنان في أبوظبي", html)
                  self.assertIn('href="https://silwadi.ae/treatments/people-of-determination.html"', html)

              def test_english_pod_language_switch_targets_exact_arabic_counterpart(self):
                  html = ENGLISH_PAGE.read_text(encoding="utf-8")
                  target = '/ar/treatments/people-of-determination.html'
                  self.assertGreaterEqual(html.count(target), 2)
                  self.assertNotIn('class="global-language" href="/ar/services.html"', html)

              def test_arabic_pod_preserves_current_seven_photo_gallery(self):
                  html = ARABIC_PAGE.read_text(encoding="utf-8")
                  for filename in ("DSCF2857.webp", "DSCF2848.webp", "DSCF2860.webp", "DSCF2868.webp", "DSCF2873.webp", "DSCF2877.webp", "DSCF2880.webp"):
                      self.assertIn(f'/assets/{filename}', html)
                  self.assertIn('<span>07</span>', html)

              def test_arabic_pod_is_in_sitemap(self):
                  sitemap = SITEMAP.read_text(encoding="utf-8")
                  self.assertIn("https://silwadi.ae/ar/treatments/people-of-determination.html", sitemap)

          if __name__ == "__main__":
              unittest.main()
          '''
          # Remove YAML indentation from the embedded source.
          test_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_source.splitlines()) + '\n'
          test_path.write_text(test_source, encoding='utf-8')

          # TDD guard: this must fail before the missing Arabic page is created.
          red = subprocess.run(['python3', str(test_path)], text=True)
          if red.returncode == 0:
              raise SystemExit('Regression test unexpectedly passed before implementation')
          print('Regression test is red before implementation, as expected.')

          source = en_path.read_text(encoding='utf-8')

          # English page: language controls now target the exact Arabic counterpart.
          english = source.replace(
              'class="global-language" href="/ar/services.html" lang="ar" hreflang="ar" aria-label="عرض الموقع بالعربية">عربي</a>',
              'class="global-language" href="/ar/treatments/people-of-determination.html" lang="ar" hreflang="ar" aria-label="عرض صفحة أصحاب الهمم بالعربية">عربي</a>'
          ).replace(
              '<a href="/ar/services.html" lang="ar" hreflang="ar">عربي</a>',
              '<a href="/ar/treatments/people-of-determination.html" lang="ar" hreflang="ar">عربي</a>'
          )
          if 'hreflang="ar-AE" href="https://silwadi.ae/ar/treatments/people-of-determination.html"' not in english:
              english = english.replace(
                  '<link rel="canonical" href="https://silwadi.ae/treatments/people-of-determination.html">',
                  '<link rel="canonical" href="https://silwadi.ae/treatments/people-of-determination.html">\n'
                  '<link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/people-of-determination.html">\n'
                  '<link rel="alternate" hreflang="ar-AE" href="https://silwadi.ae/ar/treatments/people-of-determination.html">\n'
                  '<link rel="alternate" hreflang="x-default" href="https://silwadi.ae/treatments/people-of-determination.html">'
              )
          en_path.write_text(english, encoding='utf-8')

          # Start from the exact live English POD page to preserve all current layout,
          # gallery behavior and the seven selected clinic photographs.
          ar = source
          ar = ar.replace('<html lang="en">', '<html lang="ar" dir="rtl">')
          ar = ar.replace('<meta name="content-language" content="en">', '<meta name="content-language" content="ar">')
          ar = ar.replace(
              '<title>Dental Care for People of Determination in Abu Dhabi | Silwadi Dental Center</title>',
              '<title>رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان</title>'
          )
          ar = ar.replace(
              '<meta name="description" content="Learn how Silwadi Dental Center supports thoughtful, respectful dental visits for People of Determination at Al Raha Mall in Abu Dhabi.">',
              '<meta name="description" content="رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في مركز سلوادي بالراحة مول في أبوظبي، مع تخطيط الزيارة وفق احتياجات كل مريض.">'
          )
          ar = ar.replace(
              '<link rel="canonical" href="https://silwadi.ae/treatments/people-of-determination.html">',
              '<link rel="canonical" href="https://silwadi.ae/ar/treatments/people-of-determination.html">\n'
              '<link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/people-of-determination.html">\n'
              '<link rel="alternate" hreflang="ar-AE" href="https://silwadi.ae/ar/treatments/people-of-determination.html">\n'
              '<link rel="alternate" hreflang="x-default" href="https://silwadi.ae/treatments/people-of-determination.html">'
          )
          ar = ar.replace('<meta property="og:title" content="Dental Care for People of Determination in Abu Dhabi | Silwadi Dental Center">', '<meta property="og:title" content="رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان">')
          ar = ar.replace('<meta property="og:description" content="Learn how Silwadi Dental Center supports thoughtful, respectful dental visits for People of Determination at Al Raha Mall in Abu Dhabi.">', '<meta property="og:description" content="رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في فرع سلوادي بالراحة مول في أبوظبي.">')
          ar = ar.replace('<meta property="og:url" content="https://silwadi.ae/treatments/people-of-determination.html">', '<meta property="og:url" content="https://silwadi.ae/ar/treatments/people-of-determination.html">')
          ar = ar.replace('<meta property="og:locale" content="en_AE">', '<meta property="og:locale" content="ar_AE">\n<meta property="og:locale:alternate" content="en_AE">')
          ar = ar.replace('<meta name="twitter:title" content="Dental Care for People of Determination in Abu Dhabi | Silwadi Dental Center">', '<meta name="twitter:title" content="رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان">')
          ar = ar.replace('<meta name="twitter:description" content="Learn how Silwadi Dental Center supports thoughtful, respectful dental visits for People of Determination at Al Raha Mall in Abu Dhabi.">', '<meta name="twitter:description" content="رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في فرع سلوادي بالراحة مول في أبوظبي.">')

          schema = {
              '@context': 'https://schema.org',
              '@graph': [
                  {'@type':'WebPage','@id':'https://silwadi.ae/ar/treatments/people-of-determination.html#webpage','url':'https://silwadi.ae/ar/treatments/people-of-determination.html','name':'رعاية أسنان أصحاب الهمم في أبوظبي | مركز سلوادي لطب الأسنان','description':'رعاية أسنان ميسّرة ومحترمة لأصحاب الهمم في فرع سلوادي بالراحة مول في أبوظبي.','inLanguage':'ar-AE','isPartOf':{'@id':'https://silwadi.ae/#website'},'mainEntity':{'@id':'https://silwadi.ae/ar/treatments/people-of-determination.html#service'},'primaryImageOfPage':{'@type':'ImageObject','url':'https://silwadi.ae/assets/DSCF2857.webp'}},
                  {'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'الرئيسية','item':'https://silwadi.ae/ar/'},{'@type':'ListItem','position':2,'name':'العلاجات','item':'https://silwadi.ae/ar/treatments.html'},{'@type':'ListItem','position':3,'name':'رعاية أسنان أصحاب الهمم','item':'https://silwadi.ae/ar/treatments/people-of-determination.html'}]},
                  {'@type':'Service','@id':'https://silwadi.ae/ar/treatments/people-of-determination.html#service','name':'رعاية أسنان أصحاب الهمم','serviceType':'رعاية أسنان ميسّرة ومخططة بشكل فردي لأصحاب الهمم','url':'https://silwadi.ae/ar/treatments/people-of-determination.html','provider':{'@id':'https://silwadi.ae/#organization'},'areaServed':{'@type':'City','name':'أبوظبي'},'availableAtOrFrom':{'@type':'Place','name':'مركز سلوادي لطب الأسنان - الراحة مول'}}
              ]
          }
          ar = re.sub(r'<script type="application/ld\+json" data-seo-schema>.*?</script>', '<script type="application/ld+json" data-seo-schema>' + json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '</script>', ar, count=1, flags=re.S)

          # Correct asset and internal-link depth for /ar/treatments/.
          ar = ar.replace('href="../favicon.svg"', 'href="/favicon.svg"')
          ar = ar.replace('href="../styles.css"', 'href="/styles.css"')
          ar = ar.replace('src="../assets/', 'src="/assets/')
          ar = ar.replace('src="../app.js"', 'src="/app.js"')
          ar = ar.replace('href="../contact.html#consultation-form"', 'href="/ar/contact.html#consultation-form"')
          ar = ar.replace('href="../services.html"', 'href="/ar/services.html"')
          ar = ar.replace('href="../treatments.html"', 'href="/ar/treatments.html"')
          ar = ar.replace('href="../doctors.html"', 'href="/ar/doctors.html"')
          ar = ar.replace('href="../about.html"', 'href="/ar/about.html"')
          ar = ar.replace('href="../locations.html"', 'href="/ar/locations.html"')
          ar = ar.replace('href="../contact.html"', 'href="/ar/contact.html"')

          # Reuse the already-approved Arabic site shell from Pediatrics so the
          # navigation/footer behavior is consistent across Arabic treatment pages.
          pediatric_ar = pediatric_ar_path.read_text(encoding='utf-8')
          header = re.search(r'<header class="global-header".*?</header>', pediatric_ar, re.S).group(0)
          mobile_nav = re.search(r'<div class="global-mobile-nav" id="globalMobileNav">.*?</div>\s*</div>', pediatric_ar, re.S).group(0)
          footer = re.search(r'<footer class="site-footer">.*?</footer>', pediatric_ar, re.S).group(0)
          actionbar = re.search(r'<div class="mobile-actionbar".*?</div>', pediatric_ar, re.S).group(0)
          en_pediatric = 'https://silwadi.ae/treatments/pediatric-dentistry.html'
          en_pod = 'https://silwadi.ae/treatments/people-of-determination.html'
          header = header.replace(en_pediatric, en_pod)
          mobile_nav = mobile_nav.replace(en_pediatric, en_pod)
          ar = re.sub(r'<header class="global-header".*?</header>', header, ar, count=1, flags=re.S)
          ar = re.sub(r'<div class="global-mobile-nav" id="globalMobileNav">.*?</div>\s*</div>', mobile_nav, ar, count=1, flags=re.S)
          ar = re.sub(r'<footer class="site-footer">.*?</footer>', footer, ar, count=1, flags=re.S)
          ar = re.sub(r'<div class="mobile-actionbar".*?</div>', actionbar, ar, count=1, flags=re.S)
          ar = ar.replace('<body class="pod-page">', '<body class="pod-page language-ar static-arabic">')

          # POD page-specific Arabic copy.
          replacements = {
              '<nav class="pod-subnav" aria-label="On this page"><div class="container pod-subnav__inner"><span class="pod-subnav__label">On this page</span><div class="pod-subnav__links"><a href="#partnership">Partnership</a><a href="#individual-care">Care</a><a href="#complex-needs">Support needs</a><a href="#before-visit">Before your visit</a><a href="#raha">Al Raha</a></div></div></nav>': '<nav class="pod-subnav" aria-label="في هذه الصفحة"><div class="container pod-subnav__inner"><span class="pod-subnav__label">في هذه الصفحة</span><div class="pod-subnav__links"><a href="#partnership">الشراكة</a><a href="#individual-care">الرعاية</a><a href="#complex-needs">احتياجات الدعم</a><a href="#before-visit">قبل الزيارة</a><a href="#raha">الراحة مول</a></div></div></nav>',
              'People of Determination · Al Raha Mall':'أصحاب الهمم · الراحة مول',
              'Dental Care for People of Determination in <span>Abu&nbsp;Dhabi</span>':'رعاية أسنان أصحاب الهمم في <span>أبوظبي</span>',
              'Respectful dental care with an environment and visit plan shaped around the individual patient.':'رعاية أسنان باحترام واهتمام، ضمن بيئة وخطة زيارة تُهيّأ وفق احتياجات كل مريض.',
              '>Request an Appointment</a>':'>اطلب موعداً</a>',
              '>Request Appointment</a>':'>اطلب موعداً</a>',
              'Official partnership · 10 April 2026':'شراكة رسمية · 10 أبريل 2026',
              'Official Partnership with Zayed Authority for People of Determination':'شراكة رسمية مع مؤسسة زايد العليا لأصحاب الهمم',
              'The formal MoU establishes an approved referral pathway for specialized dental services and supports more coordinated access to care for People of Determination.':'تُرسّخ مذكرة التفاهم مسار إحالة معتمداً لخدمات طب الأسنان التخصصية، وتدعم وصولاً أكثر تنسيقاً إلى الرعاية لأصحاب الهمم.',
              'View official announcement ↗':'عرض الإعلان الرسمي ↗',
              'Greater Access to Specialized Care':'وصول أفضل إلى الرعاية التخصصية',
              'A More Inclusive Community':'مجتمع أكثر شمولاً',
              'Healthier Smiles, Brighter Futures':'ابتسامات أكثر صحة ومستقبل أكثر إشراقاً',
              'Care designed around the individual':'رعاية مصممة حول احتياجات الفرد',
              'Thoughtful support, without making the visit feel complicated.':'دعم مدروس من دون تعقيد تجربة الزيارة.',
              'Practical needs can be shared before the appointment so the Al Raha team can prepare the environment, communication and clinical approach appropriately.':'يمكن مشاركة الاحتياجات العملية قبل الموعد حتى يتمكن فريق الراحة من تهيئة البيئة وطريقة التواصل والنهج السريري بالشكل المناسب.',
              'Accessible treatment environment':'بيئة علاج ميسّرة',
              'A dedicated treatment environment at Al Raha supports patients who may need additional space or mobility accommodation.':'توفر غرفة العلاج المخصصة في الراحة مساحة وتجهيزات تساعد المرضى الذين قد يحتاجون إلى مساحة إضافية أو ترتيبات للحركة.',
              'Individual care planning':'تخطيط فردي للرعاية',
              'Relevant medical, mobility and support information can be shared before the visit and considered by the clinical team.':'يمكن مشاركة المعلومات الطبية واحتياجات الحركة والدعم قبل الزيارة ليأخذها الفريق الطبي في الاعتبار.',
              'Communication &amp; sensory support':'دعم التواصل والاحتياجات الحسية',
              'Tell reception about communication preferences, sensory considerations or routines that may help make the appointment clearer.':'أخبر فريق الاستقبال بتفضيلات التواصل أو الاعتبارات الحسية أو الروتين الذي قد يجعل الموعد أوضح وأكثر راحة.',
              'Family &amp; caregiver collaboration':'التعاون مع الأسرة ومقدّم الرعاية',
              'Where appropriate, a family member or caregiver can help communicate history, preferences and practical support needs.':'عند الحاجة، يمكن لأحد أفراد الأسرة أو مقدّم الرعاية المساعدة في توضيح التاريخ الصحي والتفضيلات واحتياجات الدعم العملية.',
              'Designed for broader support needs':'مصمم لاحتياجات دعم أوسع',
              'A clinical setting built with access in mind.':'بيئة سريرية تراعي سهولة الوصول.',
              'The official Zayed Authority announcement describes the center’s treatment environment as designed to accommodate People of Determination across different support needs.':'يوضح الإعلان الرسمي أن بيئة العلاج في المركز صُممت لاستيعاب أصحاب الهمم باختلاف احتياجات الدعم.',
              'Environment designed to accommodate wheelchair users.':'بيئة مصممة لاستيعاب مستخدمي الكراسي المتحركة.',
              'Designed to support individuals who rely on medical support devices, including oxygen machines and feeding tubes.':'مصممة لدعم الأشخاص الذين يعتمدون على أجهزة دعم طبية، بما في ذلك أجهزة الأكسجين وأنابيب التغذية.',
              'Staff training under the partnership includes communication and inclusive healthcare support.':'يشمل التدريب ضمن الشراكة أساليب التواصل ودعم الرعاية الصحية الشاملة.',
              'These points reflect the Zayed Authority announcement of 10 April 2026. Individual appointment suitability and clinical requirements are assessed by the treating team.':'تعكس هذه النقاط الإعلان الرسمي الصادر في 10 أبريل 2026. وتُقيّم ملاءمة الموعد والمتطلبات السريرية لكل حالة بواسطة الفريق المعالج.',
              'Read the official source':'قراءة المصدر الرسمي',
              '<h2>Before your visit</h2>':'<h2>قبل زيارتك</h2>',
              'Tell our Al Raha reception team about anything that may help us prepare appropriately.':'أخبر فريق الاستقبال في فرع الراحة بأي معلومات قد تساعدنا على الاستعداد للزيارة بالشكل المناسب.',
              '<span class="pod-tag">Mobility</span>':'<span class="pod-tag">الحركة</span>',
              '<span class="pod-tag">Communication</span>':'<span class="pod-tag">التواصل</span>',
              '<span class="pod-tag">Sensory needs</span>':'<span class="pod-tag">الاحتياجات الحسية</span>',
              '<span class="pod-tag">Medical support</span>':'<span class="pod-tag">الدعم الطبي</span>',
              '<span class="pod-tag">Caregiver requirements</span>':'<span class="pod-tag">متطلبات مقدّم الرعاية</span>',
              'Al Raha Mall branch':'فرع الراحة مول',
              'Plan your visit to Al Raha.':'خطط لزيارتك إلى فرع الراحة.',
              'Contact reception before your appointment if you would like to discuss access or support considerations.':'تواصل مع الاستقبال قبل موعدك إذا رغبت في مناقشة أي اعتبارات تتعلق بسهولة الوصول أو الدعم.',
              '<strong>Location</strong>':'<strong>الموقع</strong>',
              '<strong>Phone</strong>':'<strong>الهاتف</strong>',
              '<strong>Opening hours</strong>':'<strong>ساعات العمل</strong>',
              'Saturday–Thursday 10:00 AM–7:00 PM · Friday closed':'السبت–الخميس 10:00 صباحاً–7:00 مساءً · الجمعة مغلق',
              '<strong>Care setting</strong>':'<strong>بيئة الرعاية</strong>',
              'Accessible dental treatment room available at the Al Raha branch.':'غرفة علاج أسنان ميسّرة متاحة في فرع الراحة.',
              '>Call Al Raha</a>':'>اتصل بفرع الراحة</a>',
              'Tell us how we can support the visit.':'أخبرنا كيف يمكننا دعم الزيارة.',
              'Request an appointment and share any access or support considerations with our Al Raha team in advance.':'اطلب موعداً وشارك أي اعتبارات تتعلق بسهولة الوصول أو الدعم مع فريقنا في فرع الراحة مسبقاً.'
          }
          for old, new in replacements.items():
              ar = ar.replace(old, new)

          gallery_alts = {
              'Wide view of the accessible dental treatment room at Silwadi Dental Center, Al Raha Mall':'منظر واسع لغرفة علاج الأسنان الميسّرة في مركز سلوادي بالراحة مول',
              'Wide angled view of the accessible treatment room and dental equipment at Al Raha Mall':'منظر جانبي واسع لغرفة العلاج الميسّرة وتجهيزات الأسنان في الراحة مول',
              'Elevated view of the wheelchair-accessible dental setup at Silwadi Al Raha':'منظر مرتفع لتجهيزات علاج الأسنان المهيأة لمستخدمي الكراسي المتحركة في سلوادي الراحة',
              'Side view of the wheelchair-accessible dental chair and treatment equipment at Silwadi Al Raha':'منظر جانبي لكرسي وتجهيزات علاج الأسنان المهيأة لمستخدمي الكراسي المتحركة في سلوادي الراحة',
              'Close view of the accessible dental chair and instrument console at Silwadi Al Raha':'منظر قريب لكرسي الأسنان الميسّر ووحدة الأدوات في سلوادي الراحة',
              'Front view of the accessible dental room with treatment equipment at Silwadi Al Raha':'منظر أمامي لغرفة علاج الأسنان الميسّرة وتجهيزاتها في سلوادي الراحة',
