name: Temporary fix POD gallery and Arabic treatment pairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-pod-arabic-treatment-pairs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - reproduce both reported bugs
        run: |
          if python3 - <<'PY'
          from pathlib import Path
          import json

          pod = Path('review/people-of-determination-raha-v1.html').read_text(encoding='utf-8')
          endo = Path('treatments/endodontics.html').read_text(encoding='utf-8')
          ped = Path('treatments/pediatric-dentistry.html').read_text(encoding='utf-8')
          seo = json.loads(Path('data/arabic-seo.json').read_text(encoding='utf-8'))

          assert 'aspect-ratio:3/2;overflow:hidden;border-radius:22px' in pod
          assert '.pod-clinic-slide img{display:block;width:100%;height:100%;aspect-ratio:auto' in pod
          assert '/ar/treatments/endodontics.html' in endo
          assert '/ar/services.html#endodontics' not in endo
          assert '/ar/treatments/pediatric-dentistry.html' in ped
          assert '/ar/services.html#pedodontics' not in ped
          assert 'treatments/endodontics.html' in seo
          assert 'treatments/pediatric-dentistry.html' in seo
          assert Path('ar/treatments/endodontics.html').exists()
          assert Path('ar/treatments/pediatric-dentistry.html').exists()
          PY
          then
            echo 'Bug contract unexpectedly already passes.'
            exit 1
          else
            echo 'Expected pre-fix failure reproduced.'
          fi

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1) POD: constrain the FIGURE itself to the same landscape-card model as Pediatrics.
          # This prevents the intrinsic 2048x1365 image element from creating a very tall slide.
          p = Path('review/people-of-determination-raha-v1.html')
          s = p.read_text(encoding='utf-8')
          old_slide = '.pod-clinic-slide{flex:0 0 var(--pod-slide-width);width:var(--pod-slide-width);margin:0;scroll-snap-align:center;opacity:.42;transform:scale(.965);transition:opacity .28s ease,transform .35s cubic-bezier(.22,.75,.24,1);cursor:pointer}'
          new_slide = '.pod-clinic-slide{flex:0 0 var(--pod-slide-width);width:var(--pod-slide-width);aspect-ratio:3/2;overflow:hidden;border-radius:22px;margin:0;scroll-snap-align:center;opacity:.42;transform:scale(.965);transition:opacity .28s ease,transform .35s cubic-bezier(.22,.75,.24,1);cursor:pointer}'
          old_img = '.pod-clinic-slide img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:22px;background:#dfecee;box-shadow:0 24px 64px rgba(8,56,71,.16)}'
          new_img = '.pod-clinic-slide img{display:block;width:100%;height:100%;aspect-ratio:auto;object-fit:cover;border-radius:inherit;background:#dfecee;box-shadow:0 24px 64px rgba(8,56,71,.16)}'
          if old_slide not in s or old_img not in s:
              raise SystemExit('POD gallery CSS markers changed; refusing blind edit')
          s = s.replace(old_slide, new_slide, 1).replace(old_img, new_img, 1)
          p.write_text(s, encoding='utf-8')

          # 2) English treatment pages: the language control must point to the paired page,
          # never back to the generic Arabic services page.
          pairs = [
              ('treatments/endodontics.html', '/ar/services.html#endodontics', '/ar/treatments/endodontics.html'),
              ('treatments/pediatric-dentistry.html', '/ar/services.html#pedodontics', '/ar/treatments/pediatric-dentistry.html'),
          ]
          for filename, old, new in pairs:
              path = Path(filename)
              html = path.read_text(encoding='utf-8')
              marker = f'href="{old}" lang="ar" hreflang="ar"'
              replacement = f'href="{new}" data-page-language-switch lang="ar" hreflang="ar"'
              count = html.count(marker)
              if count != 2:
                  raise SystemExit(f'{filename}: expected 2 language links, found {count}')
              html = html.replace(marker, replacement)
              path.write_text(html, encoding='utf-8')

          # 3) Register the two newly approved English treatment routes in the existing
          # static Arabic build system so it generates true paired Arabic pages.
          seo_path = Path('data/arabic-seo.json')
          seo = json.loads(seo_path.read_text(encoding='utf-8'))
          seo['treatments/endodontics.html'] = {
              'title': 'علاج جذور الأسنان في أبوظبي | مركز سلوادي',
              'description': 'علاج جذور الأسنان التخصصي في مركز سلوادي بأبوظبي، بما في ذلك علاج القنوات وإعادة العلاج والجراحة المجهرية وإصابات الأسنان مع التركيز على الحفاظ على السن الطبيعي.'
          }
          seo['treatments/pediatric-dentistry.html'] = {
              'title': 'طب أسنان الأطفال في أبوظبي | مركز سلوادي',
              'description': 'رعاية أسنان الأطفال في مركز سلوادي بالراحة مول، بما في ذلك الوقاية والحشوات وعلاج لب الأسنان وتقييم إصابات الأسنان مع خطة تناسب عمر الطفل واحتياجاته.'
          }
          seo_path.write_text(json.dumps(seo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4) Add reviewed Arabic copy for the custom treatment-page text.
          overrides_path = Path('data/arabic-quality-overrides-extra.json')
