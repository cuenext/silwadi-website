            'A first dental visit is generally recommended by the first birthday, or sooner if there is pain, visible decay, trauma or another concern. Early visits focus mainly on prevention and development.': 'يُنصح عادةً بالزيارة الأولى لطبيب الأسنان بحلول عمر سنة، أو قبل ذلك عند وجود ألم أو تسوس ظاهر أو إصابة أو أي قلق آخر. تركز الزيارات المبكرة على الوقاية ومتابعة النمو.',
            'Do baby teeth really need treatment?': 'هل تحتاج الأسنان اللبنية فعلاً إلى العلاج؟',
            'Yes. Baby teeth support chewing, speech and space for developing permanent teeth. The right treatment depends on the tooth, symptoms, clinical findings and prognosis.': 'نعم. تساعد الأسنان اللبنية في المضغ والكلام وتحافظ على المساحة للأسنان الدائمة. يعتمد العلاج المناسب على السن والأعراض والنتائج السريرية والتوقعات العلاجية.',
            'What if my child is scared of the dentist?': 'ماذا لو كان طفلي خائفاً من طبيب الأسنان؟',
            'Pediatric care can use age-appropriate communication and behavior guidance. Nitrous oxide conscious sedation may also be considered when clinically appropriate after assessment.': 'يمكن استخدام التواصل المناسب للعمر وأساليب التوجيه السلوكي. وقد تُدرس التهدئة الواعية بأكسيد النيتروز عندما تكون مناسبة سريرياً بعد التقييم.',
            'What should I do after a dental injury?': 'ماذا أفعل بعد إصابة في الأسنان؟',
            'Contact a dental professional promptly if a tooth is chipped, loose, displaced or causing significant pain. The next step depends on the injury and whether the affected tooth is primary or permanent.': 'تواصل مع طبيب الأسنان بسرعة إذا كان السن مكسوراً أو متخلخلاً أو متحركاً من مكانه أو يسبب ألماً شديداً. تعتمد الخطوة التالية على نوع الإصابة وما إذا كان السن لبنياً أم دائماً.',
            "Arrange your child's dental visit.": 'رتّب زيارة طفلك لعيادة الأسنان.',
            'Contact Silwadi Dental Center to request an appointment with our pediatric dentist at Al Raha Mall.': 'تواصل مع مركز سلوادي لطب الأسنان لطلب موعد مع اختصاصية أسنان الأطفال في الراحة مول.'
          }
          overrides.update(additions)
          overrides_path.write_text(json.dumps(overrides, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 5) Generated Arabic versions of these custom pages need a true reverse switch.
          build_path = Path('tools/build-arabic-site.mjs')
          build = build_path.read_text(encoding='utf-8')
          needle = "  translateDocument(document, route, dom.window);\n  polishArabicStructure(document, route);\n\n  if (!document.querySelector('link[href=\"/arabic-quality.css\"]')) {"
          replacement = "  translateDocument(document, route, dom.window);\n  polishArabicStructure(document, route);\n\n  document.querySelectorAll('[data-page-language-switch]').forEach(switcher => {\n    switcher.href = englishUrl(route);\n    switcher.textContent = 'English';\n    switcher.lang = 'en';\n    switcher.hreflang = 'en';\n    switcher.setAttribute('aria-label', 'View this page in English');\n  });\n\n  if (!document.querySelector('link[href=\"/arabic-quality.css\"]')) {"
          if needle not in build:
              raise SystemExit('Arabic builder insertion marker not found')
          build = build.replace(needle, replacement, 1)
          build_path.write_text(build, encoding='utf-8')

          # 6) Make the audit page-count assertion scale with registered bilingual routes.
          test_path = Path('tests/test_arabic_quality_seo_rebuild.py')
          test = test_path.read_text(encoding='utf-8')
          old = 'self.assertIn("SEO launch audit: 54 pages, 0 errors", result.stdout)'
          new = 'self.assertIn(f"SEO launch audit: {len(SEO) * 2} pages, 0 errors", result.stdout)'
          if old not in test:
              raise SystemExit('Arabic audit count assertion marker not found')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Arabic build dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3

      - name: Build paired Arabic treatment pages
        run: node tools/build-arabic-site.mjs

      - name: GREEN - verify the reported behavior is fixed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          pod = Path('review/people-of-determination-raha-v1.html').read_text(encoding='utf-8')
          endo = Path('treatments/endodontics.html').read_text(encoding='utf-8')
          ped = Path('treatments/pediatric-dentistry.html').read_text(encoding='utf-8')
          seo = json.loads(Path('data/arabic-seo.json').read_text(encoding='utf-8'))
          ar_endo = Path('ar/treatments/endodontics.html').read_text(encoding='utf-8')
          ar_ped = Path('ar/treatments/pediatric-dentistry.html').read_text(encoding='utf-8')

          assert 'aspect-ratio:3/2;overflow:hidden;border-radius:22px' in pod
          assert '.pod-clinic-slide img{display:block;width:100%;height:100%;aspect-ratio:auto' in pod
          assert '--pod-slide-width:min(60vw,760px)' in pod

          assert '/ar/treatments/endodontics.html' in endo
          assert '/ar/services.html#endodontics' not in endo
          assert '/ar/treatments/pediatric-dentistry.html' in ped
          assert '/ar/services.html#pedodontics' not in ped
          assert endo.count('data-page-language-switch') == 2
          assert ped.count('data-page-language-switch') == 2

          for route, html, english in [
              ('treatments/endodontics.html', ar_endo, 'https://silwadi.ae/treatments/endodontics.html'),
              ('treatments/pediatric-dentistry.html', ar_ped, 'https://silwadi.ae/treatments/pediatric-dentistry.html'),
          ]:
              assert route in seo
              assert '<html lang="ar" dir="rtl"' in html or '<html dir="rtl" lang="ar"' in html
              assert html.count('data-page-language-switch') == 2
              assert html.count(f'href="{english}"') >= 2
              assert '>English</a>' in html
              body = html.split('<body',1)[-1]
              body = re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>', '', body, flags=re.I)
              assert 'Root Canal Treatment in' not in body
              assert 'Specialist dental care for children' not in body

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://silwadi.ae/ar/treatments/endodontics.html' in sitemap
          assert 'https://silwadi.ae/ar/treatments/pediatric-dentistry.html' in sitemap
          print('POD sizing + Arabic treatment pair contract passed')
          PY

      - name: Run Arabic quality regressions
        run: |
          python -m unittest tests.test_arabic_quality_seo_rebuild -v
          python -m unittest tests.test_arabic_structured_data -v
          python -m unittest tests.test_arabic_mobile_polish -v
          python -m unittest tests.test_booking_modal -v
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: pair Arabic treatment pages and constrain POD gallery [skip arabic build]'
          git push
