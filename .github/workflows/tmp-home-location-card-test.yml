name: Temporary homepage location card regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ar/index.html'
      - 'tests/test_patch16_truth_reviews_raha.py'
      - '.github/workflows/tmp-home-location-card-test.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage location card contact actions
        run: python -m unittest tests.test_patch16_truth_reviews_raha.PatchSixteenTruthReviewsRaha.test_home_location_cards_use_branch_phone_and_real_directions_links -v
