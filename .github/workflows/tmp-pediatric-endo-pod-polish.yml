          services = services.replace('href="services.html#pedodontics"','href="treatments/pediatric-dentistry.html"')
          services = services.replace('href="#pedodontics"','href="treatments/pediatric-dentistry.html"')
          Path('services.html').write_text(services, encoding='utf-8')

          treatments = Path('treatments.html').read_text(encoding='utf-8')
          treatments = treatments.replace('https://silwadi.ae/services.html#pedodontics','https://silwadi.ae/treatments/pediatric-dentistry.html')
          treatments = treatments.replace('href="services.html#pedodontics"','href="treatments/pediatric-dentistry.html"')
          Path('treatments.html').write_text(treatments, encoding='utf-8')

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          pediatric_url = 'https://silwadi.ae/treatments/pediatric-dentistry.html'
          if pediatric_url not in sitemap:
              marker = '  <url>\n    <loc>https://silwadi.ae/treatments/endodontics.html</loc>\n    <lastmod>2026-09-15</lastmod>\n  </url>\n'
              addition = marker + '  <url>\n    <loc>' + pediatric_url + '</loc>\n    <lastmod>2026-09-16</lastmod>\n  </url>\n'
              if marker not in sitemap:
                  raise SystemExit('Endodontics sitemap marker not found')
              sitemap = sitemap.replace(marker, addition, 1)
          Path('sitemap.xml').write_text(sitemap, encoding='utf-8')
          PY

      - name: Verify Pediatric production contract
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('treatments/pediatric-dentistry.html')
          assert p.exists()
          s = p.read_text(encoding='utf-8')
          assert '<meta name="robots" content="index,follow,max-image-preview:large">' in s
          assert '<link rel="canonical" href="https://silwadi.ae/treatments/pediatric-dentistry.html">' in s
