          assert '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">' in s
          PY
          then
            echo 'POD repaired-layout contract unexpectedly passed before implementation.'
            exit 1
          else
            echo 'Expected POD pre-implementation failure confirmed.'
          fi

      - name: GREEN - Repair POD review header and gallery sizing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('review/people-of-determination-raha-v1.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('--pod-slide-width:min(82vw,1120px)', '--pod-slide-width:min(68vw,880px)', 1)
