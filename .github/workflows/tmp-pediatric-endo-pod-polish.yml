          assert 'treatments/pediatric-dentistry.html' in Path('services.html').read_text(encoding='utf-8')
          assert 'treatments/pediatric-dentistry.html' in Path('treatments.html').read_text(encoding='utf-8')
          assert 'https://silwadi.ae/treatments/pediatric-dentistry.html' in Path('sitemap.xml').read_text(encoding='utf-8')
          print('Pediatric production contract passed')
          PY

      - name: Commit Pediatric publish
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add treatments/pediatric-dentistry.html services.html treatments.html sitemap.xml
          git commit -m "feat: publish Pediatric Dentistry treatment page"

