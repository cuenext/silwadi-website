        run: |
          if python3 - <<'PY'
          from pathlib import Path
          s = Path('treatments/endodontics.html').read_text(encoding='utf-8')
          assert '<div class="hero-actions"><a class="btn btn-primary" href="/contact.html#consultation-form">Book an Appointment</a>' in s
          assert '<div class="hero-actions"><a class="btn btn-primary" href="#consultation">Book an Appointment</a>' not in s
          PY
          then
            echo 'Endodontics direct-booking contract unexpectedly passed before implementation.'
            exit 1
          else
            echo 'Expected Endodontics pre-implementation failure confirmed.'
          fi

      - name: GREEN - Make Endodontics hero booking direct
        run: |
