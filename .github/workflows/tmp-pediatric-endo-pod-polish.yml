          header = f'''<body class="pediatric-review">
  <header class="global-header" id="globalHeader"><div class="container global-header__inner"><a class="global-brand" href="/" aria-label="Silwadi Dental Center home"><img src="/assets/silwadi-logo-official.png" alt="Silwadi Dental Center" width="180" height="180"></a><nav class="global-nav" aria-label="Primary navigation"><a href="/services.html">Services <span aria-hidden="true">⌄</span></a><a href="/doctors.html">Doctors</a><a href="/about.html">About</a><a href="/locations.html">Locations</a></nav><div class="global-actions"><a class="global-language" href="/ar/services.html#pedodontics" lang="ar" hreflang="ar" aria-label="عرض الموقع بالعربية">عربي</a><a class="global-whatsapp" href="{whatsapp}" target="_blank" rel="noopener" aria-label="Chat with Silwadi Dental Center on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.84 9.84 0 0 0-8.43 14.91L2 22l5.22-1.56A9.9 9.9 0 1 0 12.04 2Zm0 17.98a8.03 8.03 0 0 1-4.09-1.12l-.29-.17-3.1.93.94-3.02-.19-.31A8.04 8.04 0 1 1 12.04 19.98Zm4.4-6.03c-.24-.12-1.43-.7-1.65-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.19-.71-.64-1.2-1.42-1.34-1.66-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.47-.39-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.59 4.11 3.63.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.43-.58 1.63-1.15.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28Z"/></svg><span>WhatsApp</span></a><a class="global-book" href="/contact.html#consultation-form">Book a Consultation</a></div><button class="global-menu-button" type="button" aria-expanded="false" aria-controls="globalMobileNav" aria-label="Open navigation"><span></span><span></span></button></div></header>
  <div class="global-mobile-nav" id="globalMobileNav"><div class="container global-mobile-nav__inner"><a href="/services.html">Services</a><a href="/doctors.html">Doctors</a><a href="/about.html">About</a><a href="/locations.html">Locations</a><a href="/ar/services.html#pedodontics" lang="ar" hreflang="ar">عربي</a><div class="global-mobile-nav__actions"><a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a><a href="/contact.html#consultation-form">Book</a></div></div></div>
  <nav class="pd-subnav" aria-label="On this page"><div class="container pd-subnav__inner"><span class="pd-subnav__label">On this page</span><div class="pd-subnav__links"><a href="#clinic">Clinic</a><a href="#care">Care</a><a href="#visit">What to expect</a><a href="#specialist">Specialist</a><a href="#faq">FAQ</a></div></div></nav>

  <main>'''
          text, n = re.subn(r'<body class="pediatric-review">.*?<main>', header, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace Pediatric review header block')

          text = text.replace('href="#consultation"', 'href="/contact.html#consultation-form"')
          text = text.replace('href="../contact.html#consultation-form"', 'href="/contact.html#consultation-form"')
          text = text.replace('<div class="pd-breadcrumb"><span>Home</span><span>/</span><span>Treatments</span><span>/</span><strong>Pediatric Dentistry</strong></div>', '<nav class="pd-breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><a href="/treatments.html">Treatments</a><span>/</span><strong aria-current="page">Pediatric Dentistry</strong></nav>')

          menu_script = '''<script>(function(){const b=document.querySelector('.global-menu-button');const m=document.getElementById('globalMobileNav');if(!b||!m)return;b.addEventListener('click',()=>{const open=m.classList.toggle('is-open');b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'Close navigation':'Open navigation')});m.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{m.classList.remove('is-open');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Open navigation')}));})();</script>'''
          text = text.replace('  <script src="../app.js"></script>', '  ' + menu_script + '\n  <script src="../app.js"></script>', 1)

          Path('treatments/pediatric-dentistry.html').write_text(text, encoding='utf-8')

          # Internal links from service/treatment directories.
          services = Path('services.html').read_text(encoding='utf-8')
