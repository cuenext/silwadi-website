name: Temporary pediatric publish and treatment fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pediatric-endo-pod-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RED - Pediatric production contract must fail before publish
        run: |
          if python3 - <<'PY'
          from pathlib import Path
          p = Path('treatments/pediatric-dentistry.html')
          assert p.exists()
          s = p.read_text(encoding='utf-8')
          assert '<meta name="robots" content="index,follow,max-image-preview:large">' in s
          assert '<link rel="canonical" href="https://silwadi.ae/treatments/pediatric-dentistry.html">' in s
          assert 'class="global-header"' in s
          assert 'aria-label="On this page"' in s
          PY
          then
            echo 'Pediatric production contract unexpectedly passed before implementation.'
            exit 1
          else
            echo 'Expected Pediatric pre-implementation failure confirmed.'
          fi

      - name: GREEN - Publish approved Pediatric Dentistry page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          src = Path('review/pediatric-dentistry-v1.html').read_text(encoding='utf-8')
          text = src

          # Production metadata.
          text = text.replace(
              '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">',
              '<meta name="robots" content="index,follow,max-image-preview:large">\n  <meta name="content-language" content="en">',
              1,
          )
          description = '<meta name="description" content="Looking for a pediatric dentist in Abu Dhabi? Silwadi provides children\'s dental care at Al Raha Mall, including prevention, fillings, pulp therapy and dental trauma care.">'
          seo_extra = '''<link rel="canonical" href="https://silwadi.ae/treatments/pediatric-dentistry.html">
  <link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/pediatric-dentistry.html">
  <link rel="alternate" hreflang="x-default" href="https://silwadi.ae/treatments/pediatric-dentistry.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Silwadi Dental Center">
  <meta property="og:title" content="Pediatric Dentist in Abu Dhabi | Children's Dental Care | Silwadi Dental Center">
  <meta property="og:description" content="Specialist children's dental care at Silwadi Al Raha Mall, including prevention, restorative treatment, pulp therapy and dental trauma assessment.">
  <meta property="og:url" content="https://silwadi.ae/treatments/pediatric-dentistry.html">
  <meta property="og:image" content="https://silwadi.ae/assets/review/pediatric-clinic/dscf2888.webp">
  <meta property="og:locale" content="en_AE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pediatric Dentist in Abu Dhabi | Silwadi Dental Center">
  <meta name="twitter:description" content="Specialist children's dental care at Silwadi Al Raha Mall with prevention, restorative care, pulp therapy and dental trauma assessment.">
  <meta name="twitter:image" content="https://silwadi.ae/assets/review/pediatric-clinic/dscf2888.webp">'''
          if description not in text:
              raise SystemExit('Pediatric description marker not found')
          text = text.replace(description, description + '\n  ' + seo_extra, 1)

          schema = {
            '@context': 'https://schema.org',
            '@graph': [
              {
                '@type': 'WebPage',
                '@id': 'https://silwadi.ae/treatments/pediatric-dentistry.html#webpage',
                'url': 'https://silwadi.ae/treatments/pediatric-dentistry.html',
                'name': "Pediatric Dentist in Abu Dhabi | Children's Dental Care | Silwadi Dental Center",
                'description': "Specialist children's dental care at Silwadi Al Raha Mall, including prevention, restorative treatment, pulp therapy and dental trauma assessment.",
                'inLanguage': 'en-AE',
                'isPartOf': {'@id': 'https://silwadi.ae/#website'},
                'mainEntity': {'@id': 'https://silwadi.ae/treatments/pediatric-dentistry.html#service'},
                'primaryImageOfPage': {'@type': 'ImageObject', 'url': 'https://silwadi.ae/assets/review/pediatric-clinic/dscf2888.webp', 'width': 1200, 'height': 800},
              },
              {
                '@type': 'BreadcrumbList',
                'itemListElement': [
                  {'@type':'ListItem','position':1,'name':'Home','item':'https://silwadi.ae/'},
                  {'@type':'ListItem','position':2,'name':'Treatments','item':'https://silwadi.ae/treatments.html'},
                  {'@type':'ListItem','position':3,'name':'Pediatric Dentistry','item':'https://silwadi.ae/treatments/pediatric-dentistry.html'},
                ],
              },
              {
                '@type':'Service',
                '@id':'https://silwadi.ae/treatments/pediatric-dentistry.html#service',
                'name':'Pediatric Dentistry',
                'serviceType':"Children's dental care, prevention, restorative treatment, pulp therapy and dental trauma assessment",
                'url':'https://silwadi.ae/treatments/pediatric-dentistry.html',
                'provider':{'@id':'https://silwadi.ae/#organization'},
                'areaServed':{'@type':'City','name':'Abu Dhabi'},
              },
              {
                '@type':'Person',
                '@id':'https://silwadi.ae/doctors/dr-kashmira-pawar-jayprakash.html#person',
                'name':'Dr. Kashmira Pawar Jayprakash',
                'jobTitle':'Specialist Pediatric Dentist',
                'url':'https://silwadi.ae/doctors/dr-kashmira-pawar-jayprakash.html',
                'worksFor':{'@id':'https://silwadi.ae/#organization'},
                'knowsAbout':['Pediatric Dentistry','Preventive Dentistry','Pulp Therapy','Dental Trauma'],
              },
              {
                '@type':'FAQPage',
                '@id':'https://silwadi.ae/treatments/pediatric-dentistry.html#faq',
                'mainEntity':[
                  {'@type':'Question','name':'When should my child first see a dentist?','acceptedAnswer':{'@type':'Answer','text':'A first dental visit is generally recommended by the first birthday, or sooner if there is pain, visible decay, trauma or another concern. Early visits focus mainly on prevention and development.'}},
                  {'@type':'Question','name':'Do baby teeth really need treatment?','acceptedAnswer':{'@type':'Answer','text':'Yes. Baby teeth support chewing, speech and space for developing permanent teeth. The right treatment depends on the tooth, symptoms, clinical findings and prognosis.'}},
                  {'@type':'Question','name':'What if my child is scared of the dentist?','acceptedAnswer':{'@type':'Answer','text':'Pediatric care can use age-appropriate communication and behavior guidance. Nitrous oxide conscious sedation may also be considered when clinically appropriate after assessment.'}},
                  {'@type':'Question','name':'What should I do after a dental injury?','acceptedAnswer':{'@type':'Answer','text':'Contact a dental professional promptly if a tooth is chipped, loose, displaced or causing significant pain. The next step depends on the injury and whether the affected tooth is primary or permanent.'}},
                ],
              },
            ],
          }
          text = text.replace('  <style>', '  <script type="application/ld+json" data-seo-schema>' + json.dumps(schema, separators=(',',':')) + '</script>\n  <style>', 1)

          global_css = r'''
    .global-header{position:sticky;top:0;z-index:120;background:#fff;border-bottom:1px solid rgba(8,56,71,.08);box-shadow:0 3px 14px rgba(8,56,71,.035)}
    .global-header__inner{height:76px;display:flex;align-items:center;gap:26px}.global-brand{display:flex;align-items:center;flex:0 0 auto}.global-brand img{width:76px;height:68px;object-fit:contain}.global-nav{margin-left:auto;display:flex;align-items:center;gap:27px;font-size:12px;font-weight:650;color:#375863}.global-nav a{position:relative;padding:30px 0}.global-nav a:after{content:"";position:absolute;left:0;right:100%;bottom:20px;height:1px;background:var(--pd-teal);transition:right .2s ease}.global-nav a:hover:after{right:0}.global-actions{display:flex;align-items:center;gap:10px}.global-language{height:40px;min-width:52px;padding:0 13px;border:1px solid #c8d7da;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--pd-navy);font-size:12px;font-weight:800}.global-whatsapp{height:42px;padding:0 14px;border:1px solid #b9e5c8;border-radius:5px;background:#f4fff7;color:#0a6f3a;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800}.global-whatsapp svg{width:16px;height:16px;color:#0dbf62}.global-book{height:42px;padding:0 17px;border-radius:4px;background:var(--pd-navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}.global-menu-button{display:none;width:42px;height:42px;border:1px solid var(--pd-line);border-radius:4px;background:#fff;align-items:center;justify-content:center;flex-direction:column;gap:5px;cursor:pointer;margin-left:auto}.global-menu-button span{display:block;width:18px;height:1.5px;background:var(--pd-navy)}.global-mobile-nav{display:none;background:#fff;border-bottom:1px solid var(--pd-line);box-shadow:0 16px 30px rgba(8,56,71,.08)}.global-mobile-nav__inner{padding:12px 0 18px;display:grid;gap:2px}.global-mobile-nav a{padding:13px 4px;border-bottom:1px solid #edf2f3;color:var(--pd-navy);font-size:13px;font-weight:700}.global-mobile-nav__actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.global-mobile-nav__actions a{border:1px solid var(--pd-line);padding:12px;text-align:center;border-radius:4px}.global-mobile-nav__actions a:last-child{background:var(--pd-navy);color:#fff;border-color:var(--pd-navy)}
    .pd-subnav{position:sticky;top:76px;z-index:110;background:rgba(250,252,252,.97);backdrop-filter:blur(10px);border-bottom:1px solid #e7eef0}.pd-subnav__inner{min-height:42px;display:flex;align-items:center;gap:20px}.pd-subnav__label{flex:0 0 auto;color:#8a9ba1;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-right:18px;border-right:1px solid var(--pd-line)}.pd-subnav__links{display:flex;align-items:center;gap:22px;min-width:0;font-size:10px;font-weight:700;color:#62777e;white-space:nowrap}.pd-subnav__links a:hover{color:var(--pd-teal)}
    @media(max-width:760px){.global-header__inner{height:68px}.global-brand img{width:68px;height:61px}.global-nav,.global-actions{display:none}.global-menu-button{display:flex}.global-mobile-nav.is-open{display:block}.pd-subnav{top:68px}.pd-subnav__inner{min-height:42px;gap:0;overflow-x:auto;scrollbar-width:none}.pd-subnav__inner::-webkit-scrollbar{display:none}.pd-subnav__label{display:none}.pd-subnav__links{gap:20px;padding-right:10px}}
'''
          text = text.replace('  </style>', global_css + '\n  </style>', 1)

