            'Staff training under the partnership includes communication and inclusive healthcare support.':'يشمل التدريب ضمن الشراكة أساليب التواصل ودعم الرعاية الصحية الشاملة.',
            'These points reflect the Zayed Authority announcement of 10 April 2026. Individual appointment suitability and clinical requirements are assessed by the treating team.':'تعكس هذه النقاط الإعلان الرسمي الصادر في 10 أبريل 2026. وتُقيّم ملاءمة الموعد والمتطلبات السريرية لكل حالة بواسطة الفريق المعالج.',
            'Read the official source':'قراءة المصدر الرسمي',
            'Before your visit':'قبل زيارتك',
            'Tell our Al Raha reception team about anything that may help us prepare appropriately.':'أخبر فريق الاستقبال في فرع الراحة بأي معلومات قد تساعدنا على الاستعداد للزيارة بالشكل المناسب.',
            'Mobility':'الحركة',
            'Communication':'التواصل',
            'Sensory needs':'الاحتياجات الحسية',
            'Medical support':'الدعم الطبي',
            'Caregiver requirements':'متطلبات مقدّم الرعاية',
            'Al Raha Mall branch':'فرع الراحة مول',
            'Plan your visit to Al Raha.':'خطط لزيارتك إلى فرع الراحة.',
            'Contact reception before your appointment if you would like to discuss access or support considerations.':'تواصل مع الاستقبال قبل موعدك إذا رغبت في مناقشة أي اعتبارات تتعلق بسهولة الوصول أو الدعم.',
            'Opening hours':'ساعات العمل',
            'Care setting':'بيئة الرعاية',
            'Saturday–Thursday 10:00 AM–7:00 PM · Friday closed':'السبت–الخميس 10:00 صباحاً–7:00 مساءً · الجمعة مغلق',
