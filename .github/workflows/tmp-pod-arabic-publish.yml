name: Temporary POD Arabic publisher

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-pod-arabic-publish.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Patch POD Arabic translations and exact language route
        shell: bash
        run: |
          python3 <<'PY'
