            'Official partnership logos':'شعارات الشراكة الرسمية',
            'Wide view of the accessible dental treatment room at Silwadi Dental Center, Al Raha Mall':'منظر واسع لغرفة علاج الأسنان الميسّرة في مركز سلوادي بالراحة مول',
            'Wide angled view of the accessible treatment room and dental equipment at Al Raha Mall':'منظر جانبي واسع لغرفة العلاج الميسّرة وتجهيزات الأسنان في الراحة مول',
            'Elevated view of the wheelchair-accessible dental setup at Silwadi Al Raha':'منظر مرتفع لتجهيزات علاج الأسنان المهيأة لمستخدمي الكراسي المتحركة في سلوادي الراحة',
            'Side view of the wheelchair-accessible dental chair and treatment equipment at Silwadi Al Raha':'منظر جانبي لكرسي وتجهيزات علاج الأسنان المهيأة لمستخدمي الكراسي المتحركة في سلوادي الراحة',
            'Close view of the accessible dental chair and instrument console at Silwadi Al Raha':'منظر قريب لكرسي الأسنان الميسّر ووحدة الأدوات في سلوادي الراحة',
            'Front view of the accessible dental room with treatment equipment at Silwadi Al Raha':'منظر أمامي لغرفة علاج الأسنان الميسّرة وتجهيزاتها في سلوادي الراحة',
            'Close detail of the integrated accessible dental equipment beside the wheelchair at Silwadi Al Raha':'تفاصيل قريبة لتجهيزات الأسنان الميسّرة بجانب الكرسي المتحرك في سلوادي الراحة',
            'Silwadi Dental Center Al Raha Mall location':'مركز سلوادي لطب الأسنان في الراحة مول',
            'Dr. Mohammed Munir Dental Center People of Determination logo':'شعار مركز الدكتور محمد منير لطب الأسنان لأصحاب الهمم',
            'Zayed Authority for People of Determination logo':'شعار مؤسسة زايد العليا لأصحاب الهمم',
            'Signing ceremony for the partnership between Zayed Authority for People of Determination and Dr. Mohammed Munir Dental Center':'مراسم توقيع الشراكة بين مؤسسة زايد العليا لأصحاب الهمم ومركز الدكتور محمد منير لطب الأسنان'
          })
          overrides_path.write_text(json.dumps(overrides, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          page = Path('treatments/people-of-determination.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('class="global-language" href="/ar/services.html" lang="ar" hreflang="ar"', 'class="global-language" data-page-language-switch href="/ar/treatments/people-of-determination.html" lang="ar" hreflang="ar"')
          html = html.replace('<a href="/ar/services.html" lang="ar" hreflang="ar">عربي</a>', '<a data-page-language-switch href="/ar/treatments/people-of-determination.html" lang="ar" hreflang="ar">عربي</a>')
          if 'property="og:locale:alternate"' not in html:
              html = html.replace('<meta property="og:locale" content="en_AE">', '<meta property="og:locale" content="en_AE">\n<meta property="og:locale:alternate" content="ar_AE">')
          page.write_text(html, encoding='utf-8')
          PY
      - name: Generate Arabic counterpart
        run: node tools/build-arabic-site.mjs
      - name: Keep only POD-related generated changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          keep = {
            'data/arabic-quality-overrides-critical.json',
            'treatments/people-of-determination.html',
            'ar/treatments/people-of-determination.html',
            'sitemap.xml',
          }
          rows = subprocess.check_output(['git','status','--porcelain=v1','-z']).decode().split('\0')
          for row in rows:
            if not row: continue
            path = row[3:]
            if path in keep: continue
            if row.startswith('??'):
              p = Path(path)
              if p.is_file(): p.unlink()
            else:
              subprocess.run(['git','checkout','--',path], check=True)
          PY
      - name: Add and run focused POD Arabic regression
        shell: bash
        run: |
          cat > tests/test_people_of_determination_arabic.py <<'PY'
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          EN = ROOT / 'treatments' / 'people-of-determination.html'
          AR = ROOT / 'ar' / 'treatments' / 'people-of-determination.html'

          class PodArabic(unittest.TestCase):
              def test_exact_counterparts_exist(self):
                  self.assertTrue(AR.exists())
                  en = EN.read_text(encoding='utf-8')
                  ar = AR.read_text(encoding='utf-8')
                  self.assertIn('/ar/treatments/people-of-determination.html', en)
                  self.assertIn('https://silwadi.ae/treatments/people-of-determination.html', ar)
                  self.assertIn('<html lang="ar" dir="rtl">', ar)
                  self.assertIn('أصحاب الهمم', ar)
                  self.assertIn('رعاية أسنان أصحاب الهمم', ar)
                  self.assertNotIn('علاج جذور الأسنان في أبوظبي', ar)

              def test_gallery_is_preserved(self):
                  ar = AR.read_text(encoding='utf-8')
                  for name in ('DSCF2857.webp','DSCF2848.webp','DSCF2860.webp','DSCF2868.webp','DSCF2873.webp','DSCF2877.webp','DSCF2880.webp'):
                      self.assertIn(name, ar)
                  self.assertIn('<span>07</span>', ar)

              def test_sitemap_contains_arabic_pod(self):
                  sitemap = (ROOT / 'sitemap.xml').read_text(encoding='utf-8')
                  self.assertIn('https://silwadi.ae/ar/treatments/people-of-determination.html', sitemap)

          if __name__ == '__main__': unittest.main()
          PY
          python3 tests/test_people_of_determination_arabic.py
          python3 tests/test_people_of_determination_gallery.py
          git diff --check
      - name: Commit verified POD Arabic page
        shell: bash
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/arabic-quality-overrides-critical.json treatments/people-of-determination.html ar/treatments/people-of-determination.html sitemap.xml tests/test_people_of_determination_arabic.py
          git commit -m 'fix: publish Arabic People of Determination page [skip arabic build]'
          git push
