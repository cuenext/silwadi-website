name: Publish approved Endodontics page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-publish-endodontics.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish approved page and wire SEO links
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          review = Path('review/endodontics-v4.html')
          production = Path('treatments/endodontics.html')
          services = Path('services.html')
          treatments = Path('treatments.html')
          sitemap = Path('sitemap.xml')

          source = review.read_text(encoding='utf-8')
          services_text = services.read_text(encoding='utf-8')
          treatments_text = treatments.read_text(encoding='utf-8')
          sitemap_text = sitemap.read_text(encoding='utf-8')

          production_url = 'https://silwadi.ae/treatments/endodontics.html'

          # RED / pre-publish contract: confirm we are actually publishing a new live page.
          failures = []
          if production.exists():
              failures.append('production page unexpectedly already exists')
          if 'noindex,nofollow,noarchive,nosnippet,noimageindex' not in source:
              failures.append('approved review noindex marker missing')
          if 'doctor-photo--ahmed' not in source or 'doctor-photo--lana' not in source:
              failures.append('approved doctor crop markers missing')
          if 'aspect-ratio:4/3' not in source:
              failures.append('approved mobile portrait ratio missing')
          if 'href="treatments.html#endodontics"' not in services_text:
              failures.append('services Endodontics detail link baseline changed')
          if 'id="endodontics" href="services.html#endodontics"' not in treatments_text:
              failures.append('treatments Endodontics link baseline changed')
          if production_url in sitemap_text:
              failures.append('production URL already present in sitemap')
          if failures:
              raise SystemExit('RED preflight failed: ' + '; '.join(failures))
          print('RED preflight passed: live Endodontics page is not yet published')

          # Copy the exact approved design and only convert review-only behavior to production behavior.
          live = source
          replacements = [
              (
                  '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">',
                  '<meta name="robots" content="index,follow,max-image-preview:large">',
                  'robots indexing directive',
              ),
              (
                  '<meta name="content-language" content="en">',
                  '<meta name="content-language" content="en">\n<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/endodontics.html">\n<link rel="alternate" hreflang="x-default" href="https://silwadi.ae/treatments/endodontics.html">',
                  'production head links',
              ),
              (
                  '<div class="private-note"><div class="container"><span><strong>Private review</strong> · Endodontics V4</span><span>Not published</span></div></div>\n',
                  '',
                  'private review banner',
              ),
              (
                  '<a class="brand" href="#hero">',
                  '<a class="brand" href="/" aria-label="Silwadi Dental Center home">',
                  'home logo link',
              ),
              (
                  '<nav class="nav" aria-label="Preview navigation">',
                  '<nav class="nav" aria-label="Endodontics page navigation">',
                  'page navigation label',
              ),
              (
                  'href="https://silwadi.ae/doctors/dr-ahmed-el-shehri.html" target="_blank" rel="noopener"',
                  'href="/doctors/dr-ahmed-el-shehri.html"',
                  'Ahmed internal profile link',
              ),
              (
                  'href="https://silwadi.ae/doctors/dr-lana-masoud.html" target="_blank" rel="noopener"',
                  'href="/doctors/dr-lana-masoud.html"',
                  'Lana internal profile link',
              ),
              (
                  'href="https://silwadi.ae/contact.html#consultation" target="_blank" rel="noopener"',
                  'href="/contact.html#consultation-form"',
                  'appointment link',
              ),
          ]
          for old, new, label in replacements:
              count = live.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              live = live.replace(old, new, 1)

          production.write_text(live, encoding='utf-8')

          # Services page: make the Endodontics service card and schema point to the new detailed page.
          old_schema_service = '"name":"Endodontics","provider":{"@id":"https://silwadi.ae/#organization"},"areaServed":{"@type":"City","name":"Abu Dhabi"},"url":"https://silwadi.ae/services.html#endodontics"'
          new_schema_service = '"name":"Endodontics","provider":{"@id":"https://silwadi.ae/#organization"},"areaServed":{"@type":"City","name":"Abu Dhabi"},"url":"https://silwadi.ae/treatments/endodontics.html"'
          if services_text.count(old_schema_service) != 1:
              raise SystemExit('services schema Endodontics URL: expected exactly one baseline match')
          services_text = services_text.replace(old_schema_service, new_schema_service, 1)
          if services_text.count('href="treatments.html#endodontics"') != 1:
              raise SystemExit('services card Endodontics link: expected exactly one baseline match')
          services_text = services_text.replace('href="treatments.html#endodontics"', 'href="treatments/endodontics.html"', 1)
          services.write_text(services_text, encoding='utf-8')

          # Treatments directory: link both visible option and ItemList schema to the detailed page.
          old_item = '"name":"Endodontics","url":"https://silwadi.ae/services.html#endodontics"'
          new_item = '"name":"Endodontics","url":"https://silwadi.ae/treatments/endodontics.html"'
          if treatments_text.count(old_item) != 1:
              raise SystemExit('treatments ItemList Endodontics URL: expected exactly one baseline match')
          treatments_text = treatments_text.replace(old_item, new_item, 1)
          old_option = 'id="endodontics" href="services.html#endodontics"'
          new_option = 'id="endodontics" href="treatments/endodontics.html"'
          if treatments_text.count(old_option) != 1:
              raise SystemExit('treatments visible Endodontics link: expected exactly one baseline match')
          treatments_text = treatments_text.replace(old_option, new_option, 1)
          treatments.write_text(treatments_text, encoding='utf-8')

          # Sitemap: add the new canonical URL and refresh changed directory page lastmod dates.
          dental_implants_block = '''  <url>\n    <loc>https://silwadi.ae/treatments/dental-implants.html</loc>\n    <lastmod>2026-09-12</lastmod>\n  </url>'''
          endo_block = '''  <url>\n    <loc>https://silwadi.ae/treatments/endodontics.html</loc>\n    <lastmod>2026-09-15</lastmod>\n  </url>'''
          if sitemap_text.count(dental_implants_block) != 1:
              raise SystemExit('sitemap dental implants anchor block not found exactly once')
          sitemap_text = sitemap_text.replace(dental_implants_block, dental_implants_block + '\n' + endo_block, 1)
          sitemap_text = sitemap_text.replace('<loc>https://silwadi.ae/services.html</loc>\n    <lastmod>2026-09-05</lastmod>', '<loc>https://silwadi.ae/services.html</loc>\n    <lastmod>2026-09-15</lastmod>', 1)
          sitemap_text = sitemap_text.replace('<loc>https://silwadi.ae/treatments.html</loc>\n    <lastmod>2026-09-12</lastmod>', '<loc>https://silwadi.ae/treatments.html</loc>\n    <lastmod>2026-09-15</lastmod>', 1)
          sitemap.write_text(sitemap_text, encoding='utf-8')

          # GREEN / production verification contract.
          live_check = production.read_text(encoding='utf-8')
          review_check = review.read_text(encoding='utf-8')
          services_check = services.read_text(encoding='utf-8')
          treatments_check = treatments.read_text(encoding='utf-8')
          sitemap_check = sitemap.read_text(encoding='utf-8')

          required_live = [
              '<meta name="robots" content="index,follow,max-image-preview:large">',
              '<title>Root Canal Treatment in Abu Dhabi | Silwadi Dental Center</title>',
              '<link rel="canonical" href="https://silwadi.ae/treatments/endodontics.html">',
              '<link rel="alternate" hreflang="en-AE" href="https://silwadi.ae/treatments/endodontics.html">',
              'data-seo-schema',
              'doctor-photo--ahmed',
              'doctor-photo--lana',
              'aspect-ratio:4/3',
              'fetchpriority="high"',
              'aria-label="Breadcrumb"',
              'href="/doctors/dr-ahmed-el-shehri.html"',
              'href="/doctors/dr-lana-masoud.html"',
              'href="/contact.html#consultation-form"',
          ]
          missing = [item for item in required_live if item not in live_check]
          if missing:
              raise SystemExit('GREEN live page missing: ' + '; '.join(missing))
          if 'Private review' in live_check or 'Not published' in live_check:
              raise SystemExit('GREEN live page still contains review-only banner copy')
          if 'noindex,nofollow' in live_check:
              raise SystemExit('GREEN live page still blocks indexing')
          if live_check.count('<h1>') != 1:
              raise SystemExit(f'GREEN live page must contain exactly one H1, found {live_check.count("<h1>")}')
          if 'noindex,nofollow,noarchive,nosnippet,noimageindex' not in review_check:
              raise SystemExit('GREEN review page was accidentally made indexable')
          if services_check.count('href="treatments/endodontics.html"') != 1:
              raise SystemExit('GREEN services page detailed Endodontics link missing or duplicated')
          if services_check.count('"url":"https://silwadi.ae/treatments/endodontics.html"') < 1:
              raise SystemExit('GREEN services schema does not reference production Endodontics page')
          if treatments_check.count('id="endodontics" href="treatments/endodontics.html"') != 1:
              raise SystemExit('GREEN treatments directory Endodontics link missing or duplicated')
          if treatments_check.count('"name":"Endodontics","url":"https://silwadi.ae/treatments/endodontics.html"') != 1:
              raise SystemExit('GREEN treatments ItemList Endodontics URL missing or duplicated')
          if sitemap_check.count('<loc>https://silwadi.ae/treatments/endodontics.html</loc>') != 1:
              raise SystemExit('GREEN sitemap must contain production Endodontics URL exactly once')
          print('GREEN verification passed: approved Endodontics page published, indexable, internally linked and in sitemap')
          PY

      - name: Commit production publish
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add treatments/endodontics.html services.html treatments.html sitemap.xml
          git commit -m "feat: publish approved Endodontics treatment page"
          git push
