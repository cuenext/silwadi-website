name: Temporary run pediatric endo pod polish

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/pediatric-endo-pod-polish.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and verify final Pediatric links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="treatments.html#pedodontics"', 'href="treatments/pediatric-dentistry.html"')
          p.write_text(s, encoding='utf-8')

          services = p.read_text(encoding='utf-8')
          treatments = Path('treatments.html').read_text(encoding='utf-8')
          ped = Path('treatments/pediatric-dentistry.html').read_text(encoding='utf-8')
          endo = Path('treatments/endodontics.html').read_text(encoding='utf-8')
          pod = Path('review/people-of-determination-raha-v1.html').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')

          assert 'href="treatments.html#pedodontics"' not in services
          assert services.count('treatments/pediatric-dentistry.html') >= 3
          assert 'treatments/pediatric-dentistry.html' in treatments
          assert '<meta name="robots" content="index,follow,max-image-preview:large">' in ped
          assert '<link rel="canonical" href="https://silwadi.ae/treatments/pediatric-dentistry.html">' in ped
          assert ped.count('class="global-header"') == 1
          assert ped.count('aria-label="On this page"') == 1
          assert 'Private review' not in ped
          assert '/contact.html#consultation-form' in ped
          assert '<div class="hero-actions"><a class="btn btn-primary" href="/contact.html#consultation-form">Book an Appointment</a>' in endo
          assert '<div class="hero-actions"><a class="btn btn-primary" href="#consultation">Book an Appointment</a>' not in endo
          assert '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">' in pod
          assert pod.count('class="global-header"') == 1
          assert pod.count('aria-label="On this page"') == 1
          assert '--pod-slide-width:min(60vw,760px)' in pod
          assert '--pod-slide-width:min(82vw,1120px)' not in pod
          assert ':root{--pod-slide-width:86vw}' in pod
          assert 'https://silwadi.ae/treatments/pediatric-dentistry.html' in sitemap
          print('Final Pediatric / Endodontics / POD contract passed')
          PY
      - name: Commit final link correction
        run: |
          git config user.name "ADVA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add services.html
          git commit -m "fix: point Pediatric service card to dedicated page" || echo "No content changes to commit"
          git push
