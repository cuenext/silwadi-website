name: Temporary run POD Arabic treatment fix v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-run-pod-arabic-treatment-fix-v3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse reviewed source-fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow = Path('.github/workflows/tmp-fix-pod-arabic-treatment-pairs.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply source fixes\n        run: |\n'
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit('Apply source fixes step not found')
          tail = workflow[start + len(marker):]
          m = re.search(r"^          python3 - <<'PY'\n(?P<code>[\s\S]*?)^          PY\n", tail, flags=re.M)
          if not m:
              raise SystemExit('Embedded source-fix Python block not found')
          exec(compile(textwrap.dedent(m.group('code')), 'reused-treatment-fix', 'exec'), {'__name__': '__main__'})
          PY

      - name: Patch bilingual metadata and generator guarantees
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('treatments/endodontics.html', 'treatments/pediatric-dentistry.html'):
              path = Path(filename)
              html = path.read_text(encoding='utf-8')
              tag = '<meta property="og:locale:alternate" content="ar_AE">'
              if tag not in html:
                  marker = '<meta property="og:locale" content="en_AE">'
                  if marker not in html:
                      raise SystemExit(f'{filename}: English og:locale marker missing')
                  html = html.replace(marker, marker + '\n' + tag, 1)
              path.write_text(html, encoding='utf-8')

          path = Path('tools/build-arabic-site.mjs')
          build = path.read_text(encoding='utf-8')
          if 'script[src="/arabic-static.js"]' not in build:
              needle = "  if (!document.querySelector('link[href=\"/arabic-quality.css\"]')) {\n    const link = document.createElement('link');\n    link.rel = 'stylesheet';\n    link.href = '/arabic-quality.css';\n    document.head.appendChild(link);\n  }\n\n  return '<!doctype html>\\n' + document.documentElement.outerHTML;"
              replacement = "  if (!document.querySelector('link[href=\"/arabic-quality.css\"]')) {\n    const link = document.createElement('link');\n    link.rel = 'stylesheet';\n    link.href = '/arabic-quality.css';\n    document.head.appendChild(link);\n  }\n\n  if (!document.querySelector('script[src=\"/arabic-static.js\"]')) {\n    const script = document.createElement('script');\n    script.src = '/arabic-static.js';\n    document.body.appendChild(script);\n  }\n\n  return '<!doctype html>\\n' + document.documentElement.outerHTML;"
              if needle not in build:
                  raise SystemExit('Arabic static runtime insertion marker not found')
              build = build.replace(needle, replacement, 1)
          path.write_text(build, encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Arabic build dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3

      - name: Generate paired Arabic pages
        run: node tools/build-arabic-site.mjs

      - name: Verify reported bugs and paired-language behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          pod = Path('review/people-of-determination-raha-v1.html').read_text(encoding='utf-8')
          endo = Path('treatments/endodontics.html').read_text(encoding='utf-8')
          ped = Path('treatments/pediatric-dentistry.html').read_text(encoding='utf-8')
          seo = json.loads(Path('data/arabic-seo.json').read_text(encoding='utf-8'))

          assert '--pod-slide-width:min(60vw,760px)' in pod
          assert 'aspect-ratio:3/2;overflow:hidden;border-radius:22px' in pod
          assert '.pod-clinic-slide img{display:block;width:100%;height:100%;aspect-ratio:auto' in pod

          for route, html, ar_href, wrong_href in [
              ('treatments/endodontics.html', endo, '/ar/treatments/endodontics.html', '/ar/services.html#endodontics'),
              ('treatments/pediatric-dentistry.html', ped, '/ar/treatments/pediatric-dentistry.html', '/ar/services.html#pedodontics'),
          ]:
              assert route in seo
              assert html.count('data-page-language-switch') == 2
              assert ar_href in html
              assert wrong_href not in html
              assert html.count('<meta property="og:locale:alternate" content="ar_AE">') == 1

          for route in ('endodontics', 'pediatric-dentistry'):
              ar_path = Path(f'ar/treatments/{route}.html')
              assert ar_path.exists()
              html = ar_path.read_text(encoding='utf-8')
              assert '<html lang="ar" dir="rtl"' in html or '<html dir="rtl" lang="ar"' in html
              assert '/arabic-static.js' in html
              assert html.count('data-page-language-switch') == 2
              assert '>English</a>' in html
              assert f'href="https://silwadi.ae/treatments/{route}.html"' in html
              body = html.split('<body', 1)[-1]
              body = re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>', '', body, flags=re.I)
              if route == 'endodontics':
                  assert 'علاج جذور الأسنان' in body
                  assert 'Root Canal Treatment in' not in body
              else:
                  assert 'طب أسنان الأطفال' in body
                  assert 'Specialist dental care for children' not in body

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://silwadi.ae/ar/treatments/endodontics.html' in sitemap
          assert 'https://silwadi.ae/ar/treatments/pediatric-dentistry.html' in sitemap
          print('Targeted POD + bilingual treatment verification passed')
          PY

      - name: Run relevant Arabic structural regressions
        run: |
          python -m unittest \
            tests.test_arabic_quality_seo_rebuild.ArabicQualitySeoRebuild.test_every_patient_route_has_static_arabic_html \
            tests.test_arabic_quality_seo_rebuild.ArabicQualitySeoRebuild.test_arabic_pages_have_real_arabic_metadata_and_language_attributes \
            tests.test_arabic_quality_seo_rebuild.ArabicQualitySeoRebuild.test_english_pages_point_to_static_arabic_counterparts \
            tests.test_arabic_quality_seo_rebuild.ArabicQualitySeoRebuild.test_sitemap_contains_every_arabic_route \
            tests.test_arabic_quality_seo_rebuild.ArabicQualitySeoRebuild.test_sitemap_has_complete_bilingual_pairs_and_lastmod \
            tests.test_arabic_quality_seo_rebuild.ArabicQualitySeoRebuild.test_launch_audit_understands_current_bilingual_architecture -v
          python -m unittest tests.test_arabic_structured_data -v
          python -m unittest tests.test_arabic_mobile_polish -v
          python -m unittest tests.test_booking_modal -v
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: pair Arabic treatment pages and constrain POD gallery [skip arabic build]'
          git push
