name: Treatment review regression

on:
  push:
    paths:
      - 'review/**'
      - 'tests/test_treatment_refresh_review_pages.py'
      - '.github/workflows/treatment-review-regression.yml'
  pull_request:
    paths:
      - 'review/**'
      - 'tests/test_treatment_refresh_review_pages.py'
      - '.github/workflows/treatment-review-regression.yml'

permissions:
  contents: read

jobs:
  treatment-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run treatment review contract
        run: python -m pytest -q tests/test_treatment_refresh_review_pages.py
