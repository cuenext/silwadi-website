name: Treatment review regression

on:
  push:
    paths:
      - 'review/**'
      - 'tests/test_treatment_refresh_review_pages.py'
      - '.github/workflows/treatment-review-regression.yml'
  pull_request:
    paths:
      - 'review/**'
      - 'tests/test_treatment_refresh_review_pages.py'
      - '.github/workflows/treatment-review-regression.yml'

permissions:
  contents: read

jobs:
  treatment-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run treatment review contract
        run: python -m pytest -q tests/test_treatment_refresh_review_pages.py
