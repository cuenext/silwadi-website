name: Update booking modal options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-booking-options.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify old state, patch booking options, and validate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('booking-modal.js')
          text = path.read_text(encoding='utf-8')

          # RED: desired state is not yet present.
          assert "['Prosthodontics', 'Prosthodontics']" not in text
          assert "['Bani Yas Tower', 'Bani Yas Tower']" in text
          assert "['Bani Yas Tower', 'برج بني ياس']" in text

          text = text.replace(
              "      ['Preventive Dentistry', 'Preventive Dentistry'],\n      ['Cosmetic Dentistry', 'Cosmetic Dentistry'],",
              "      ['Preventive Dentistry', 'Preventive Dentistry'],\n      ['Prosthodontics', 'Prosthodontics'],\n      ['Cosmetic Dentistry', 'Cosmetic Dentistry'],",
              1,
          )
          text = text.replace(
              "      ['Bani Yas Tower', 'Bani Yas Tower'],",
              "      ['Bani Yas Tower - Corniche Street', 'Bani Yas Tower - Corniche Street'],",
              1,
          )
          text = text.replace(
              "      ['Preventive Dentistry', 'طب الأسنان الوقائي'],\n      ['Cosmetic Dentistry', 'طب الأسنان التجميلي'],",
              "      ['Preventive Dentistry', 'طب الأسنان الوقائي'],\n      ['Prosthodontics', 'تركيبات الأسنان'],\n      ['Cosmetic Dentistry', 'طب الأسنان التجميلي'],",
              1,
          )
          text = text.replace(
              "      ['Bani Yas Tower', 'برج بني ياس'],",
              "      ['Bani Yas Tower - Corniche Street', 'برج بني ياس - شارع الكورنيش'],",
              1,
          )

          path.write_text(text, encoding='utf-8')

          # GREEN: verify both English and Arabic options and the operational values.
          updated = path.read_text(encoding='utf-8')
          assert updated.count("['Prosthodontics', 'Prosthodontics']") == 1
          assert updated.count("['Prosthodontics', 'تركيبات الأسنان']") == 1
          assert updated.count("['Bani Yas Tower - Corniche Street', 'Bani Yas Tower - Corniche Street']") == 1
          assert updated.count("['Bani Yas Tower - Corniche Street', 'برج بني ياس - شارع الكورنيش']") == 1
          assert "['Bani Yas Tower', 'Bani Yas Tower']" not in updated
          assert "['Bani Yas Tower', 'برج بني ياس']" not in updated
          PY

      - name: Run booking modal regression tests
        run: python -m unittest tests.test_booking_modal -v

      - name: Validate diff
        run: git diff --check

      - name: Commit booking modal update
        run: |
          git config user.name 'ADVA Site Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add booking-modal.js
          git diff --cached --stat
          git commit -m 'fix: update booking treatment and clinic options [skip arabic build]'
          git push
