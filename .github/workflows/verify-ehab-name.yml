name: Normalize and verify Ehab name correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ehab-name.yml'

permissions:
  contents: write

jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact pre-change content plus intended name replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          base = '6777e4d4196653187c14b727a417c8c6acf6d6ef'
          paths = [
              Path('doctors.html'),
              Path('doctors/dr-ehab-hassouneh.html'),
              Path('ar/doctors.html'),
              Path('ar/doctors/dr-ehab-hassouneh.html'),
              Path('language.js'),
              Path('app.js'),
          ]
          replacements = [
              ('Dr. Ehab Hassouneh Bassam A', 'Dr. Ehab Hassouneh'),
              ('Ehab Hassouneh Bassam A', 'Ehab Hassouneh'),
              ('إيهاب حسونة بسام أ', 'إيهاب حسونة'),
              ('إيهاب حسونة بسام', 'إيهاب حسونة'),
          ]

          for path in paths:
              before = subprocess.check_output(['git', 'show', f'{base}:{path.as_posix()}']).decode('utf-8')
              expected = before
              for old, new in replacements:
                  expected = expected.replace(old, new)
              current = path.read_text(encoding='utf-8')
              if current != expected:
                  path.write_text(expected, encoding='utf-8')

          for path in paths:
              current = path.read_text(encoding='utf-8')
              if 'Ehab Hassouneh Bassam' in current or 'إيهاب حسونة بسام' in current:
                  raise SystemExit(f'Old Ehab name remains in {path}')
          PY

          node --check app.js
          node --check language.js

      - name: Commit normalization if needed
        shell: bash
        run: |
          if git diff --quiet -- doctors.html doctors/dr-ehab-hassouneh.html ar/doctors.html ar/doctors/dr-ehab-hassouneh.html language.js app.js; then
            echo 'All target files already contain only the intended name changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctors.html doctors/dr-ehab-hassouneh.html ar/doctors.html ar/doctors/dr-ehab-hassouneh.html language.js app.js
          git commit -m 'Keep Ehab correction name-only'
          git push origin HEAD:main
