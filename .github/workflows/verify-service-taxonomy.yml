name: Apply and verify service taxonomy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-service-taxonomy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved taxonomy and motto
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy, json, re

          EN_MOTTO = 'Excellence for Every Ability, A Smile for Every Soul.'
          AR_MOTTO = 'التميّز لكل قدرة، وابتسامة لكل روح.'

          def nav(text, is_ar):
              if is_ar:
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#prosthodontics-implantology"><strong>تركيبات وزراعة الأسنان</strong><small>ترميم الأسنان وتعويض المفقود</small></a>', lambda m: f'<a href="{m.group("b")}#prosthodontics"><strong>تركيبات الأسنان</strong><small>ترميم الأسنان وتعويض المفقود</small></a><a href="{m.group("b")}#implantology"><strong>زراعة الأسنان</strong><small>زراعة وتعويض الأسنان المفقودة</small></a>', text)
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#prosthodontics-implantology"><strong>تركيبات وزراعة الأسنان</strong><span>ترميم الأسنان وتعويض المفقود</span></a>', lambda m: f'<a href="{m.group("b")}#prosthodontics"><strong>تركيبات الأسنان</strong><span>ترميم الأسنان وتعويض المفقود</span></a><a href="{m.group("b")}#implantology"><strong>زراعة الأسنان</strong><span>زراعة وتعويض الأسنان المفقودة</span></a>', text)
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#cosmetics"><strong>تجميل الأسنان</strong><small>تجميل الابتسامة</small></a>', lambda m: f'<a href="{m.group("b")}#cosmetic-dentistry"><strong>تجميل الأسنان وتبييض الأسنان</strong><small>هوليوود سمايل وتبييض احترافي</small></a>', text)
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#cosmetics"><strong>تجميل الأسنان</strong><span>تجميل الابتسامة</span></a>', lambda m: f'<a href="{m.group("b")}#cosmetic-dentistry"><strong>تجميل الأسنان وتبييض الأسنان</strong><span>هوليوود سمايل وتبييض احترافي</span></a>', text)
                  text = re.sub(r'<a href="[^"]*services\.html#teeth-whitening"><strong>تبييض الأسنان</strong><(?:small|span)>تبييض احترافي</(?:small|span)></a>', '', text)
              else:
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#prosthodontics-implantology"><strong>Prosthodontics &amp; Implantology</strong><small>Restore &amp; replace teeth</small></a>', lambda m: f'<a href="{m.group("b")}#prosthodontics"><strong>Prosthodontics</strong><small>Restore &amp; replace teeth</small></a><a href="{m.group("b")}#implantology"><strong>Implantology</strong><small>Dental implant care</small></a>', text)
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#prosthodontics-implantology"><strong>Prosthodontics &amp; Implantology</strong><span>Restore &amp; replace teeth</span></a>', lambda m: f'<a href="{m.group("b")}#prosthodontics"><strong>Prosthodontics</strong><span>Restore &amp; replace teeth</span></a><a href="{m.group("b")}#implantology"><strong>Implantology</strong><span>Dental implant care</span></a>', text)
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#cosmetics"><strong>Cosmetics</strong><small>Smile aesthetics</small></a>', lambda m: f'<a href="{m.group("b")}#cosmetic-dentistry"><strong>Cosmetic Dentistry &amp; Teeth Whitening</strong><small>Hollywood Smile &amp; professional whitening</small></a>', text)
                  text = re.sub(r'<a href="(?P<b>[^"]*services\.html)#cosmetics"><strong>Cosmetics</strong><span>Smile aesthetics</span></a>', lambda m: f'<a href="{m.group("b")}#cosmetic-dentistry"><strong>Cosmetic Dentistry &amp; Teeth Whitening</strong><span>Hollywood Smile &amp; professional whitening</span></a>', text)
                  text = re.sub(r'<a href="[^"]*services\.html#teeth-whitening"><strong>Teeth Whitening</strong><(?:small|span)>Professional whitening</(?:small|span)></a>', '', text)
              return text

          def service_schema(text):
              p = re.compile(r'(<script type="application/ld\+json" data-seo-schema(?:="")?>)(.*?)(</script>)', re.S)
              m = p.search(text)
              if not m:
                  raise RuntimeError('Missing service JSON-LD')
              data = json.loads(m.group(2))
              out, cosmetic = [], False
              for obj in data.get('@graph', []):
                  if obj.get('@type') != 'Service':
                      out.append(obj); continue
                  name = obj.get('name'); base = obj.get('url','').split('#')[0]
                  if name == 'Prosthodontics & Implantology':
                      a = copy.deepcopy(obj); a['name']='Prosthodontics'; a['url']=base+'#prosthodontics'
                      b = copy.deepcopy(obj); b['name']='Implantology'; b['url']=base+'#implantology'
                      out += [a,b]
                  elif name == 'Cosmetics':
                      a = copy.deepcopy(obj); a['name']='Cosmetic Dentistry & Teeth Whitening'; a['url']=base+'#cosmetic-dentistry'
                      out.append(a); cosmetic=True
                  elif name == 'Teeth Whitening':
                      if not cosmetic:
                          a = copy.deepcopy(obj); a['name']='Cosmetic Dentistry & Teeth Whitening'; a['url']=base+'#cosmetic-dentistry'
                          out.append(a); cosmetic=True
                  else:
                      out.append(obj)
              data['@graph'] = out
              encoded = json.dumps(data, ensure_ascii=False, separators=(',',':'))
              return text[:m.start()] + m.group(1) + encoded + m.group(3) + text[m.end():]

          def services_page(text, is_ar):
              old = re.compile(r'<article class="service-card reveal" id="prosthodontics-implantology">.*?</article>', re.S)
              if is_ar:
                  split = '<article class="service-card reveal" id="prosthodontics"><div class="service-card__image"><img src="/assets/services/prosthodontics.webp" alt="رعاية تركيبات الأسنان في مركز سلوادي بأبوظبي" width="1200" height="900" loading="lazy" decoding="async"></div><div class="service-card__body"><h2>تركيبات الأسنان</h2><p>رعاية تخصصية لترميم الأسنان أو تعويضها بالتيجان والجسور والقشور والأطقم والتركيبات المدعومة بالزراعة، بما في ذلك إعادة تأهيل الفم بالكامل عند الحاجة.</p><a class="btn btn--secondary service-card__link" href="/ar/treatments.html#prosthodontics">تعرّف إلى تركيبات الأسنان</a></div></article><article class="service-card reveal" id="implantology"><div class="service-card__image"><img src="/assets/services/prosthodontics.webp" alt="رعاية زراعة الأسنان في مركز سلوادي بأبوظبي" width="1200" height="900" loading="lazy" decoding="async"></div><div class="service-card__body"><h2>زراعة الأسنان</h2><p>تخطيط ووضع زراعة الأسنان لتعويض الأسنان المفقودة ودعم التيجان أو الجسور أو الأطقم، وفق تقييم صحة الفم واحتياجات التعويض.</p><a class="btn btn--secondary service-card__link" href="/ar/treatments/dental-implants.html">تعرّف إلى زراعة الأسنان</a></div></article>'
                  cosmetic = '<article class="service-card reveal" id="cosmetic-dentistry"><div class="service-card__image"><img src="/assets/services/cosmetics.webp" alt="تجميل الأسنان وهوليوود سمايل وتبييض الأسنان في مركز سلوادي بأبوظبي" width="1200" height="900" loading="lazy" decoding="async"></div><div class="service-card__body"><h2>تجميل الأسنان وتبييض الأسنان</h2><p>رعاية تجميلية تشمل هوليوود سمايل والقشور وتصميم الابتسامة وخيارات تبييض الأسنان الاحترافية، وتُختار بعد تقييم الأسنان واللثة والإطباق.</p><a class="btn btn--secondary service-card__link" href="/ar/treatments/cosmetic-dentistry.html">تعرّف إلى تجميل الأسنان وتبييض الأسنان</a></div></article>'
                  text = text.replace('زراعة وتيجان وجسور وأطقم تُخطط بما يناسب إطباقك.', 'تيجان وجسور وأطقم وخيارات ترميمية تُخطط بما يناسب إطباقك.')
              else:
                  split = '<article class="service-card reveal" id="prosthodontics"><div class="service-card__image"><img src="assets/services/prosthodontics.webp" alt="Prosthodontics care at Silwadi Dental Center Abu Dhabi" width="1200" height="900" loading="lazy" decoding="async"></div><div class="service-card__body"><h2>Prosthodontics</h2><p>Specialist restorative care focused on repairing or replacing teeth with crowns, bridges, veneers, dentures and implant-supported restorations, including full-mouth rehabilitation when indicated.</p><a class="btn btn--secondary service-card__link" href="treatments.html#prosthodontics">Learn More about Prosthodontics</a></div></article><article class="service-card reveal" id="implantology"><div class="service-card__image"><img src="assets/services/prosthodontics.webp" alt="Dental implant care at Silwadi Dental Center Abu Dhabi" width="1200" height="900" loading="lazy" decoding="async"></div><div class="service-card__body"><h2>Implantology</h2><p>Planning and placement of dental implants to replace missing teeth and support crowns, bridges or dentures, with treatment tailored to oral health and restorative needs.</p><a class="btn btn--secondary service-card__link" href="treatments/dental-implants.html">Learn More about Implantology</a></div></article>'
                  cosmetic = '<article class="service-card reveal" id="cosmetic-dentistry"><div class="service-card__image"><img src="assets/services/cosmetics.webp" alt="Cosmetic dentistry, Hollywood Smile and teeth whitening at Silwadi Dental Center Abu Dhabi" width="1200" height="900" loading="lazy" decoding="async"></div><div class="service-card__body"><h2>Cosmetic Dentistry &amp; Teeth Whitening</h2><p>Cosmetic dental care including Hollywood Smile planning, veneers, smile design and professional teeth whitening, selected after a clinical assessment of the teeth, gums and bite.</p><a class="btn btn--secondary service-card__link" href="treatments/cosmetic-dentistry.html">Learn More about Cosmetic Dentistry &amp; Teeth Whitening</a></div></article>'
                  text = text.replace('Implants, crowns, bridges and dentures planned around your bite.', 'Crowns, bridges, dentures and restorative planning around your bite.')
              text, n = old.subn(split, text, count=1)
              if n != 1: raise RuntimeError(f'Combined service card count was {n}')
              text, n1 = re.subn(r'<article class="service-card reveal" id="cosmetics">.*?</article>', cosmetic, text, count=1, flags=re.S)
              text, n2 = re.subn(r'<article class="service-card reveal" id="teeth-whitening">.*?</article>', '', text, count=1, flags=re.S)
              if n1 != 1 or n2 != 1: raise RuntimeError(f'Cosmetic/whitening card counts were {n1}/{n2}')
              text = text.replace('#prosthodontics-implantology', '#prosthodontics')
              return service_schema(text)

          changed=[]
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8'); old=text; is_ar='ar' in p.parts
              text=nav(text,is_ar)
              text=text.replace('services.html#prosthodontics-implantology','services.html#prosthodontics')
              text=text.replace('رعاية متخصصة وابتسامات تدوم.',AR_MOTTO) if is_ar else text.replace('Expert care. Lasting smiles.',EN_MOTTO)
              if p.as_posix()=='services.html': text=services_page(text,False)
              if p.as_posix()=='ar/services.html': text=services_page(text,True)
              if text!=old:
                  p.write_text(text,encoding='utf-8'); changed.append(str(p))
          if not changed: raise SystemExit('No HTML files changed')
          print('Updated',len(changed),'HTML files')
          PY

      - name: Verify requested state
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          EN='Excellence for Every Ability, A Smile for Every Soul.'
          AR='التميّز لكل قدرة، وابتسامة لكل روح.'
          errors=[]; files=list(Path('.').rglob('*.html'))
          for p in files:
              t=p.read_text(encoding='utf-8'); ar='ar' in p.parts
              if 'services-mega__grid' in t:
                  for a in ('#prosthodontics','#implantology','#cosmetic-dentistry'):
                      if f'services.html{a}' not in t: errors.append(f'{p}: missing {a}')
                  if 'services.html#prosthodontics-implantology' in t: errors.append(f'{p}: old combined link')
              if 'footer-bottom' in t and (AR if ar else EN) not in t: errors.append(f'{p}: motto missing')
          for page in ('services.html','ar/services.html'):
              t=Path(page).read_text(encoding='utf-8')
              for x in ('id="prosthodontics"','id="implantology"','id="cosmetic-dentistry"'):
                  if x not in t: errors.append(f'{page}: missing {x}')
              for x in ('id="prosthodontics-implantology"','id="cosmetics"','id="teeth-whitening"'):
                  if x in t: errors.append(f'{page}: obsolete {x}')
              m=re.search(r'<script type="application/ld\+json" data-seo-schema(?:="")?>(.*?)</script>',t,re.S)
              data=json.loads(m.group(1)); names=[o.get('name') for o in data.get('@graph',[]) if o.get('@type')=='Service']
              for n in ('Prosthodontics','Implantology','Cosmetic Dentistry & Teeth Whitening'):
                  if n not in names: errors.append(f'{page}: schema missing {n}')
              for n in ('Prosthodontics & Implantology','Cosmetics','Teeth Whitening'):
                  if n in names: errors.append(f'{page}: old schema {n}')
          if errors:
              print('\n'.join(errors[:100])); raise SystemExit(1)
          print('Verified',len(files),'HTML files')
          PY

      - name: Check diff
        run: git diff --check && git diff --stat

      - name: Commit site update
        run: |
          git config user.name "ADVA"
          git config user.email "abdullahavadoglu@gmail.com"
          git add -- '*.html'
          git commit -m "fix: separate service categories and add official motto [skip arabic build]"
          git push
