<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>Private Review — POD Video Section | Silwadi</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f8f8;color:#173b44;font-family:Arial,sans-serif}
    .review-loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
    .review-loading strong{display:block;color:#083847;font-size:18px}.review-loading span{display:block;margin-top:8px;color:#667c83;font-size:13px}
  </style>
</head>
<body>
  <div class="review-loading" id="reviewLoading"><div><strong>Loading POD video review…</strong><span>Private review page — not indexed.</span></div></div>
  <script>
    (async () => {
      const sourceUrl = './people-of-determination-raha-v1.html';
      const videoSection = `
        <section class="pod-video-review" data-pod-video-review aria-labelledby="pod-video-review-title">
          <div class="container pod-video-review__inner">
            <header class="pod-video-review__head">
              <p class="pod-video-review__eyebrow">Al Raha Mall · Accessible care in practice</p>
              <h2 id="pod-video-review-title">See our POD care in practice.</h2>
              <p>A closer look at how our Al Raha team delivers care in an environment designed around accessibility, comfort and individualized support.</p>
            </header>

            <div class="pod-video-review__frame">
              <video controls playsinline preload="metadata" poster="../assets/video/pod-raha-care-review-poster.webp?v=20260920-720hq" aria-label="People of Determination dental care at Silwadi Al Raha Mall">
                <source src="../assets/video/pod-raha-care-720-hq.mp4?v=20260920-720hq" type="video/mp4">
                Your browser does not support HTML5 video.
              </video>
            </div>

          </div>
        </section>
      `;

      const videoStyles = `
        <style id="pod-video-review-styles">
          .pod-video-review{position:relative;overflow:hidden;padding:92px 0 88px;background:linear-gradient(180deg,#fff 0%,#f7fbfb 100%);border-bottom:1px solid rgba(8,56,71,.08)}
          .pod-video-review:before{content:"";position:absolute;width:460px;height:460px;right:-260px;top:-290px;border:1px solid rgba(15,125,140,.08);border-radius:50%;box-shadow:0 0 0 72px rgba(82,219,224,.025),0 0 0 144px rgba(82,219,224,.018);pointer-events:none}
          .pod-video-review__inner{position:relative;z-index:1}
          .pod-video-review__head{max-width:790px;margin:0 auto 34px;text-align:center}
          .pod-video-review__eyebrow{margin:0 0 13px;color:var(--pod-teal,#0f7d8c);font-size:10.5px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
          .pod-video-review__head h2{margin:0;color:var(--pod-deep,#052d38);font-size:clamp(38px,4.4vw,56px);line-height:1.04;letter-spacing:-.045em;font-weight:680}
          .pod-video-review__head p:last-child{max-width:680px;margin:18px auto 0;color:var(--pod-muted,#667c83);font-size:14px;line-height:1.75}
          .pod-video-review__frame{position:relative;max-width:1160px;margin:0 auto;overflow:hidden;border-radius:24px;background:#031f27;box-shadow:0 30px 70px rgba(3,47,59,.16),0 8px 20px rgba(3,47,59,.08);border:1px solid rgba(8,56,71,.09)}
          .pod-video-review__frame:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
          .pod-video-review__frame video{display:block;width:100%;height:auto;aspect-ratio:2/1;background:#031f27;object-fit:cover}
          @media (max-width: 900px){.pod-video-review{padding:72px 0}.pod-video-review__frame{border-radius:19px}}
          @media (max-width: 700px){.pod-video-review{padding:58px 0 60px}.pod-video-review__head{margin-bottom:24px}.pod-video-review__head h2{font-size:34px}.pod-video-review__head p:last-child{font-size:13px;line-height:1.68}.pod-video-review__frame{border-radius:15px;box-shadow:0 18px 42px rgba(3,47,59,.14)}}
        </style>
      `;

      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Unable to load review source (${response.status})`);
        let html = await response.text();
        const anchor = '<section class="pod-section" id="individual-care">';
        if (!html.includes(anchor)) throw new Error('POD review insertion point was not found.');
        html = html.replace('</head>', videoStyles + '</head>');
        html = html.replace(anchor, videoSection + anchor);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loading = document.getElementById('reviewLoading');
        if (loading) loading.innerHTML = `<div><strong>Review page could not be loaded.</strong><span>${String(error.message || error)}</span></div>`;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
